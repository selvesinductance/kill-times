        },
      ],
      [
        0.004,
        () => {
          if (!is3D()) return;
          FX.addTrauma(0.45);
          FX.flash(0.6);
          burst3([0, E.DC[1], E.FACE_Z + 20], 46, ['#ffffff', C.spark, C.cyan], [300, 1300], [0.3, 0.8]);
        },
      ], // 3D: 扉が弾けるように開く
      [
        3 / 14,
        () => {
          if (!is3D()) return;
          const b = ball3(3 / 14);
          const [x, y] = loc(b);
          FX.shock(x, y, '#ffffff', 380, 0.35, { width: 14 });
          burst3(b, 24, ['#ffffff', C.spark], [200, 700], [0.3, 0.6]);
        },
      ], // 3D: 光を抜けて頂点
    ],
    draw(ctx, u, o) {
      const S = scroll(u);
      const sp = Math.sin(Math.PI * seg(u, 0.16, 0.74));
      const [bx, by] = ball(u);
      ctx.strokeStyle = '#ffffff';
      ctx.lineCap = 'round'; // 縦穴の風切り線
      for (let i = 0; i < 26; i++) {
        const x = ((i * 173) % 1000) - 500;
        const y = ((((i * 311 - S * 1.6) % 2600) + 2600) % 2600) - 1300;
        ctx.globalAlpha = 0.35 * sp;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x, y + 60 + 200 * sp);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      lineW(ctx, -470, -S - 2000, -470, FALL - S - 300, 10, '#241f3a'); // 縦穴の壁
      lineW(ctx, 470, -S - 2000, 470, FALL - S - 300, 10, '#241f3a');
      tiles(ctx, u, S, by);
      const k = split(u); // 割れる扉と、あふれる光
      if (k < 700 && S < 1400) {
        const lw = k * 2;
        if (lw > 1) {
          const gr = ctx.createLinearGradient(-lw / 2, 0, lw / 2, 0);
          gr.addColorStop(0, hexA(C.spark, 0));
          gr.addColorStop(0.5, 'rgba(255,255,255,0.95)');
          gr.addColorStop(1, hexA(C.spark, 0));
          ctx.globalAlpha = 1 - seg(u, 0.12, 0.32);
          ctx.fillStyle = gr;
          ctx.fillRect(-lw / 2, -1400 - S, lw, 2800);
          ctx.globalAlpha = 1;
        }
        doorHalf(ctx, -1, -k, -S);
        doorHalf(ctx, 1, k, -S);
      }
      ctx.save();
      ctx.translate(0, FALL - S); // 縄の部屋（落下の終わりに下から上がってくる）
      RR.floor(ctx);
      RR.pulley(ctx);
      lineW(ctx, RR.TOP[0] + 40, RR.TOP[1], RR.WEIGHT.x, RR.WEIGHT.y - RR.WEIGHT.h / 2 - 36, 12, shade(C.magenta, -0.2));
      RR.weight(ctx, RR.WEIGHT.y);
      RR.bollard(ctx);
      const g = Timeline[3].gateObj;
      if (!o.omitGateObject && g) g.draw(ctx); // 斜めの縄（凍結中はゲートが描く）
      ctx.restore();
      drawSpark(ctx, bx, by, 24);
      disc(ctx, bx, by, 26, C.spark);
      disc(ctx, bx - 8, by - 8, 7, 'rgba(255,255,255,0.6)');
    },
    gate: Object.assign({ color: CONFIG.colors.magenta }, RopeRoom.ROPE),
  });
})();

// ===== 64_stage_D.js =====
// 区間D 衝撃（10.0–13.5秒）→ G4 回す
// 縄が弾けて重りが落下 → 床が砕けて破片が飛ぶ → 下の機械室へ落ちる（世界が上へ流れる）
// → 歯車が滑り込んで噛み合い、回路線が描かれる → 光点が大ダイヤルの軸に吸い込まれる

// 機械室の部品（区間Eでも使う）
const MachineRoom = (() => {
  const C = CONFIG.colors;
  const DIAL = { x: 0, y: 100 };
  const GEARS = [
    [-420, -220, 170, 18, 1],
    [440, 250, 140, 15, -1],
    [-380, 400, 110, 12, -1],
  ];
  const CIRCUITS = [
    [
      [-560, -260],
      [-300, -260],
      [-300, -40],
      [-190, -40],
    ],
    [
      [560, -300],
      [320, -300],
      [320, -60],
      [190, 20],
    ],
    [
      [-560, 420],
      [-260, 420],
      [-150, 250],
    ],
    [
      [560, 460],
      [240, 460],
      [150, 260],
    ],
    [
      [0, -560],
      [0, -300],
      [-60, -240],
    ],
    [
      [-560, 120],
      [-220, 120],
    ],
  ];
  const segLen = (a, b) => Math.hypot(b[0] - a[0], b[1] - a[1]);
  const total = pts => pts.slice(1).reduce((s, p, i) => s + segLen(pts[i], p), 0);
  function pointAt(pts, k) {
    let left = total(pts) * clamp(k);
    for (let i = 1; i < pts.length; i++) {
      const L = segLen(pts[i - 1], pts[i]);
      if (left <= L) {
        const f = L ? left / L : 0;
        return [lerp(pts[i - 1][0], pts[i][0], f), lerp(pts[i - 1][1], pts[i][1], f)];
      }
      left -= L;
    }
    return pts[pts.length - 1];
  }
  function polyline(ctx, pts, k, color) {
    // 回路線を k（0→1）まで描く
    let left = total(pts) * k;
    ctx.strokeStyle = color;
    ctx.lineWidth = 8;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length && left > 0; i++) {
      const L = segLen(pts[i - 1], pts[i]);
      const f = Math.min(1, left / L);
      ctx.lineTo(lerp(pts[i - 1][0], pts[i][0], f), lerp(pts[i - 1][1], pts[i][1], f));
      left -= L;
    }
    ctx.stroke();
    disc(ctx, pts[0][0], pts[0][1], 10, color);
    if (k >= 1) {
      const e = pts[pts.length - 1];
      disc(ctx, e[0], e[1], 12, color);
    }
  }
  return {
    C,
    DIAL,
    CIRCUITS,
    GEARS,
    pointAt,
    gears(ctx, slide, ang) {
      // slide(i): 滑り込み 0→1、ang: 回転角
      GEARS.forEach(([x, y, r, n, dir], i) => {
        const gx = x + (x < 0 ? -700 : 700) * (1 - slide(i));
        gear(ctx, gx, y, r, n, dir * ang, '#23263d', r * 0.14);
        disc(ctx, gx, y, r * 0.3, '#1a1c2e');
      });
    },
    circuits(ctx, prog) {
      // prog(i): 伸び 0→1
      CIRCUITS.forEach((pts, i) => {
        const k = prog(i);
        if (k > 0) polyline(ctx, pts, k, i % 2 ? C.coral : shade(C.coral, -0.35));
      });
    },
  };
})();

(() => {
  // 床が砕けるのは 0.25秒（8分）
  const RR = RopeRoom;
  const MR = MachineRoom;
  const C = RR.C;
  const DROP = 1500;
  const DIAL = MR.DIAL;
  const HIT = 1 / 14;
  const scroll = u => DROP * Ease.outCubic(seg(u, 0.03, 0.45)); // カメラは落ちる玉と一緒に機械室へ
  const sec = u => Math.max(0, (u - HIT) * 3.5); // 床が砕けてからの秒数
  const weightY = u =>
    u < HIT
      ? lerp(RR.WEIGHT.y, RR.FLOOR - RR.WEIGHT.h / 2, Ease.inCubic(u / HIT))
      : RR.FLOOR - RR.WEIGHT.h / 2 + 2600 * Math.pow(seg(u, HIT, 0.5), 2);

  const shards = (() => {
    // 床の破片（シード固定）
    const R = rng(21);
    const out = [];
    for (let i = 0; i < 16; i++) {
      const cx = -640 + i * 85 + 40;
      out.push({
        cx,
        w: 80,
        vx: (cx - RR.WEIGHT.x) * 1.6 + (R() - 0.5) * 300,
        vy: -450 - R() * 550,
        spin: (R() - 0.5) * 12,
        color: i % 3 ? '#261d3a' : '#3a2e55',
      });
    }
    return out;
  })();
  const cut = () => {
    const g3 = Timeline[3].gateObj;
    return g3 && g3.cut ? g3.cut : { x: RR.ROPE.x, y: RR.ROPE.y };
  };

  // 玉: 区間Cの終わり (60, −400) から落ち続け、砕けた床を抜ける → 強い磁石に捕まって急ブレーキ、震えながら浮く
  //     → 近づくほど速く、渦を巻いて一気にダイヤルの軸へ吸い寄せられる（3.0秒、拍）
  const B0 = [60, -400];
  const V0Y = 2630;
  const GD = 800;
  const T_CATCH = 0.5;
  const T_PULL = 1.9;
  const T_SNAP = 3.0;
  const HOVER = [-230, DROP - 330];
  const DIALW = [DIAL.x, DIAL.y + DROP];
  function ballWorld(u) {
    // 縄の部屋の座標（y下向き）
    const t = u * 3.5;
    const fall = tt => [B0[0] - 40 * tt, B0[1] + V0Y * tt + 0.5 * GD * tt * tt];
    if (t < T_CATCH) return [...fall(t), 26];
    if (t < T_PULL) {
      const pc = fall(T_CATCH);
      const k = Ease.outCubic(seg(t, T_CATCH, T_CATCH + 0.45));
      const w = seg(t, T_CATCH + 0.3, T_CATCH + 0.6) * (1 - seg(t, T_PULL - 0.2, T_PULL));
      return [lerp(pc[0], HOVER[0], k) + 12 * Math.sin(t * 61) * w, lerp(pc[1], HOVER[1], k) + 9 * Math.cos(t * 53) * w, 26];
    }
    const k = Math.pow(seg(t, T_PULL, T_SNAP), 4);
    const a = 2.2 * k;
    const dx = HOVER[0] - DIALW[0];
    const dy = HOVER[1] - DIALW[1];
    return [
      DIALW[0] + (dx * Math.cos(a) - dy * Math.sin(a)) * (1 - k),
      DIALW[1] + (dx * Math.sin(a) + dy * Math.cos(a)) * (1 - k),
      26 * (1 - seg(t, T_SNAP, T_SNAP + 0.25)),
    ];
  }
  const magnet = u => {
    const t = u * 3.5;
    return t < T_CATCH
      ? 0
      : t < T_PULL
        ? 0.35 + 0.25 * Math.abs(Math.sin(t * 37))
        : t < T_SNAP
          ? 0.5 + 0.5 * seg(t, T_PULL, T_SNAP)
          : 1 - seg(t, T_SNAP, T_SNAP + 0.2);
  };
  function ballPos(u) {
    const [x, y, r] = ballWorld(u);
    return [x, y - scroll(u), r];
  }

  // ---- 3D: 縄が切れて重りが落ち、床が砕ける → 玉と一緒に下の機械室へ落ちる → 歯車・回路・大ダイヤル → G4
  // 平面は区間Cと同じ向き（x=0、+x 側から見る）。2D は世界を DROP だけ上へ流すので、平面も scroll(u) だけ下がる
  // 縄の部屋 / 機械室の2D座標 → 3D
  const P = (x, y) => RR.P3(x, y);
  const PM = (x, y) => RR.P3(x, y + DROP);
  MR.PM = PM; // 区間E（3D）も機械室の平面を使う
  const mat = (color, e = 0.3) => World3D.mat(color, e, 0.6, 0.15);
  function gearGeo(r, n, depth) {
    // 歯車（xy 平面の形を z へ押し出す）
    const sh = new THREE.Shape();
    for (let i = 0; i < n * 4; i++) {
      const a = (i / (n * 4)) * Math.PI * 2;
      const rr = i % 4 < 2 ? r : r * 0.84;
      if (i === 0) sh.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
      else sh.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    sh.closePath();
    const hole = new THREE.Path();
    hole.absarc(0, 0, r * 0.3, 0, Math.PI * 2, true);
    sh.holes.push(hole);
    const g = new THREE.ExtrudeGeometry(sh, { depth, bevelEnabled: false, curveSegments: 12 });
    g.translate(0, 0, -depth / 2);
    return g;
  }
  // 大ダイヤルの絵（ゲートの2Dの絵をそのまま板に描く）
  const DTEX = 512;
  const DSPAN = 620;
  const DK = DTEX / DSPAN;
  const three = {
    build(scene) {
      const grp = new THREE.Group();
      const T = {};
      T.ball = new THREE.Mesh(new THREE.SphereGeometry(34, 28, 18), mat(C.spark, 0.8));
      T.glow = World3D.glow(C.spark, 260);
      T.mag = new THREE.Mesh(
        new THREE.CylinderGeometry(7, 7, 1, 8),
        new THREE.MeshBasicMaterial({ color: C.violet, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }),
      ); // 磁力の線
      T.magGlow = World3D.glow(C.violet, 500);
      grp.add(T.mag, T.magGlow);
      T.ropeL = new THREE.Mesh(new THREE.CylinderGeometry(8, 8, 1, 10), mat(C.magenta, 0.45));
      T.ropeR = new THREE.Mesh(new THREE.CylinderGeometry(8, 8, 1, 10), mat(C.magenta, 0.45));
      const R = rng(33);
      T.shards = []; // 砕けた床（16列 × 奥行き4）
      shards.forEach(sd => {
        for (let k = 0; k < 4; k++) {
          const m = new THREE.Mesh(new THREE.BoxGeometry(170, 70, 80), mat(sd.color, 0.2));
          m.userData = { sd, dx: -310 + k * 175 - 50, vx: (R() - 0.5) * 900 + (k - 1.5) * 260, sa: (R() - 0.5) * 8, sb: (R() - 0.5) * 8 };
          m.visible = false;
          T.shards.push(m);
        }
      });
      const back = new THREE.Mesh(new THREE.PlaneGeometry(1700, 1500), mat('#141626', 0.25)); // 機械室の奥の壁
      back.position.set(-120, ...PM(0, 40).slice(1));
      back.rotation.y = Math.PI / 2;
      T.gears = MR.GEARS.map(([x, y, r, n]) => {
        const m = new THREE.Mesh(gearGeo(r, n, 50), mat('#2b2f4d', 0.3));
        m.rotation.y = Math.PI / 2;
        return m;
      });
      T.hubs = MR.GEARS.map(([, , r]) => {
        const m = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.3, r * 0.3, 60, 20), mat('#1a1c2e', 0.2));
        m.rotation.z = Math.PI / 2;
        return m;
      });
      T.circ = MR.CIRCUITS.map((pts, i) => {
        // 回路線: 線分ごとの細い円柱を途中まで伸ばす
        const col = i % 2 ? C.coral : shade(C.coral, -0.35);
        const segs = pts.slice(1).map(() => new THREE.Mesh(new THREE.CylinderGeometry(5, 5, 1, 8), mat(col, 0.7)));
        const a = new THREE.Mesh(new THREE.SphereGeometry(10, 12, 8), mat(col, 0.7));
        const b = new THREE.Mesh(new THREE.SphereGeometry(12, 12, 8), mat(col, 0.9));
        a.position.set(-100, ...PM(...pts[0]).slice(1));
        b.position.set(-100, ...PM(...pts[pts.length - 1]).slice(1));
        return { pts, segs, a, b };
      });
      const cv = document.createElement('canvas');
      cv.width = cv.height = DTEX;
      T.dctx = cv.getContext('2d');
      T.dtex = new THREE.CanvasTexture(cv);
      T.dial = new THREE.Mesh(new THREE.PlaneGeometry(DSPAN, DSPAN), new THREE.MeshBasicMaterial({ map: T.dtex, transparent: true }));
      T.dial.position.set(-60, ...PM(DIAL.x, DIAL.y).slice(1));
      T.dial.rotation.y = Math.PI / 2;
      T.dialBack = new THREE.Mesh(new THREE.CylinderGeometry(215, 215, 40, 48), mat('#23263d', 0.3)); // ダイヤルの台（板の奥）
      T.dialBack.position.set(-85, ...PM(DIAL.x, DIAL.y).slice(1));
      T.dialBack.rotation.z = Math.PI / 2;
      T.back = back;
      [T.ball, T.glow, T.ropeL, T.ropeR, ...T.shards, back, ...T.gears, ...T.hubs, T.dial, T.dialBack].forEach(o => grp.add(o));
      T.circ.forEach(c => {
        c.segs.forEach(m => grp.add(m));
        grp.add(c.a, c.b);
      });
      // 機械室の奥の壁: 歯車の後ろで音の粒が下から立ちのぼる
      T.spec = World3D.addSpectrum({
        parent: grp,
        pos: [-112, ...PM(0, 720).slice(1)],
        x: [0, 0, -1],
        y: [1, 0, 0],
        z: [0, -1, 0],
        size: [820, 60, 1350],
      });
      scene.add(grp);
      this.group = grp;
      this.T = T;
    },
    update(u, o) {
      const T = this.T;
      const S = scroll(u);
      const t = sec(u);
      const CT = StageDefs.C.three;
      if (CT.group) {
        // 区間Cの縄の部屋を使い続ける（上へ流れ去るまで）
        const K = CT.T;
        CT.group.visible = u < 0.75;
        [K.rope, K.ball, K.glow, K.wind].forEach(m => {
          m.visible = false;
        });
        K.floor.visible = K.edge.visible = u < HIT;
        K.weight.visible = K.label.visible = K.hang.visible = u < 0.55; // 重りは機械室の下へ抜けたら消す
        const wy = weightY(u);
        const rot = u < HIT ? 0 : 0.3 * seg(u, HIT, 0.4);
        const W = RR.WEIGHT;
        K.weight.position.set(...P(W.x, wy));
        K.weight.rotation.set(-rot, Math.PI / 4, 0, 'XYZ');
        K.label.position.set(W.w * 0.5 + 4, K.weight.position.y - 16, K.weight.position.z);
        K.label.rotation.set(-rot, Math.PI / 2, 0, 'XYZ');
        World3D.stretch(K.hang, P(u < HIT ? RR.TOP[0] + 40 : W.x, u < HIT ? RR.TOP[1] : wy - 300), P(W.x, wy - W.h / 2 - 36));
        K.wheel.rotation.x = u * 20;
      }
      const c = cut();
      const [nx, ny] = RR.NORMAL;
      const drop = Ease.outCubic(seg(u, 0, 0.25));
      const pull = Ease.inCubic(seg(u, 0, 0.1));
      World3D.stretch(T.ropeL, P(...RR.LOW), P(lerp(c.x, RR.LOW[0], 0.55) + nx * 60, lerp(c.y, RR.LOW[1], 0.55) + ny * 60 + 220 * drop)); // 垂れ下がる左の切れ端
      T.ropeL.visible = u < 0.6;
      T.ropeR.visible = pull < 1 && u < 0.6; // 右の切れ端は滑車へ引き込まれる（縄の部屋が遠ざかったら隠す）
      if (pull < 1)
        World3D.stretch(
          T.ropeR,
          P(...RR.TOP),
          P(lerp(lerp(c.x, RR.TOP[0], 0.55) - nx * 60, RR.TOP[0], pull), lerp(lerp(c.y, RR.TOP[1], 0.55) - ny * 60, RR.TOP[1], pull)),
        );
      T.shards.forEach(m => {
        // 床の破片（2Dの動き＋奥行きの速さと回転）
        const { sd, dx, vx, sa, sb } = m.userData;
        m.visible = u >= HIT && t < 1.6;
        if (!m.visible) return;
        const p = P(sd.cx + sd.vx * t, RR.FLOOR + 35 + sd.vy * t + 1200 * t * t);
        m.position.set(dx + vx * t, p[1], p[2]);
        m.rotation.set(-sd.spin * t, sa * t, sb * t);
      });
      MR.GEARS.forEach(([x, y, r, n, dir], i) => {
        // 歯車が左右から滑り込んで回る
        const gx = x + (x < 0 ? -700 : 700) * (1 - Ease.outBack(seg(u, 0.3 + i * 0.06, 0.55 + i * 0.06)));
        const p = PM(gx, y);
        T.gears[i].position.set(-40, p[1], p[2]);
        T.gears[i].rotation.z = -dir * u * 6;
        T.hubs[i].position.set(-20, p[1], p[2]);
      });
      T.circ.forEach(({ pts, segs, a, b }, i) => {
        // 回路線が伸びる
        const k = Ease.inOutCubic(seg(u, 0.45 + i * 0.04, 0.72 + i * 0.04));
        let left = k * pts.slice(1).reduce((s2, q, j) => s2 + Math.hypot(q[0] - pts[j][0], q[1] - pts[j][1]), 0);
        segs.forEach((m, j) => {
          const p0 = pts[j];
          const p1 = pts[j + 1];
          const L = Math.hypot(p1[0] - p0[0], p1[1] - p0[1]);
          const f = clamp(left / L);
          m.visible = f > 0.001;
          left -= L;
          if (m.visible) {
            const e0 = PM(...p0);
            const e1 = PM(lerp(p0[0], p1[0], f), lerp(p0[1], p1[1], f));
            e0[0] = e1[0] = -100;
            World3D.stretch(m, e0, e1);
          }
        });
        a.visible = k > 0;
        b.visible = k >= 1;
      });
      T.dial.visible = !o.omitGateObject && u > 0.25; // 凍結中はゲートが描く
      if (T.dial.visible) {
        const g = Timeline[4].gateObj;
        const x = T.dctx;
        x.setTransform(1, 0, 0, 1, 0, 0);
        x.clearRect(0, 0, DTEX, DTEX);
        x.setTransform(DK, 0, 0, DK, (DSPAN / 2 - DIAL.x) * DK, (DSPAN / 2 - DIAL.y) * DK);
        if (g) g.draw(x);
        T.dtex.needsUpdate = true;
      }
      // 磁力: 玉とダイヤルの軸をつなぐ線と、軸の光
      const mg = magnet(u);
      const dc = PM(DIAL.x, DIAL.y);
      T.mag.visible = T.magGlow.visible = mg > 0.01;
      // 玉（2Dの流れない座標 → 3D）
      const [bx, by, br] = ballPos(u);
      const bp = P(bx, by + S);
      if (mg > 0.01) {
        World3D.stretch(T.mag, bp, [dc[0] - 50, dc[1], dc[2]]);
        T.mag.material.opacity = 0.2 + 0.6 * mg * (0.6 + 0.4 * Math.sin(u * 300));
        T.magGlow.position.set(dc[0] - 40, dc[1], dc[2]);
        T.magGlow.scale.setScalar(300 + 500 * mg);
      }
      T.ball.visible = T.glow.visible = br > 0.5;
      T.ball.position.set(...bp);
      T.ball.scale.setScalar(Math.max(0.01, br / 26));
      T.glow.position.set(...bp);
      T.glow.scale.setScalar(260 * (br / 26) * (1 + 0.15 * Beat.pulse));
    },
    camera(u) {
      const d0 = World3D.fitDist(50);
      const S = scroll(u);
      const zoom = 1.05 - 0.05 * Ease.inOutCubic(seg(u, 0.05, 0.4)) + 0.04 * Ease.inOutCubic(seg(u, 0.6, 1));
      const f = [0, RR.RY - S, RR.RZ];
      const R = d0 / zoom;
      // 落ちる間は回り込んで奥行きを見せる
      const yaw = Math.PI / 2 - 0.35 * Math.sin(Math.PI * seg(u, 0.1, 0.8));
      const el = 0.12 * Math.sin(Math.PI * seg(u, 0.08, 0.6));
      const pos = [f[0] + R * Math.sin(yaw) * Math.cos(el), f[1] + R * Math.sin(el), f[2] + R * Math.cos(yaw) * Math.cos(el)];
      return { pos, look: f, up: [0, 1, 0], fov: 50, roll: -0.05 * Math.sin(Math.PI * seg(u, 0.1, 0.6)) };
    },
    plane: u => ({ o: [0, RR.RY - scroll(u), RR.RZ], r: [0, 0, -1], d: [0, -1, 0] }), // 2Dの画面の座標（流れる世界に合わせて下がる）
  };

  defineStage('D', {
    origin: StageB.ORIGIN_NEXT,
    camera: u =>
      Camera.make(
        0,
        0,
        1.05 - 0.05 * Ease.inOutCubic(seg(u, 0.05, 0.4)) + 0.04 * Ease.inOutCubic(seg(u, 0.6, 1)),
        -0.05 * Math.sin(Math.PI * seg(u, 0.1, 0.6)),
      ),
    events: [
      [
        HIT,
        () => {
          // 重りが床に当たる
          FX.addTrauma(0.9);
          FX.kick(0.08);
          FX.flash(0.25);
          FX.shock(RR.WEIGHT.x, RR.FLOOR, '#ffffff', 900, 0.4, { width: 34 });
          FX.burst(RR.WEIGHT.x, RR.FLOOR, {
            n: 50,
            dir: -Math.PI / 2,
            spread: 2.6,
            colors: [C.coral, '#ffffff', C.spark],
            kinds: ['streak', 'dot'],
            speed: [400, 1400],
            life: [0.3, 0.7],
          });
        },
      ],
      [
        1 / 7,
        () => {
          // 磁石に捕まる
          const [x, y] = ballPos(1 / 7);
          FX.addTrauma(0.35);
          FX.shock(x, y, C.violet, 300, 0.3, { width: 14 });
          FX.burst(x, y, { n: 24, colors: [C.violet, C.cyan, '#ffffff'], kinds: ['streak', 'dot'], speed: [300, 900], life: [0.2, 0.45] });
          if (Sound.ctx) Sound.tone(90, 0.3, { type: 'square', vol: 0.12, to: 60, glide: 0.2, lp: 900 });
        },
      ],
      [
        T_PULL / 3.5,
        () => {
          if (Sound.ctx) Sound.tone(160, T_SNAP - T_PULL, { type: 'sawtooth', vol: 0.06, to: 1400, glide: T_SNAP - T_PULL, lp: 3000 });
        },
      ], // 吸い寄せられる唸り
      [9 / 14, () => FX.addTrauma(0.25)],
      [
        6 / 7,
        () => {
          FX.shock(DIAL.x, DIAL.y, C.coral, 520, 0.35, { width: 26 });
          FX.burst(DIAL.x, DIAL.y, { n: 40, colors: [C.spark, C.coral, '#ffffff'], speed: [300, 1100], life: [0.25, 0.5] });
          FX.addTrauma(0.6);
          FX.kick(0.06);
        },
      ], // 吸い込まれて「ガチッ」
    ],
    draw(ctx, u, o) {
      const S = scroll(u);
      const t = sec(u);
      ctx.save();
      ctx.translate(0, DROP - S); // 機械室（下から上がってくる）
      MR.gears(ctx, i => Ease.outBack(seg(u, 0.3 + i * 0.06, 0.55 + i * 0.06)), u * 6);
      MR.circuits(ctx, i => Ease.inOutCubic(seg(u, 0.45 + i * 0.04, 0.72 + i * 0.04)));
      const g = Timeline[4].gateObj;
      if (!o.omitGateObject && g) g.draw(ctx); // 大ダイヤル（凍結中はゲートが描く）
      ctx.restore();

      ctx.save();
      ctx.translate(0, -S); // 縄の部屋（上へ流れ去る）
      RR.pulley(ctx, u * 20);
      const c = cut();
      const [nx, ny] = RR.NORMAL;
      const drop = Ease.outCubic(seg(u, 0, 0.25));
      const e1 = [lerp(c.x, RR.LOW[0], 0.55) + nx * 60, lerp(c.y, RR.LOW[1], 0.55) + ny * 60 + 220 * drop];
      lineW(ctx, RR.LOW[0], RR.LOW[1], e1[0], e1[1], 16, C.magenta); // 垂れ下がる左の切れ端
      const pull = Ease.inCubic(seg(u, 0, 0.1));
      if (pull < 1) {
        // 右の切れ端は滑車へ引き込まれる
        const e2 = [
          lerp(lerp(c.x, RR.TOP[0], 0.55) - nx * 60, RR.TOP[0], pull),
          lerp(lerp(c.y, RR.TOP[1], 0.55) - ny * 60, RR.TOP[1], pull),
        ];
        lineW(ctx, RR.TOP[0], RR.TOP[1], e2[0], e2[1], 16, C.magenta);
      }
      const wy = weightY(u);
      lineW(
        ctx,
        u < HIT ? RR.TOP[0] + 40 : RR.WEIGHT.x,
        u < HIT ? RR.TOP[1] : wy - 300,
        RR.WEIGHT.x,
        wy - RR.WEIGHT.h / 2 - 36,
        12,
        shade(C.magenta, -0.2),
      );
      RR.weight(ctx, wy, u < HIT ? 0 : 0.3 * seg(u, HIT, 0.4));
      RR.bollard(ctx);
      if (u < HIT) RR.floor(ctx);
      else {
        for (const s of shards) {
          // 砕けた床
          const x = s.cx + s.vx * t;
          const y = RR.FLOOR + 35 + s.vy * t + 1200 * t * t;
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(s.spin * t);
          ctx.fillStyle = s.color;
          ctx.fillRect(-s.w / 2, -35, s.w, 70);
          ctx.restore();
        }
      }
      ctx.restore();
      const [bx, by, br] = ballPos(u);
      if (br > 0.5) {
        drawSpark(ctx, bx, by, br * 0.9);
        disc(ctx, bx, by, br, C.spark);
        disc(ctx, bx - br * 0.3, by - br * 0.3, br * 0.28, 'rgba(255,255,255,0.6)');
      }
    },
    three,
    gate: { x: DIAL.x, y: DIAL.y, r: 190, color: CONFIG.colors.coral },
  });
})();

// ===== 65_stage_E.js =====
// 区間E 充填（13.5–17.0秒）→ G5 連打
// ダイヤルが唸りを上げて高速回転 → 回路を光が走って中心へ → 渦を巻いて光が集まり、光点が膨らむ
// → 六角形の殻が組み上がってコアになる → 殻にひびが1本入る
(() => {
  const MR = MachineRoom;
  const C = MR.C;
  const CORE = MR.DIAL;
  const extra = u => 90 * Ease.inCubic(seg(u, 0, 0.7)) + 30 * seg(u, 0.7, 1); // ダイヤルの追加回転

  // ---- 3D: 区間Dの機械室をそのまま使う。歯車が加速し、回路を光が走り、3Dの渦を巻いて光が集まる
  //      → 六角柱の殻が6枚の板から組み上がってコアになる（正面の絵はゲートの2Dの絵。凍結中はゲートが描く）
  const TEXN = 512;
  const SPAN = 460;
  const KK = TEXN / SPAN;
  const APO = 130 * Math.cos(Math.PI / 6);
  const mat = (color, e = 0.3) => World3D.mat(color, e, 0.5, 0.2);
  const V3 = (dx, dy) => [0, -dy, -dx]; // 平面の2Dの向き → 3D の向き
  const three = {
    build(scene) {
      const grp = new THREE.Group();
      const T = {};
      T.spark = World3D.sparkles(260, grp); // 歯車を回した直後の光（回路を走る光と、渦を巻いて集まる光）: ぼんやりした光の玉ではなく、くっきりしたきらめく粒で
      T.core = World3D.glow(C.spark, 200);
      T.panels = Array.from({ length: 6 }, () => new THREE.Mesh(new THREE.BoxGeometry(130, 16, 132), mat('#2d2250', 0.35)));
      const cv = document.createElement('canvas');
      cv.width = cv.height = TEXN;
      T.cctx = cv.getContext('2d');
      T.ctex = new THREE.CanvasTexture(cv);
      T.face = new THREE.Mesh(new THREE.PlaneGeometry(SPAN, SPAN), new THREE.MeshBasicMaterial({ map: T.ctex, transparent: true }));
      [T.core, ...T.panels, T.face].forEach(o => grp.add(o));
      scene.add(grp);
      this.group = grp;
      this.T = T;
    },
    update(u, o) {
      const T = this.T;
      const DT = StageDefs.D.three;
      const c3 = MR.PM(CORE.x, CORE.y);
      const spinUp = Ease.inCubic(seg(u, 0, 0.7));
      if (DT.group) {
        // 区間Dの機械室: 歯車が加速し、ダイヤルは縮みながら消える
        const K = DT.T;
        DT.update(1, { omitGateObject: true }); // 区間Dの終わりの状態に揃える（途中から始めても歯車・回路がそろう）
        DT.group.visible = true;
        MR.GEARS.forEach(([, , , , dir], i) => {
          K.gears[i].rotation.z = -dir * (6 + u * 4 + 50 * spinUp);
        });
        const fade = 1 - seg(u, 0.55, 0.72);
        const g4 = Timeline[4].gateObj;
        K.dial.visible = fade > 0;
        K.dialBack.visible = fade > 0;
        if (fade > 0 && g4) {
          const s0 = g4.spin;
          const x = K.dctx;
          const DK = 512 / 620;
          g4.spin = s0 + extra(u);
          x.setTransform(1, 0, 0, 1, 0, 0);
          x.clearRect(0, 0, 512, 512);
          x.setTransform(DK, 0, 0, DK, (310 - CORE.x) * DK, (310 - CORE.y) * DK);
          g4.draw(x);
          K.dtex.needsUpdate = true;
          g4.spin = s0;
          const sc = 0.3 + 0.7 * fade;
          K.dial.scale.setScalar(sc);
          K.dial.material.opacity = fade;
          K.dialBack.scale.set(sc, 1, sc);
        }
      }
      T.spark.begin();
      MR.CIRCUITS.forEach((pts, i) =>
        [0, 0.18].forEach(off => {
          // 回路を走る光: くっきりした粒の頭と、短い尾（1本に 8 粒）
          const k = seg(u, 0.08 + i * 0.05 + off, 0.4 + i * 0.05 + off);
          if (k <= 0 || k >= 1) return;
          for (let j = 0; j < 8; j++) {
            const kk = Ease.inCubic(k) - j * 0.01;
            if (kk < 0) break;
            const [x, y] = MR.pointAt(pts, kk);
            const p = MR.PM(x, y);
            T.spark.add([-80, p[1], p[2]], j ? 44 - j * 4 : 72, j % 3 === 1 ? '#ffffff' : C.spark, 1 - j * 0.1, 0.35);
          }
        }),
      );
      const NV = 96; // 3Dの渦を巻いて集まる光（奥行きにも揺れる。前の 28 個から 96 粒に）
      for (let j = 0; j < NV; j++) {
        const k = seg(u, 0.25 + (j % 12) * 0.016, 0.7 + (j % 12) * 0.016);
        if (k <= 0 || k >= 1) continue;
        const a = (j / NV) * TAU + 2.5 * k * TAU;
        const r = (500 + 120 * (((j * 37) % 11) / 10)) * (1 - Ease.inCubic(k));
        const p = MR.PM(CORE.x + Math.cos(a) * r, CORE.y + Math.sin(a) * r);
        T.spark.add(
          [260 * (1 - k) * Math.sin(a * 1.5 + j), p[1], p[2]],
          44 + 20 * k,
          [C.violet, C.cyan, '#ffffff'][j % 3],
          Math.min(1, k * 5),
          0.5,
        );
      }
      T.spark.end();
      const grow = Ease.inOutCubic(seg(u, 0.3, 0.8)); // 光点が膨らむ
      T.core.position.set(20, c3[1], c3[2]);
      T.core.scale.setScalar((26 + 60 * grow) * 5 * (1 + 0.1 * Beat.pulse));
      const k = seg(u, 0.6, 0.8);
      const ok = Math.max(0.01, Ease.outBack(k));
      const spin = (1 - k) * 1.5;
      const show = k > 0 && !o.omitGateObject;
      T.panels.forEach((m, i) => {
        // 六角柱の殻: 6枚の板が外から回りながら組み上がる
        m.visible = k > 0;
        const th = i * (Math.PI / 3) + Math.PI / 6 + spin;
        const rad = V3(Math.cos(th), Math.sin(th));
        const d = APO * (1 + 2.5 * (1 - Ease.outCubic(k)));
        m.position.set(c3[0] + rad[0] * d - 10, c3[1] + rad[1] * d, c3[2] + rad[2] * d);
        m.rotation.set(Math.atan2(rad[2], rad[1]), 0, 0);
      });
      T.face.visible = show; // 正面の絵（ゲートの2Dの絵。ひびは 0.86 で入る）
      if (show) {
        const g5 = Timeline[5].gateObj;
        const x = T.cctx;
        if (g5) {
          const h0 = g5.hits;
          g5.hits = u < 6 / 7 ? -1 : 0;
          x.setTransform(1, 0, 0, 1, 0, 0);
          x.clearRect(0, 0, TEXN, TEXN);
          x.setTransform(KK, 0, 0, KK, (SPAN / 2 - CORE.x) * KK, (SPAN / 2 - CORE.y) * KK);
          g5.draw(x);
          T.ctex.needsUpdate = true;
          g5.hits = h0;
        }
        T.face.position.set(c3[0] + 70, c3[1], c3[2]);
        T.face.rotation.set(-spin, Math.PI / 2, 0, 'XYZ');
        T.face.scale.setScalar(ok);
        T.face.material.opacity = Math.min(1, k * 1.5);
      }
    },
    camera(u) {
      const d0 = World3D.fitDist(50);
      const e = Ease.inOutCubic(seg(u, 0.4, 0.9));
      const zoom = 1.04 + 0.08 * e;
      // 充填の間は回り込み、最後は正面
      const f = MR.PM(0, 60 * e);
      const R = d0 / zoom;
      const yaw = Math.PI / 2 + 0.3 * Math.sin(Math.PI * seg(u, 0.02, 0.85));
      return {
        pos: [f[0] + R * Math.sin(yaw), f[1], f[2] + R * Math.cos(yaw)],
        look: f,
        up: [0, 1, 0],
        fov: 50,
        roll: 0.03 * Math.sin(Math.PI * seg(u, 0, 0.8)),
      };
    },
    plane: { o: MR.PM(0, 0), r: [0, 0, -1], d: [0, -1, 0] },
  };

  defineStage('E', {
    origin: StageB.ORIGIN_NEXT,
    camera: u => {
      const e = Ease.inOutCubic(seg(u, 0.4, 0.9));
      return Camera.make(0, 60 * e, 1.04 + 0.08 * e, 0.03 * Math.sin(Math.PI * seg(u, 0, 0.8))); // 区間Dの終わり (0,0,1.04,0) から
    },
    events: [
      [1 / 14, () => FX.addTrauma(0.2)],
      [
        5 / 7,
        () => {
          FX.shock(CORE.x, CORE.y, C.violet, 380, 0.3, { width: 18 });
          FX.addTrauma(0.25);
        },
      ],
      [
        6 / 7,
        () => {
          FX.burst(CORE.x, CORE.y, {
            n: 16,
            colors: [C.violet, '#ffffff'],
            kinds: ['streak', 'dot'],
            speed: [200, 600],
            life: [0.2, 0.4],
            size: [4, 9],
          });
          FX.addTrauma(0.3);
        },
      ],
    ],
    draw(ctx, u, o) {
      const spinUp = Ease.inCubic(seg(u, 0, 0.7));
      MR.gears(ctx, () => 1, 6 + u * 4 + 50 * spinUp); // 背景の歯車も速くなる
      MR.circuits(ctx, () => 1);
      MR.CIRCUITS.forEach((pts, i) => {
        // 回路を走る光
        for (const off of [0, 0.18]) {
          const k = seg(u, 0.08 + i * 0.05 + off, 0.4 + i * 0.05 + off);
          if (k <= 0 || k >= 1) continue;
          const [x, y] = MR.pointAt(pts, Ease.inCubic(k));
          drawSpark(ctx, x, y, 16, C.spark);
        }
      });
      const fade = 1 - seg(u, 0.55, 0.72); // ダイヤルは縮みながら消える
      const g4 = Timeline[4].gateObj;
      if (g4 && fade > 0) {
        const s0 = g4.spin;
        const sc = 0.3 + 0.7 * fade;
        g4.spin = s0 + extra(u);
        ctx.save();
        ctx.globalAlpha = fade;
        ctx.translate(CORE.x, CORE.y);
        ctx.scale(sc, sc);
        ctx.translate(-CORE.x, -CORE.y);
        g4.draw(ctx);
        ctx.restore();
        g4.spin = s0;
      }
      for (let j = 0; j < 28; j++) {
        // 渦を巻いて集まる光
        const k = seg(u, 0.25 + (j % 7) * 0.03, 0.7 + (j % 7) * 0.03);
        if (k <= 0 || k >= 1) continue;
        const a = (j / 28) * TAU + 2.5 * k * TAU;
        const r = 560 * (1 - Ease.inCubic(k));
        drawSpark(ctx, CORE.x + Math.cos(a) * r, CORE.y + Math.sin(a) * r, 10 + 6 * k, j % 2 ? C.violet : C.cyan);
      }
      const grow = Ease.inOutCubic(seg(u, 0.3, 0.8)); // 光点が膨らむ
      drawSpark(ctx, CORE.x, CORE.y, 26 + 60 * grow, C.spark);
      // 殻が組み上がる（凍結中はゲートが描く）
      const g5 = Timeline[5].gateObj;
      const k = seg(u, 0.6, 0.8);
      if (!o.omitGateObject && g5 && k > 0) {
        const h0 = g5.hits;
        const sc = Math.max(0.01, Ease.outBack(k));
        g5.hits = u < 6 / 7 ? -1 : 0; // ひびは 3.0秒で入る
        ctx.save();
        ctx.globalAlpha = Math.min(1, k * 1.5);
        ctx.translate(CORE.x, CORE.y);
        ctx.scale(sc, sc);
        ctx.rotate((1 - k) * 1.5);
        ctx.translate(-CORE.x, -CORE.y);
        g5.draw(ctx);
        ctx.restore();
        g5.hits = h0;
      }
    },
    three,
    gate: { x: CORE.x, y: CORE.y, r: 130, color: CONFIG.colors.violet },
  });
})();

// ===== 66_stage_F.js =====
// 区間F 解放（17.0–20.0秒）→ リザルト
// 殻が爆散、光の束が回る → これまでの物体（ボタン・パチンコ・つまみ・縄・ダイヤル・コア）のシルエットが順に閃く
// → 文字が渦を巻いて集まり、ロゴ「FREEZE BREAK」になる → 「CLEAR」の判が押される
(() => {
  const C = CONFIG.colors;
  const CORE = { x: 0, y: 100 };
  const LOGO_Y = -40;
  const CLEAR_Y = 90;
  const LOGO = 'FREEZE BREAK';

  function icon(ctx, i, x, y, s) {
    // 白いシルエット
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s / 70, s / 70);
    ctx.strokeStyle = '#ffffff';
    ctx.fillStyle = '#ffffff';
    ctx.lineWidth = 12;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    if (i === 0) {
      ctx.arc(0, 0, 50, 0, TAU);
      ctx.fill();
    } else if (i === 1) {
      ctx.moveTo(-40, -40);
      ctx.quadraticCurveTo(-40, 10, 0, 10);
      ctx.quadraticCurveTo(40, 10, 40, -40);
      ctx.moveTo(0, 10);
      ctx.lineTo(0, 60);
      ctx.stroke();
    } else if (i === 2) {
      ctx.moveTo(-60, 0);
      ctx.lineTo(60, 0);
      ctx.stroke();
      rrect(ctx, -54, -30, 34, 60, 8);
      ctx.fill();
    } else if (i === 3) {
      ctx.moveTo(-60, 35);
      ctx.lineTo(-8, 5);
      ctx.moveTo(8, -5);
      ctx.lineTo(60, -35);
      ctx.stroke();
    } else if (i === 4) {
      gear(ctx, 0, 0, 55, 12, 0, '#ffffff', 10);
    } else {
      for (let k = 0; k < 6; k++) {
        const a = (k / 6) * TAU + Math.PI / 6;
        ctx.lineTo(Math.cos(a) * 55, Math.sin(a) * 55);
      }
      ctx.closePath();
      ctx.stroke();
    }
    ctx.restore();
  }

  // ---- 3D: 殻が3Dに爆散し、歯車と奥の壁も吹き飛ぶ → 最高に鮮やかな虹色の空に花火が上がる → 光の束と輪が平面に広がる → 文字とシルエットは平面に沿った2Dで上書き
  const MR = MachineRoom;
  const PM = (x, y) => MR.PM(x, y);
  const addMat = col => World3D.addMat(col, { side: THREE.DoubleSide });
  // 花火: 核が弾けた瞬間から打ち上がり、8分音符ごとに奥の空で開く（区間Fの秒 tb に開く。打ち上げは 0.6秒前から。位置は核からの相対）
  const FW = (() => {
    const R = rng(2027);
    const PAL = ['#ff2d55', '#ffd23f', '#3dff8b', '#3fd0ff', '#a066ff', '#ff5ce1', '#ffffff', '#ff8a2b'];
    return [0.5, 0.75, 1.0, 1.0, 1.25, 1.5, 1.75, 2.0, 2.0, 2.25, 2.5, 2.75, 3.0].map((tb, i) => ({
      tb,
      t0: Math.max(0, tb - 0.6),
      x: -2600 - R() * 1800,
      y: -500 + R() * 2500,
      z: (R() - 0.5) * 2600,
      y0: -3300 - R() * 500,
      dz: (R() - 0.5) * 400,
      c1: PAL[i % PAL.length],
      c2: PAL[(i * 3 + 2) % PAL.length],
      n: 85 + Math.floor(R() * 25),
      sp: 1050 + R() * 350,
    }));
  })();
  function burst(f, c3) {
    // 花火が開く: 閃光と、2色の粒の球（3つに1つは尾を引く）
    const P = [f.x, c3[1] + f.y, c3[2] + f.z];
    World3D.spawn({ p: P, v: [0, 0, 0], life: 0.22, size: 520, color: '#ffffff', drag: 0, live: true, mix: 0 });
    for (let i = 0; i < f.n; i++) {
      const zz = 2 * Math.random() - 1;
      const th = Math.random() * TAU;
      const rr = Math.sqrt(1 - zz * zz);
      const v = f.sp * (0.9 + 0.12 * Math.random());
      World3D.spawn({
        p: P,
        v: [rr * Math.cos(th) * v, zz * v, rr * Math.sin(th) * v],
        g: [0, -260, 0],
        life: 1.1 + 0.5 * Math.random(),
        size: 78 + 18 * Math.random(),
        color: i % 2 ? f.c1 : f.c2,
        drag: 1.25,
        live: true,
        mix: 0.12,
        trail: i % 3 === 0 ? { dt: 0.06, life: 0.3, size: 0.5 } : null,
      });
    }
  }
  const three = {
    build(scene) {
      const grp = new THREE.Group();
      const T = {};
      T.pg = new THREE.Group(); // 平面の2D座標（y下向き、z は奥）で置ける入れ物
      T.pg.quaternion.setFromRotationMatrix(
        new THREE.Matrix4().makeBasis(new THREE.Vector3(0, 0, -1), new THREE.Vector3(0, -1, 0), new THREE.Vector3(-1, 0, 0)),
      );
      T.pg.position.set(...PM(CORE.x, CORE.y));
      const wedge = new THREE.BufferGeometry();
      wedge.setAttribute(
        'position',
        new THREE.BufferAttribute(new Float32Array([0, 0, 0, Math.cos(-0.07), Math.sin(-0.07), 0, Math.cos(0.07), Math.sin(0.07), 0]), 3),
      );
      T.beams = [];
      [C.spark, C.magenta, C.cyan].forEach((col, j) => {
        for (let i = j; i < 12; i += 3) {
          const m = new THREE.Mesh(wedge, addMat(col));
          m.scale.setScalar(1800);
          m.userData.i = i;
          T.beams.push(m);
        }
      });
      T.rings = [C.spark, C.cyan, C.magenta, C.violet, C.coral, '#ffffff'].map(
        col => new THREE.Mesh(new THREE.RingGeometry(0.97, 1, 96), addMat(col)),
      );
      [...T.beams, ...T.rings].forEach(m => T.pg.add(m));
      // 核が弾けた後の空: 最高に鮮やかな虹色（中心のまわりを渦を巻いて回る虹と、放射する光の筋。拍で明るさが脈打つ）
      T.sky = new THREE.Mesh(
        new THREE.SphereGeometry(11000, 64, 32),
        new THREE.ShaderMaterial({
          uniforms: { time: { value: 0 }, k: { value: 0 }, pulse: { value: 0 } },
          vertexShader:
            'varying vec3 vDir; void main() { vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
          fragmentShader: [
            'uniform float time; uniform float k; uniform float pulse; varying vec3 vDir;',
            'vec3 hue(float h) { return clamp(abs(mod(h * 6.0 + vec3(0.0, 4.0, 2.0), 6.0) - 3.0) - 1.0, 0.0, 1.0); }',
            'void main() {',
            '  vec3 d = normalize(vDir);',
            '  float a = atan(d.y, -d.z), r = acos(clamp(-d.x, -1.0, 1.0));', // 画面の中心（−x の向き）のまわりの角度と、中心からの離れ
            '  vec3 col = hue(a / 6.2831853 + r * 1.4 - time * 0.35);', // 渦を巻いて回る虹（彩度は最大）
            '  float ray = 0.5 + 0.5 * sin(a * 16.0 + time * 1.8);', // 放射する光の筋
            '  col *= mix(0.62, 1.0, smoothstep(0.2, 0.8, ray)) * (0.9 + 0.1 * pulse);',
            '  gl_FragColor = vec4(col * k, 1.0);',
            '}',
          ].join('\n'),
          side: THREE.BackSide,
          depthWrite: false,
        }),
      );
      T.sky.position.set(...PM(CORE.x, CORE.y));
      T.sky.renderOrder = -10;
      grp.add(T.sky);
      T.flash = World3D.glow('#ffffff', 600);
      T.flash.position.set(...PM(CORE.x, CORE.y));
      grp.add(T.pg, T.flash);
      scene.add(grp);
      this.group = grp;
      this.T = T;
    },
    update(u, o) {
      const T = this.T;
      const ET = StageDefs.E.three;
      const DT = StageDefs.D.three;
      const t = u * 3.5;
      if (ET.group && DT.group) {
        ET.update(1, { omitGateObject: true }); // 区間Eの終わりの状態から（区間Dの機械室も揃う）
        ET.group.visible = true;
        const E = ET.T;
        const D = DT.T;
        const c3 = PM(CORE.x, CORE.y);
        E.face.visible = false;
        E.core.visible = false;
        E.panels.forEach((m, i) => {
          // 殻の板が回りながら飛び散る
          const th = i * (Math.PI / 3) + Math.PI / 6;
          const dy = -Math.sin(th);
          const dz = -Math.cos(th);
          const d = 113 + 1400 * t;
          m.visible = t < 1.2;
          m.position.set(c3[0] + 500 * t, c3[1] + dy * d - 300 * t * t, c3[2] + dz * d);
          m.rotation.set(Math.atan2(dz, dy) + 6 * t, 4 * t * (i % 2 ? 1 : -1), 3 * t);
        });
        MR.GEARS.forEach(([x, y], i) => {
          // 歯車も衝撃で吹き飛ぶ
          const L = Math.hypot(x - CORE.x, y - CORE.y);
          const vx = (x - CORE.x) / L;
          const vy = (y - CORE.y) / L;
          const p = PM(x + vx * 1600 * t, y + vy * 1600 * t);
          D.gears[i].position.set(-40 + 700 * t, p[1] - 200 * t * t, p[2]);
          D.hubs[i].visible = false;
          D.gears[i].rotation.set(2 * t, Math.PI / 2 + t, -(i % 2 ? 1 : -1) * (62 + 20 * t), 'XYZ');
          D.gears[i].visible = t < 1.4;
        });
        const gone = u > 0.03; // 回路とダイヤルは衝撃の光で消える
        D.circ.forEach(c => {
          c.segs.forEach(m => {
            m.visible = m.visible && !gone;
          });
          c.a.visible = c.a.visible && !gone;
          c.b.visible = c.b.visible && !gone;
        });
        D.dialBack.visible = false;
        D.dial.visible = false;
        // 奥の壁は衝撃で吹き飛び、虹色の空が現れる
        if (D.back) {
          D.back.visible = t < 0.22;
          D.back.position.x = -120 - 4000 * t - 16000 * t * t;
          D.back.rotation.set(2 * t, Math.PI / 2 + 1.2 * t, 0.7 * t);
          D.back.scale.setScalar(Math.max(0.01, 1 - 3 * t));
        }
        if (D.spec) D.spec.visible = t < 0.05;
      }
      const skyK = Ease.outCubic(seg(u, 0, 0.06)); // 核が弾けた閃光の中で虹色の空に変わる
      T.sky.material.uniforms.k.value = skyK;
      T.sky.material.uniforms.time.value = FX.time;
      T.sky.material.uniforms.pulse.value = Beat.pulse;
      // 花火（区間Fの秒）
      const c3 = PM(CORE.x, CORE.y);
      const ft = u * 3;
      const pt = this.fwT == null || ft < this.fwT ? ft : this.fwT;
      this.fwT = ft;
      if (ft > pt && !o.frozen)
        FW.forEach(f => {
          for (let s = Math.max(pt, f.t0); s < Math.min(ft, f.tb); s += 1 / 90) {
            // 打ち上げの尾（コマ落ちしても途切れない）
            const k = Ease.outCubic(seg(s, f.t0, f.tb));
            World3D.spawn({
              p: [f.x, c3[1] + lerp(f.y0, f.y, k), c3[2] + f.z + f.dz * (1 - k)],
              v: [0, -40, 0],
              g: [0, -120, 0],
              life: 0.3 + 0.15 * Math.random(),
              size: 42,
              color: '#ffe7b0',
              drag: 2,
              live: true,
              mix: 0.1,
            });
          }
          if (pt < f.tb && ft >= f.tb) burst(f, c3);
        });
      const beams = (1 - seg(u, 0.5, 1)) * seg(u, 0, 0.05); // 回る光の束
      // 虹色の空の上では控えめに
      T.beams.forEach(m => {
        m.visible = beams > 0;
        m.rotation.z = (m.userData.i / 12) * TAU + u * 1.2;
        m.material.opacity = 0.35 * beams * (1 - 0.55 * skyK);
      });
      T.rings.forEach((m, i) => {
        // 広がる輪
        const k = seg(u, i * 0.06, 0.45 + i * 0.06);
        m.visible = k > 0 && k < 1;
        m.scale.setScalar(Math.max(1, Ease.outExpo(k) * 1000));
        m.material.opacity = 1 - k;
      });
      const fl = 1 - seg(u, 0, 0.3);
      T.flash.visible = fl > 0;
      T.flash.scale.setScalar(900 * fl + 1);
    },
    overlay(ctx, u) {
      texts(ctx, u);
    },
    camera(u) {
      const d0 = World3D.fitDist(50);
      const e1 = Ease.outExpo(seg(u, 0, 0.25));
      const e2 = Ease.inOutCubic(seg(u, 0.3, 0.75));
      // 爆発で引き、最後は正面・zoom 1（2Dと同じ）
      const zoom = 1.12 - 0.3 * e1 + 0.18 * e2;
      const f = PM(0, lerp(60, 0, e2));
      const R = d0 / zoom;
      const sw = Math.sin(Math.PI * seg(u, 0, 0.7));
      const yaw = Math.PI / 2 - 0.45 * sw;
      const el = 0.15 * sw;
      const pos = [f[0] + R * Math.sin(yaw) * Math.cos(el), f[1] + R * Math.sin(el), f[2] + R * Math.cos(yaw) * Math.cos(el)];
      return { pos, look: f, up: [0, 1, 0], fov: 50, roll: 0.06 * Math.sin(Math.PI * seg(u, 0, 0.5)) };
    },
    plane: { o: MR.PM(0, 0), r: [0, 0, -1], d: [0, -1, 0] },
  };

  defineStage('F', {
    origin: StageB.ORIGIN_NEXT,
    camera: u => {
      const e1 = Ease.outExpo(seg(u, 0, 0.25));
      const e2 = Ease.inOutCubic(seg(u, 0.3, 0.75));
      return Camera.make(0, lerp(60, 0, e2), 1.12 - 0.22 * e1 + 0.1 * e2, 0.06 * Math.sin(Math.PI * seg(u, 0, 0.5))); // 区間Eの終わりから
    },
    events: [
      [
        0.001,
        () => {
          FX.addTrauma(0.5);
          FX.shock(CORE.x, CORE.y, '#ffffff', 1400, 0.5, { width: 50 });
        },
      ],
      [
        6 / 7,
        () => {
          // 「CLEAR」の判は 3.0秒（拍）に押される
          FX.addTrauma(0.35);
          FX.kick(0.05);
          FX.burst(0, CLEAR_Y, {
            n: 40,
            colors: [C.coral, C.spark, '#ffffff'],
            kinds: ['streak', 'dot'],
            speed: [300, 1000],
            life: [0.3, 0.6],
          });
        },
      ],
    ],
    draw(ctx, u) {
      const beams = (1 - seg(u, 0.5, 1)) * seg(u, 0, 0.05); // 回る光の束
      if (beams > 0) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        [C.spark, C.magenta, C.cyan].forEach((col, j) => {
          ctx.fillStyle = hexA(col, 0.22 * beams);
          ctx.beginPath();
          for (let i = j; i < 12; i += 3) {
            const a = (i / 12) * TAU + u * 1.2;
            ctx.moveTo(CORE.x, CORE.y);
            ctx.arc(CORE.x, CORE.y, 1800, a - 0.07, a + 0.07);
            ctx.closePath();
          }
          ctx.fill();
        });
        ctx.restore();
      }
      [C.spark, C.cyan, C.magenta, C.violet, C.coral, '#ffffff'].forEach((col, i) => {
        // 広がる輪
        const k = seg(u, i * 0.06, 0.45 + i * 0.06);
        if (k <= 0 || k >= 1) return;
        ctx.globalAlpha = 1 - k;
        ctx.strokeStyle = col;
        ctx.lineWidth = 30 * (1 - k) + 2;
        ctx.beginPath();
        ctx.arc(CORE.x, CORE.y, Ease.outExpo(k) * 1000, 0, TAU);
        ctx.stroke();
      });
      ctx.globalAlpha = 1;
      drawSpark(ctx, CORE.x, CORE.y, 150 * (1 - seg(u, 0, 0.3)) + 0.01, '#ffffff');
      texts(ctx, u);
    },
    three,
  });

  function texts(ctx, u) {
    // シルエット・粒・ロゴ・判（2Dと3Dの上書きで共用）
    for (let i = 0; i < 6; i++) {
      // これまでの物体が順に閃く
      const k = seg(u, 0.16 + i * 0.06, 0.3 + i * 0.06);
      if (k <= 0 || k >= 1) continue;
      const a = -Math.PI / 2 + (i / 6) * TAU + u * 0.8;
      ctx.globalAlpha = Math.sin(Math.PI * k);
      ctx.shadowColor = 'rgba(14,10,34,0.85)';
      ctx.shadowBlur = 14; // 明るい虹色の上でも形が読めるように
      icon(ctx, i, CORE.x + Math.cos(a) * 340, CORE.y + Math.sin(a) * 340, 60 + 30 * k);
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
    ctx.shadowColor = 'transparent';
    for (let j = 0; j < 40; j++) {
      // ロゴへ吸い込まれる粒
      const k = seg(u, 0.42 + (j % 8) * 0.02, 0.7 + (j % 8) * 0.02);
      if (k <= 0 || k >= 1) continue;
      const a = (j / 40) * TAU + 3 * k;
      const r = 700 * (1 - Ease.inCubic(k));
      drawSpark(ctx, Math.cos(a) * r, LOGO_Y + Math.sin(a) * r * 0.6, 8, j % 2 ? C.spark : C.cyan);
    }
    ctx.save(); // 渦を巻いて集まる文字
    ctx.font = `400 88px ${CONFIG.displayFont}`;
    const widths = [...LOGO].map(ch => ctx.measureText(ch).width + 4); // 書体が読み込まれたら幅も変わるので毎回測る
    const W = widths.reduce((s, w) => s + w, 0);
    let x = -W / 2;
    [...LOGO].forEach((ch, i) => {
      const w = widths[i];
      const cx = x + w / 2;
      x += w;
      if (ch === ' ') return;
      const k = seg(u, 0.5 + i * 0.02, 0.72 + i * 0.02);
      if (k <= 0) return;
      const e = Ease.outCubic(k);
      const a0 = i * 0.9 + 2;
      const a = a0 + (1 - e) * 2.2;
      const r = 900 * (1 - e);
      const px = lerp(Math.cos(a) * 900, cx, e) + Math.cos(a) * r * 0.1;
      const py = lerp(Math.sin(a) * 900, LOGO_Y, e);
      ctx.save();
      ctx.translate(px, py);
      ctx.rotate((i % 2 ? 1 : -1) * 2.5 * (1 - e));
      ctx.scale(0.3 + 0.7 * Ease.outBack(k), 0.3 + 0.7 * Ease.outBack(k));
      ctx.globalAlpha = Math.min(1, k * 3);
      drawText(ctx, ch, 0, 0, 88, i > 6 ? C.spark : C.ink, { display: true, stroke: 14 }); // 縁取り（虹色の空の上でも読める）
      ctx.restore();
    });
    ctx.restore();
    const s = seg(u, 6 / 7 - 0.05, 6 / 7); // 「CLEAR」の判
    if (s > 0) {
      const sc = lerp(2.2, 1, Ease.outBack(s));
      ctx.save();
      ctx.translate(0, CLEAR_Y);
      ctx.rotate(-0.08);
      ctx.scale(sc, sc);
      ctx.globalAlpha = Math.min(1, s * 2);
      ctx.fillStyle = 'rgba(14,10,34,0.88)';
      rrect(ctx, -150, -44, 300, 88, 12);
      ctx.fill(); // 判の地（虹色の空の上でも読める）
      ctx.strokeStyle = C.coral;
      ctx.lineWidth = 8;
      rrect(ctx, -150, -44, 300, 88, 12);
      ctx.stroke();
      drawText(ctx, 'CLEAR', 0, 4, 60, C.coral, { display: true, letter: 8 });
      ctx.restore();
    }
  }
})();

// ===== 70_ui.js =====
// HUD・タイトルの文字・リザルト・音のボタン
function storeBest(v) {
  try {
    localStorage.setItem('freeze-break.best', String(v));
  } catch (_) {
    /* 使えない環境 */
  }
}
function loadBest() {
  try {
    const v = parseFloat(localStorage.getItem('freeze-break.best'));
    return isFinite(v) ? v : null;
  } catch (_) {
    return null;
  }
}

const UI = {
  resultAge: 0,
  summary: null,
  best: null,
  newBest: false,
  played: {},
  retry: { x: 0, y: 360, r: 84 }, // 論理座標（画面中央が原点）

  update(dt) {
    if (Game.phase !== 'RESULT') return;
    this.resultAge += dt;
    CONFIG.scoredGates.forEach((id, i) => this.cue(`row${i}`, 0.43 + i * 0.16, () => Sound.sfx('snap'))); // 評価の判を押す音
    this.cue('grade', 1.35, () => {
      Sound.sfx('impact');
      FX.addTrauma(0.35);
    });
    if (this.newBest) this.cue('best', 1.75, () => Sound.sfx('success', { step: 6 }));
  },
  cue(key, at, fn) {
    if (!this.played[key] && this.resultAge >= at) {
      this.played[key] = true;
      fn();
    }
  },

  onResult(results) {
    this.resultAge = 0;
    this.played = {};
    this.newBest = false;
    this.summary = overallGrade(results);
    if (this.summary.complete && !Debug.auto && (this.best == null || this.summary.total < this.best)) {
      this.newBest = this.best != null; // 初めてのクリアは記録するだけ
      this.best = this.summary.total;
      storeBest(this.best);
    }
  },
  onResultDown(p) {
    if (this.resultAge < CONFIG.resultInputDelay) return;
    const reach = Math.max(this.retry.r * 1.3, CONFIG.hitRadiusMin);
    if (Math.hypot(p.lx - this.retry.x, p.ly - this.retry.y) <= reach) Game.restart();
  },

  draw(ctx) {
    View.screenTransform(ctx);
    const st = Game.state;
    if (st === 'TITLE') this.drawTitle(ctx);
    else if (st !== 'RESULT') {
      this.drawDots(ctx, -View.halfH + 50);
      if (st === 'GATE')
        drawText(ctx, Game.stage.gateObj.elapsed.toFixed(2), 0, -View.halfH + 92, 24, CONFIG.colors.ink, { alpha: 0.55, weight: 700 });
    }
    if (st === 'RESULT') this.drawResult(ctx);
    this.drawMute(ctx);
  },

  // 凍ったロゴ: 横に切れ目が入り、下半分が少しずれて止まっている
  drawTitle(ctx) {
    const c = CONFIG.colors;
    const y = -250;
    const cut = y - 4;
    ctx.save();
    ctx.beginPath();
    ctx.rect(-600, cut - 90, 1200, 88);
    ctx.clip();
    drawText(ctx, 'FREEZE BREAK', 0, y, 84, c.ink, { display: true, letter: 3 });
    ctx.restore();
    ctx.save();
    ctx.beginPath();
    ctx.rect(-600, cut + 2, 1200, 90);
    ctx.clip();
    drawText(ctx, 'FREEZE BREAK', 14, y + 3, 84, c.ink, { display: true, letter: 3 });
    ctx.restore();
    ctx.globalAlpha = 0.8;
    lineW(ctx, -420, cut, 420, cut, 2, c.cyan);
    ctx.globalAlpha = 1;
    drawText(ctx, '20 SEC · 5 FREEZES', 0, y + 78, 22, c.ink, { alpha: 0.55, weight: 700, letter: 8 });
    if (this.best != null)
      drawText(ctx, `BEST ${this.best.toFixed(2)}s`, 0, View.halfH - 70, 26, c.spark, { alpha: 0.85, weight: 700, letter: 4 });
  },

  drawDots(ctx, y) {
    CONFIG.scoredGates.forEach((id, i) => {
      const r = Game.results[id];
      const x = (i - 2) * 44;
      ctx.beginPath();
      ctx.arc(x, y, 10 + 3 * Beat.pulse, 0, TAU);
      if (r) {
        ctx.fillStyle = CONFIG.rankColor[r.rank];
        ctx.fill();
      } else {
        ctx.strokeStyle = 'rgba(238,240,255,0.4)';
        ctx.lineWidth = 3;
        ctx.stroke();
      }
    });
  },

  drawResult(ctx) {
    const c = CONFIG.colors;
    const a = this.resultAge;
    const s = this.summary || { grade: '-', total: 0, misses: 0 };
    ctx.fillStyle = `rgba(8,8,16,${0.93 * Ease.outCubic(clamp(a / 0.5))})`; // 後ろのロゴが行と重ならない濃さ
    ctx.fillRect(-View.halfW, -View.halfH, View.halfW * 2, View.halfH * 2);
    CONFIG.scoredGates.forEach((id, i) => {
      // 行が順に入り、評価の判が押される
      const t0 = 0.35 + i * 0.16;
      const rk = clamp((a - t0) / 0.25);
      if (rk <= 0) return;
      const y = -250 + i * 62;
      const r = Game.results[id];
      const e = Ease.outCubic(rk);
      ctx.save();
      ctx.globalAlpha = e;
      ctx.translate(-40 * (1 - e), 0);
      drawText(ctx, CONFIG.gates[id].label, -230, y, 32, c.ink, { align: 'left', weight: 700, alpha: 0.85 });
      drawText(ctx, r ? `${r.reaction.toFixed(2)}s` : '—', 70, y, 34, c.ink, { align: 'right', weight: 800 });
      ctx.restore();
      const sk = clamp((a - t0 - 0.08) / 0.18);
      if (r && sk > 0) {
        const sc = lerp(2, 1, Ease.outBack(sk));
        ctx.save();
        ctx.translate(170, y);
        ctx.rotate(-0.06);
        ctx.scale(sc, sc);
        ctx.globalAlpha = Math.min(1, sk * 2);
        drawText(ctx, r.rank, 0, 2, 26, CONFIG.rankColor[r.rank], { display: true, letter: 2 });
        ctx.restore();
      }
    });
    const tk = clamp((a - 1.05) / 0.5); // 合計は数え上がって止まる
    if (tk > 0) {
      drawText(ctx, 'TOTAL', -230, 92, 24, c.ink, { align: 'left', weight: 700, alpha: 0.6, letter: 4 });
      drawText(ctx, `${(s.total * Ease.outCubic(tk)).toFixed(2)}s`, 70, 90, 46, c.ink, { align: 'right', weight: 900 });
      if (s.misses) drawText(ctx, `MISS ${s.misses}`, 170, 92, 22, c.ink, { alpha: 0.5, weight: 700, letter: 2 });
    }
    const gk = clamp((a - 1.35) / 0.22); // 総合評価の大きな判
    if (gk > 0) {
      const sc = lerp(3, 1, Ease.outBack(gk));
      ctx.save();
      ctx.translate(0, -385);
      ctx.rotate(-0.08);
      ctx.scale(sc, sc);
      ctx.globalAlpha = Math.min(1, gk * 2);
      drawText(ctx, s.grade, 0, 0, 150, c.spark, { display: true });
      ctx.restore();
    }
    if (a > 1.7 && this.best != null) {
      if (this.newBest)
        drawText(ctx, `NEW BEST  ${this.best.toFixed(2)}s`, 0, 172, 30, c.spark, {
          display: true,
          alpha: 0.6 + 0.4 * Math.sin(a * 8),
          letter: 3,
        });
      else drawText(ctx, `BEST ${this.best.toFixed(2)}s`, 0, 172, 26, c.ink, { alpha: 0.55, weight: 700, letter: 3 });
    }
    // もう一度ボタン（再生の矢印つき）
    const b = this.retry;
    const ready = a >= CONFIG.resultInputDelay;
    ctx.globalAlpha = ready ? 1 : 0.4;
    drawButton(ctx, { x: b.x, y: b.y, r: b.r, color: c.coral, press: 0, hint: 0, done: !ready, elapsed: 0 });
    const cx = b.x;
    const cy = b.y - b.r * 0.1;
    const R = 30;
    const th = Math.PI * 1.35;
    ctx.strokeStyle = '#ffffff';
    ctx.fillStyle = '#ffffff';
    ctx.lineWidth = 9;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(cx, cy, R, -Math.PI * 0.35, th);
    ctx.stroke();
    const px = cx + Math.cos(th) * R;
    const py = cy + Math.sin(th) * R;
    const tx = -Math.sin(th);
    const ty = Math.cos(th);
    const nx = Math.cos(th);
    const ny = Math.sin(th);
    ctx.beginPath();
    ctx.moveTo(px + tx * 18, py + ty * 18);
    ctx.lineTo(px + nx * 14, py + ny * 14);
    ctx.lineTo(px - nx * 14, py - ny * 14);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;
  },

  // 右上の音のボタン（M キーでも切り替え）
  mutePos() {
    return { x: View.halfW - 56, y: -View.halfH + 56 };
  },
  pressCorner(p) {
    const m = this.mutePos();
    if (Math.hypot(p.lx - m.x, p.ly - m.y) > 60) return false;
    Sound.setMuted(!Sound.muted);
    return true;
  },
  drawMute(ctx) {
    const { x, y } = this.mutePos();
    const c = CONFIG.colors.ink;
    ctx.save();
    ctx.translate(x, y);
    ctx.globalAlpha = 0.7;
    ctx.fillStyle = c;
    ctx.strokeStyle = c;
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-22, -9);
    ctx.lineTo(-11, -9);
    ctx.lineTo(2, -22);
    ctx.lineTo(2, 22);
    ctx.lineTo(-11, 9);
    ctx.lineTo(-22, 9);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    if (Sound.muted) {
      ctx.moveTo(12, -10);
      ctx.lineTo(30, 10);
      ctx.moveTo(30, -10);
      ctx.lineTo(12, 10);
    } else {
      ctx.arc(6, 0, 12, -0.9, 0.9);
      ctx.moveTo(6 + 22 * Math.cos(-0.9), 22 * Math.sin(-0.9));
      ctx.arc(6, 0, 22, -0.9, 0.9);
    }
    ctx.stroke();
    ctx.restore();
  },
};

// ===== 80_debug.js =====
// デバッグ: ?debug（情報表示とスクラブバー）、?t=秒（その時刻から）、?auto（自動成功）、?hold（時間を止める）
// 検証スクリプト用に window.__fb で状態を公開する
const Debug = (() => {
  const q = new URLSearchParams(location.search);
  const D = {
    on: q.has('debug'),
    auto: q.has('auto'),
    hold: q.has('hold'),
    startT: q.has('t') ? parseFloat(q.get('t')) : null,
    reducedMotion: !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches),
    fps: 0,
    frames: 0,
    acc: 0,
    errors: [],
    bar: null,
  };

  D.reportError = e => {
    const msg = String((e && e.stack) || e);
    if (D.errors.length < 20 && !D.errors.includes(msg)) {
      D.errors.push(msg);
      console.error(msg);
    }
  };

  D.init = () => {
    addEventListener('error', e => D.reportError(e.error || e.message));
    addEventListener('unhandledrejection', e => D.reportError(e.reason));
    window.__fb = {
      get state() {
        return Game.state;
      },
      get t() {
        return Game.t;
      },
      get stage() {
        return Game.stage.id;
      },
      get playTime() {
        return Game.playTime;
      },
      get realPlay() {
        return Game.realPlay;
      },
      get results() {
        return JSON.parse(JSON.stringify(Game.results));
      },
      get errors() {
        return D.errors.slice();
      },
      gateScreenPos() {
        const g = Game.stage.gateObj;
        return g ? Space.toScreen(g.x, g.y) : null;
      },
      retryScreenPos() {
        return View.toClient(UI.retry.x, UI.retry.y);
      },
      // 検証用: いまのゲートを正しく操作する手順（画面座標）と、ミスの回数
      gateDemo() {
        const g = Game.stage.gateObj;
        const kind = g && GateKinds[g.kindName];
        if (!kind || !kind.demo) return null;
        return kind.demo(g).map(([a, x, y, steps]) => {
          const c = Space.toScreen(x, y);
          return { a, x: c.x, y: c.y, steps: steps || 1 };
        });
      },
      gateMisses() {
        const g = Game.stage.gateObj;
        return g ? g.misses : 0;
      },
      audio() {
        return { ctx: Sound.ctx ? Sound.ctx.state : null, mode: Music.mode, level: Music.level, muted: Sound.muted };
      },
      mutePos() {
        const m = UI.mutePos();
        return View.toClient(m.x, m.y);
      },
      w3d() {
        if (!World3D.ok) return { ok: false };
        const c = World3D.camera;
        return {
          ok: true,
          spec: World3D.specAmp ? [Math.max(...World3D.specAmp.slice(0, 64)), Sound.ctx ? Sound.ctx.state : 'none'] : null,
          vis: World3D.canvas.style.visibility,
          objs: World3D.scene.children.length,
          cam: [c.position.x, c.position.y, c.position.z].map(Math.round),
          pm: World3D.pm,
          size: [World3D.canvas.width, World3D.canvas.height],
        };
      },
      jumpTo(t) {
        Game.jumpTo(t);
      },
      dump() {
        // 検証用: 3Dの場面の指紋（全ての物の見え方・位置・向き・大きさ・材質。粒と音のスペクトルは乱数と音で変わるので形だけ）
        if (!World3D.ok) return null;
        const r = (v, d = 1) => Math.round(v * Math.pow(10, d)) / Math.pow(10, d);
        const out = [];
        World3D.scene.traverse(o => {
          const m = o.material && !Array.isArray(o.material) ? o.material : null;
          const rnd = m && (m === World3D.fxMat || m === World3D.specMat);
          const e = [o.type, o.visible ? 1 : 0];
          if (!rnd) {
            const spin = o === World3D.bg || o.parent === World3D.bg; // 背景の図形は実時間で回るので向きは比べない
            e.push(
              o.position.toArray().map(v => r(v)),
              spin ? 0 : [o.rotation.x, o.rotation.y, o.rotation.z].map(v => r(v, 3)),
              o.scale.toArray().map(v => r(v, 3)),
            );
            if (m)
              e.push([
                m.color ? m.color.getHexString() : '',
                r(m.opacity, 3),
                m.emissiveIntensity != null ? r(m.emissiveIntensity, 3) : '',
                m.visible ? 1 : 0,
              ]);
            if (o.isInstancedMesh) {
              let sm = 0;
              o.instanceMatrix.array.forEach((v, i) => {
                sm += v * ((i % 13) + 1);
              });
              e.push(r(sm, 0));
            }
            if (m && m.uniforms && m.uniforms.k) e.push(r(m.uniforms.k.value, 3));
          } else if (o.geometry && o.geometry.drawRange && m === World3D.fxMat && o.geometry !== World3D.fxGeo) {
            const pa = o.geometry.attributes.position.array;
            const n = Math.min(o.geometry.drawRange.count, pa.length / 3);
            let sm = 0;
            for (let i = 0; i < n * 3; i++) sm += pa[i] * ((i % 7) + 1);
            e.push(n, r(sm, 0));
          }
          out.push(e);
        });
        const c = World3D.camera;
        return {
          cam: c.position.toArray().map(v => r(v)),
          fov: r(c.fov, 2),
          pm: World3D.pm ? Object.values(World3D.pm).map(v => r(v, 2)) : null,
          stage: Game.stage.id,
          objs: out,
        };
      },
      // 検証用: 区間の3Dカメラ
      cam(st, u) {
        const c = StageDefs[st].three.camera(u);
        return { pos: c.pos.map(Math.round), look: c.look.map(Math.round) };
      },
      hide(name) {
        const [st, key] = name.split('.');
        const T = StageDefs[st].three.T;
        [].concat(T[key]).forEach(m => {
          m.visible = false;
          m.userData.dbgHidden = true;
        });
      },
      probe(name) {
        // 検証用: 区間の3Dの部品の画面上の四隅（例 probe('C.tiles')）
        const [st, key] = name.split('.');
        const T = StageDefs[st] && StageDefs[st].three && StageDefs[st].three.T;
        if (!T || !T[key]) return null;
        return []
          .concat(T[key])
          .slice(0, 12)
          .map(m => {
            m.updateMatrixWorld(true);
            const bb = new THREE.Box3().setFromObject(m);
            const pts = [];
            for (const x of [bb.min.x, bb.max.x])
              for (const y of [bb.min.y, bb.max.y])
                for (const z of [bb.min.z, bb.max.z]) {
                  const q = World3D.project(x, y, z);
                  pts.push([Math.round(q.x), Math.round(q.y)]);
                }
            return {
              min: bb.min.toArray().map(Math.round),
              max: bb.max.toArray().map(Math.round),
              rot: [m.rotation.x, m.rotation.y, m.rotation.z].map(v => +v.toFixed(2)),
              scr: pts,
            };
          });
      },
    };
    if (!D.on) return;
    const wrap = document.createElement('div');
    wrap.style.cssText =
      'position:fixed;left:12px;right:12px;bottom:12px;display:flex;gap:10px;align-items:center;z-index:10;font:12px ui-monospace,monospace;color:#f4f1ea';
    const bar = document.createElement('input');
    Object.assign(bar, { type: 'range', min: 0, max: 20, step: 0.05, value: 0 });
    bar.style.flex = '1';
    const hold = document.createElement('input');
    hold.type = 'checkbox';
    hold.checked = D.hold;
    const label = document.createElement('label');
    label.append(hold, ' hold (H)');
    bar.addEventListener('input', () => {
      Game.jumpTo(parseFloat(bar.value));
      Game.hold = true;
      hold.checked = true;
    });
    hold.addEventListener('change', () => {
      Game.hold = hold.checked;
    });
    addEventListener('keydown', e => {
      if (e.key === 'h' || e.key === 'H') {
        Game.hold = !Game.hold;
        hold.checked = Game.hold;
      }
    });
    wrap.append(bar, label);
    document.body.append(wrap);
    D.bar = bar;
  };

  D.tick = dt => {
    D.frames++;
    D.acc += dt;
    if (D.acc >= 0.5) {
      D.fps = Math.round(D.frames / D.acc);
      D.frames = 0;
      D.acc = 0;
    }
    if (D.bar && document.activeElement !== D.bar) D.bar.value = Game.t;
  };

  D.draw = ctx => {
    if (!D.on) return;
    const g = Game.stage.gateObj;
    const lines = [
      `t ${Game.t.toFixed(2)}  stage ${Game.stage.id}  ${Game.state}  x${Game.timeScale.toFixed(2)}${Game.hold ? '  HOLD' : ''}`,
      `fps ${D.fps}  play ${Game.playTime.toFixed(2)}  real ${Game.realPlay.toFixed(2)}`,
      g ? `gate ${g.id} ${g.kindName}  ${g.elapsed.toFixed(2)}s  hint ${g.hint}  miss ${g.misses}` : 'gate -',
      ...CONFIG.scoredGates.map(id => {
        const r = Game.results[id];
        return r ? `${id} ${r.reaction.toFixed(2)} ${r.rank}` : `${id} -`;
      }),
    ];
    View.pixelTransform(ctx);
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(8, 8, 330, 14 + lines.length * 16);
    ctx.fillStyle = '#9ff5e9';
    ctx.font = '12px ui-monospace, Menlo, monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    lines.forEach((s, i) => ctx.fillText(s, 16, 15 + i * 16));
  };

  return D;
})();

// 起動と結線
function boot() {
  View.init(document.getElementById('stage'));
  World3D.init(document.getElementById('world'));
  buildTimeline();
  // やり直し用に組み上げた直後の姿を覚え、全ての材質を先に用意しておく
  if (World3D.ok) {
    World3D.snapshot();
    World3D.precompile();
  }
  Input.init(View.canvas);
  Debug.init();
  UI.best = loadBest();
  if (document.fonts && document.fonts.load)
    document.fonts.load('80px "Dela Gothic One"').catch(() => {
      /* 読めなければ代わりの書体 */
    });
  Sound.loadMuted();
  addEventListener('keydown', e => {
    if (e.key === 'm' || e.key === 'M') Sound.setMuted(!Sound.muted);
  });
  Game.hold = Debug.hold;
  Game.reset();
  if (Debug.startT != null && isFinite(Debug.startT)) Game.jumpTo(Debug.startT);
  requestAnimationFrame(frame);
}
boot();
})();
