<!DOCTYPE html>
<title>Freeze Break</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0c16;
    --fg: #eef0ff;
  }
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;             /* 連打やダブルタップ・ピンチで画面が拡大しないように */
  }
  #wrap { position: relative; width: 100%; height: 100%; touch-action: none; }
  #world, #stage {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  #world { visibility: hidden; }   /* 3D化した区間だけ見せる */
  #stage { touch-action: none; }
</style>
<div id="wrap">
  <canvas id="world" aria-hidden="true"></canvas>
  <canvas id="stage" aria-label="Freeze Break ゲーム画面"></canvas>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
// ===== 00_config.js =====
// 設定値。時刻・しきい値・色などの数値はここに集める。
const CONFIG = {
  logical: 1000, // 安全領域の一辺（論理単位）
  maxDpr: 2,
  maxDt: 0.05,
  beat: 0.5, // 1拍の秒数（120BPM）
  windDown: { lead: 0.7, minScale: 0.3 }, // 凍結の手前で時間とBGMが一緒に減速する（何秒前から・最小の時間倍率。早めに深く＝大げさに）

  // 区間。gate は区間の終端（to）で凍結するゲートの id
  timeline: [
    { id: 'T', label: 'TITLE', from: 0.0, to: 0.0, gate: 'g0' },
    { id: 'A', label: '点火', from: 0.0, to: 3.0, gate: 'g1' },
    { id: 'B', label: '飛翔', from: 3.0, to: 6.5, gate: 'g2' },
    { id: 'C', label: '落下', from: 6.5, to: 10.0, gate: 'g3' },
    { id: 'D', label: '衝撃', from: 10.0, to: 13.5, gate: 'g4' },
    { id: 'E', label: '充填', from: 13.5, to: 17.0, gate: 'g5' },
    { id: 'F', label: '解放', from: 17.0, to: 20.0, gate: null },
  ],

  gates: {
    g0: { kind: 'tap', label: '押す', scored: false, par: 0, hitStop: 0.06 },
    g1: { kind: 'pull', label: '引いて放す', scored: true, par: 1.2, hitStop: 0.06, pullMin: 140, pullAngleTol: 60 },
    g2: { kind: 'slide', label: '滑らせる', scored: true, par: 1.2, hitStop: 0.08, slideDone: 0.95 },
    g3: { kind: 'swipe', label: '切る', scored: true, par: 0.9, hitStop: 0.09, swipeSpeed: 1.0 },
    g4: { kind: 'rotate', label: '回す', scored: true, par: 1.8, hitStop: 0.11, rotateDeg: 360 },
    g5: { kind: 'mash', label: '連打', scored: true, par: 1.6, hitStop: 0.15, mashCount: 8, mashDecay: 1.5, charge: 0.9 }, // charge: 越えた後、止まったまま力を溜めてから放つ秒数
  },
  scoredGates: ['g1', 'g2', 'g3', 'g4', 'g5'],

  hitRadiusMin: 90,
  hint: { emphasizeAt: 3, ghostAt: 6 },
  freezeFade: 0.2,
  unfreezeFade: 0.12,
  resume: { from: 0.18, dur: 1.0 }, // 凍結明けは減速の逆: ゆっくりから加速して元の速さへ（テープの回り出し。1秒かけて大げさに）
  rank: { great: 2, good: 4 }, // 基準タイムの何倍まで
  grade: [
    ['S', 1.0],
    ['A', 1.6],
    ['B', 2.5],
    ['C', Infinity],
  ], // 合計 ÷ 基準合計
  autoDelay: 0.3,
  resultInputDelay: 0.6,

  colors: {
    bg: '#0b0c16',
    ink: '#eef0ff',
    dim: '#3a3d55',
    spark: '#ffd23f',
    coral: '#ff5a36',
    cyan: '#2ee6d6',
    magenta: '#ff3cac',
    violet: '#7b61ff',
  },
  stageTint: { T: '#0b0c16', A: '#121329', B: '#0e1828', C: '#1a1024', D: '#1a1410', E: '#0d1b1a', F: '#140f22' },
  rankColor: { PERFECT: '#ffd23f', GREAT: '#2ee6d6', GOOD: '#ff3cac', OK: '#8a8fb0' },
  font: '"Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif',
  displayFont: '"Dela Gothic One", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif', // ロゴ・評価・CLEAR
};

// ===== 10_core.js =====
// ループ・時計・状態機械・カメラ・画面サイズ・イージング

// ---- 数学とイージング ----
const TAU = Math.PI * 2;
const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (u, a, b) => clamp((u - a) / (b - a)); // u の [a,b] を 0→1 に
const Ease = {
  inQuad: k => k * k,
  inCubic: k => k * k * k,
  outCubic: k => 1 - Math.pow(1 - k, 3),
  inOutCubic: k => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2),
  outExpo: k => (k >= 1 ? 1 : 1 - Math.pow(2, -10 * k)),
  outBack: k => {
    const c1 = 1.70158;
    const c3 = c1 + 1;
    return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2);
  },
};
// シード付き乱数（同じ seed なら同じ列 ＝ 同じ t なら同じ絵）
function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// 放射状の光の画像を1画素ずつ計算して作る（canvas のグラデーションはブラウザがディザをかけ、拡大すると色のついた粒々に見えるため）
// stops: [[位置0〜1, r, g, b, a], ...]（位置の昇順）
function smoothRadial(size, stops) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const x = c.getContext('2d');
  const img = x.createImageData(size, size);
  const d = img.data;
  const h = size / 2;
  for (let j = 0; j < size; j++)
    for (let i = 0; i < size; i++) {
      const r = Math.min(1, Math.hypot(i + 0.5 - h, j + 0.5 - h) / h);
      let k = 1;
      while (k < stops.length - 1 && stops[k][0] < r) k++;
      const A = stops[k - 1];
      const B = stops[k];
      const t = clamp((r - A[0]) / Math.max(1e-6, B[0] - A[0]));
      const s = t * t * (3 - 2 * t);
      const o = (j * size + i) * 4;
      for (let n = 0; n < 4; n++) d[o + n] = Math.round(lerp(A[n + 1], B[n + 1], s));
    }
  x.putImageData(img, 0, 0);
  return c;
}

// ---- 画面 ----
const View = {
  canvas: null,
  ctx: null,
  w: 1,
  h: 1,
  dpr: 1,
  scale: 1, // scale: 論理1単位あたりの CSS px
  left: 0,
  top: 0, // キャンバスの画面上の位置（安全領域の余白ぶんずれることがある）
  halfW: 500,
  halfH: 500, // 見えている範囲の半分（論理単位）
  init(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    const onResize = () => this.resize();
    addEventListener('resize', onResize);
    if (window.visualViewport) visualViewport.addEventListener('resize', onResize);
    if (window.ResizeObserver) new ResizeObserver(onResize).observe(canvas);
    this.resize();
  },
  resize() {
    const r = this.canvas.getBoundingClientRect();
    const w = Math.max(1, r.width || window.innerWidth);
    const h = Math.max(1, r.height || window.innerHeight);
    this.w = w;
    this.h = h;
    this.left = r.left;
    this.top = r.top;
    this.dpr = Math.min(window.devicePixelRatio || 1, CONFIG.maxDpr);
    this.canvas.width = Math.round(w * this.dpr);
    this.canvas.height = Math.round(h * this.dpr);
    this.scale = Math.min(w, h) / CONFIG.logical;
    this.halfW = w / this.scale / 2;
    this.halfH = h / this.scale / 2;
    if (typeof World3D !== 'undefined' && World3D.ok) World3D.resize();
  },
  // 論理座標（原点＝画面中央）で描くための変換。ox, oy は揺れのずらし（論理単位）
  screenTransform(ctx, ox = 0, oy = 0) {
    const s = this.scale * this.dpr;
    ctx.setTransform(s, 0, 0, s, (this.w / 2 + ox * this.scale) * this.dpr, (this.h / 2 + oy * this.scale) * this.dpr);
  },
  pixelTransform(ctx) {
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
  },
  toLogical(cx, cy) {
    return { x: (cx - this.left - this.w / 2) / this.scale, y: (cy - this.top - this.h / 2) / this.scale };
  },
  toClient(lx, ly) {
    return { x: lx * this.scale + this.w / 2 + this.left, y: ly * this.scale + this.h / 2 + this.top };
  },
};

// ---- カメラ（論理 ＝ 回転・拡大 ×（ワールド − カメラ位置）） ----
const Camera = {
  make(x = 0, y = 0, zoom = 1, rot = 0) {
    return { x, y, zoom, rot };
  },
  apply(ctx, c) {
    ctx.rotate(c.rot);
    ctx.scale(c.zoom, c.zoom);
    ctx.translate(-c.x, -c.y);
  },
  toWorld(c, lx, ly) {
    const cs = Math.cos(-c.rot);
    const sn = Math.sin(-c.rot);
    return { x: c.x + (lx * cs - ly * sn) / c.zoom, y: c.y + (lx * sn + ly * cs) / c.zoom };
  },
  toLogical(c, wx, wy) {
    const dx = (wx - c.x) * c.zoom;
    const dy = (wy - c.y) * c.zoom;
    const cs = Math.cos(c.rot);
    const sn = Math.sin(c.rot);
    return { x: dx * cs - dy * sn, y: dx * sn + dy * cs };
  },
};

// ---- ステージ登録（区間の時刻は CONFIG.timeline、絵と動きはステージファイル） ----
const StageDefs = {};
function defineStage(id, def) {
  StageDefs[id] = def;
}
let Timeline = [];
function buildTimeline() {
  Timeline = CONFIG.timeline.map(row => {
    const def = StageDefs[row.id] || {};
    return Object.assign({}, row, {
      draw: def.draw || (() => {}),
      camera: def.camera || (() => Camera.make()),
      origin: def.origin || [0, 0], // ステージの座標の原点（世界座標）。粒子は世界座標で持つ
      three: def.three || null, // 3Dで描く区間: { build(scene), update(u, o), camera(u), plane }
      events: def.events || null, // [[u, fn], ...] 区間内の時刻 u を通過したら fn
      gateObj: row.gate ? makeGate(row.gate, def.gate || {}) : null,
    });
  });
  if (World3D.ok) for (const st of Timeline) if (st.three && st.three.build) st.three.build(World3D.scene);
}

// ---- 座標の切り替え（2Dの区間はカメラ、3Dの区間はゲート平面） ----
const Space = {
  is3D() {
    return !!(Game.stage.three && World3D.ok && World3D.pm);
  },
  toLocal(cx, cy) {
    // 画面（CSS px）→ 今のゲートの座標
    if (this.is3D()) return World3D.screenToPlane(cx, cy);
    const l = View.toLogical(cx, cy);
    return Camera.toWorld(Game.camera(), l.x, l.y);
  },
  toScreen(x, y) {
    // 今のゲートの座標 → 画面（CSS px）
    if (this.is3D()) return World3D.planeToScreen(x, y);
    const l = Camera.toLogical(Game.camera(), x, y);
    return View.toClient(l.x, l.y);
  },
};

// ---- 採点 ----
function rankFor(reaction, par) {
  if (reaction <= par) return 'PERFECT';
  if (reaction <= par * CONFIG.rank.great) return 'GREAT';
  if (reaction <= par * CONFIG.rank.good) return 'GOOD';
  return 'OK';
}
function scoreGate(g) {
  return { reaction: g.reaction, misses: g.misses, par: g.cfg.par, rank: rankFor(g.reaction, g.cfg.par) };
}
function overallGrade(results) {
  let sum = 0;
  let par = 0;
  let n = 0;
  let misses = 0;
  for (const id in results) {
    sum += results[id].reaction;
    par += results[id].par;
    misses += results[id].misses;
    n++;
  }
  if (!n) return { grade: '-', total: 0, misses: 0, complete: false };
  const ratio = sum / par;
  return { grade: CONFIG.grade.find(([, r]) => ratio <= r)[0], total: sum, misses, complete: n === CONFIG.scoredGates.length };
}

// ---- 拍（音楽と映像をつなぐ）----
// BGM は区間の始まり（ヒットストップ明け）で小節の頭から鳴り直すので、区間内の経過時間から拍が分かる
const Beat = {
  pulse: 0,
  bar: 0,
  heart: 0,
  off: 0,
  onset: false,
  barOnset: false,
  idx: -1,
  update() {
    const s = Game.stage;
    this.pulse = 0;
    this.bar = 0;
    this.heart = 0;
    this.off = 0;
    this.onset = false;
    this.barOnset = false;
    if (Game.phase === 'PLAY' && s.id !== 'T' && !(s.id === 'F' && Game.u() > 0.86)) {
      const bt = Math.max(0, (Game.t - s.from) / CONFIG.beat);
      const ph = bt - Math.floor(bt);
      this.pulse = Math.exp(-ph * 5);
      this.off = Math.exp(-((bt + 0.5) % 1) * 5); // 裏拍
      if (Math.floor(bt) % 4 === 0) this.bar = this.pulse; // 小節の頭は強く
      const bi = Math.floor(bt) + s.from * 10; // 拍の頭（背景の演出を鳴らす）
      if (bi !== this.idx) {
        this.onset = this.idx >= 0;
        this.barOnset = this.onset && Math.floor(bt) % 4 === 0;
        this.idx = bi;
      }
    } else if (Game.phase === 'GATE' && s.id !== 'T' && Game.freezeAge >= 0.25) {
      const h = (Game.freezeAge - 0.25) % 1; // 凍結中は心拍（BGMの心拍と同じ周期）
      this.heart = Math.exp(-h * 7) + (h > 0.2 ? 0.6 * Math.exp(-(h - 0.2) * 7) : 0);
    }
  },
};

// ---- ゲーム本体（状態機械） ----
// phase: 'PLAY' | 'GATE' | 'BURST' | 'RESULT'（タイトルは区間 T のゲートで凍結している状態）
const Game = {
  phase: 'GATE',
  idx: 0,
  t: 0,
  playTime: 0, // タイムライン上で進んだ時間の累計
  realPlay: 0, // PLAY 中に流れた実時間の累計
  timeScale: 1,
  resumeAge: 99,
  burstLeft: 0,
  freezeAge: 0,
  prevU: 0,
  chargeLeft: 0,
  chargeK: 0, // 溜めてから放つゲート（コア）の残り秒数と溜まり具合 0→1
  audioAt: 0, // 最後に時計を進めた瞬間の音の時刻（BGM の刻みをゲームの時計に合わせる対応点）
  results: {},
  hold: false,
  wound: false,

  get stage() {
    return Timeline[this.idx];
  },
  get state() {
    return this.phase === 'GATE' && this.stage.id === 'T' ? 'TITLE' : this.phase;
  },
  u() {
    const s = this.stage;
    return s.to > s.from ? clamp((this.t - s.from) / (s.to - s.from)) : 1;
  },
  camera() {
    return this.stage.camera(this.u());
  },

  clear() {
    this.t = 0;
    this.playTime = 0;
    this.realPlay = 0;
    this.results = {};
    this.timeScale = 1;
    this.resumeAge = 99;
    this.prevU = 0;
    this.wound = false;
    this.chargeLeft = 0;
    this.chargeK = 0;
    FX.reset();
    if (World3D.ok) World3D.restore(); // 前の回で動かされた3Dの物を組み上げた直後の姿へ（やり直すと表示が崩れる不具合の対策）
  },
  reset() {
    this.clear();
    this.idx = 0;
    this.enterGate();
  },
  // リトライ: タイトルのボタンを押したのと同じ流れで区間 A へ
  restart() {
    this.clear();
    this.idx = 0;
    const g = this.stage.gateObj;
    g.enter();
    g.succeed();
    this.phase = 'GATE';
    this.enterBurst();
  },
  // 任意の時刻から開始（検証用）
  jumpTo(t) {
    this.clear();
    t = clamp(t, 0, Timeline[Timeline.length - 1].to);
    let i = 1;
    while (i < Timeline.length - 1 && t > Timeline[i].to) i++;
    this.idx = i;
    this.t = t;
    this.prevU = this.u();
    this.phase = 'PLAY';
    this.prepStage();
    this.checkEnd();
  },

  enterGate() {
    this.phase = 'GATE';
    this.freezeAge = 0;
    Input.markStale();
    this.stage.gateObj.enter();
    if (this.stage.id !== 'T') FX.onFreeze(); // 凍結の効果音は鳴らさない（BGMの減速で表す）
    Music.onFreeze(this.idx);
  },
  enterBurst() {
    const g = this.stage.gateObj;
    if (g.cfg.scored) this.results[g.id] = scoreGate(g);
    this.phase = 'BURST';
    this.burstLeft = g.cfg.hitStop;
    this.chargeLeft = g.cfg.charge || 0;
    this.chargeK = 0;
    // 溜めてから放つゲート（コア）
    if (this.chargeLeft > 0) {
      const kind = GateKinds[g.kindName];
      if (kind.chargeStart) kind.chargeStart(g, this.chargeLeft);
    } else {
      FX.onGateSuccess(g);
      Sound.sfx('success', { step: this.idx, kind: g.kindName });
    }
  },
  leaveBurst() {
    FX.handOff();
    this.idx++;
    this.phase = 'PLAY';
    this.prevU = 0;
    this.resumeAge = 0;
    this.wound = false;
    Music.onResume(this.idx - 1); // 時間が動き出す瞬間に BGM も小節の頭から鳴り直す
    this.prepStage();
    this.checkEnd();
  },
  // 区間の始まりにゲートを初期状態に戻す（区間の終わりで予告として描くため）
  prepStage() {
    const g = this.stage.gateObj;
    if (g) g.enter();
  },
  enterResult() {
    this.phase = 'RESULT';
    UI.onResult(this.results);
    Music.toResult();
  },
  checkEnd() {
    const s = this.stage;
    if (this.t < s.to) return false;
    this.t = s.to;
    if (s.gateObj) this.enterGate();
    else this.enterResult();
    return true;
  },
  fireEvents() {
    const s = this.stage;
    const u = this.u();
    if (s.events) for (const [eu, fn] of s.events) if (this.prevU < eu && eu <= u) fn();
    const cues = SoundCues[s.id];
    if (cues) for (const [eu, name, o] of cues) if (this.prevU < eu && eu <= u) Sound.sfx(name, o);
    this.prevU = u;
  },

  update(dt) {
    FX.update(dt);
    UI.update(dt);
    Beat.update();
    if (this.phase === 'PLAY') {
      this.resumeAge += dt;
      const r = CONFIG.resume;
      const W = CONFIG.windDown;
      const s = this.stage;
      const rem = s.to - this.t;
      this.timeScale = this.resumeAge < r.dur && s.id !== 'F' ? lerp(r.from, 1, Ease.inQuad(this.resumeAge / r.dur)) : 1; // コアを壊した後（区間F）は回り出さず、いきなり全速で爆発
      if (s.gateObj && rem < W.lead) {
        // 凍結の手前: 時間と BGM が一緒に減速する
        this.timeScale *= lerp(W.minScale, 1, rem / W.lead);
        if (!this.wound && !this.hold) {
          this.wound = true;
          Music.windDown(rem / ((1 + W.minScale) / 2));
        }
      }
      if (!this.hold) {
        const nt = Math.min(this.t + dt * this.timeScale, this.stage.to);
        this.audioAt = Sound.ctx ? Sound.ctx.currentTime : 0;
        this.playTime += nt - this.t;
        this.realPlay += dt;
        this.t = nt;
        this.fireEvents();
      }
      this.checkEnd();
    } else if (this.phase === 'GATE') {
      const g = this.stage.gateObj;
      this.freezeAge += dt;
      g.update(dt);
      if (Debug.auto && this.freezeAge >= CONFIG.autoDelay && !g.done) g.succeed();
      if (g.done) this.enterBurst();
    } else if (this.phase === 'BURST') {
      const g = this.stage.gateObj;
      g.update(dt);
      if (this.chargeLeft > 0) {
        // 溜め: 時間は止まったまま、力が集まっていく → 溜まりきったら放つ
        this.chargeLeft -= dt;
        this.chargeK = clamp(1 - this.chargeLeft / g.cfg.charge);
        const kind = GateKinds[g.kindName];
        if (kind.charging) kind.charging(g, this.chargeK, dt);
        if (this.chargeLeft <= 0) {
          FX.onGateSuccess(g);
          Sound.sfx('success', { step: this.idx, kind: g.kindName });
          FX.flash(0.9);
          FX.kick(0.1);
        }
      } else {
        this.burstLeft -= dt;
        if (this.burstLeft <= 0) this.leaveBurst();
      }
    }
  },

  onPointer(type, p) {
    if (this.phase === 'GATE') {
      const g = this.stage.gateObj;
      if (type === 'down') g.down(p);
      else if (type === 'move') g.move(p);
      else g.up(p);
    } else if (this.phase === 'RESULT' && type === 'down') {
      UI.onResultDown(p);
    }
  },
};

// ---- 描画 ----
function render() {
  const ctx = View.ctx;
  const s = Game.stage;
  const t3 = s.three && World3D.ok ? s.three : null;
  const W = View.canvas.width;
  const H = View.canvas.height;
  // 拍でカメラがわずかに寄る
  const u = Game.u();
  const sh = FX.shakeOffset();
  const bz = sh.zoom * (1 + 0.015 * Beat.pulse + 0.02 * Beat.bar);
  const frozen = Game.phase === 'GATE' || Game.phase === 'BURST';
  const g = frozen ? s.gateObj : null;
  World3D.show(!!t3);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;

  if (t3) {
    // 3D の区間: 奥に3D、手前の2Dは操作対象・画面効果・UIだけ
    ctx.clearRect(0, 0, W, H);
    for (const st of Timeline) if (st.three && st.three.group) st.three.group.visible = st === s; // 今の区間の3Dだけ見せる（区間の update が前後の区間を見せることはある）
    t3.update(u, { frozen, omitGateObject: frozen, t: Game.t });
    World3D.render(t3.camera(u), sh, bz);
    if (t3.plane) World3D.setPlane(typeof t3.plane === 'function' ? t3.plane(u) : t3.plane);
    if (World3D.pm) {
      World3D.applyPlane(ctx);
      if (t3.overlay) t3.overlay(ctx, u); // 3Dの上に平面に沿って描く2D（文字など）
      if (g) {
        g.draw(ctx);
        g.drawHint(ctx);
      }
      FX.drawLive(ctx, g);
    }
  } else {
    // 2D の区間
    ctx.fillStyle = CONFIG.stageTint[s.id] || CONFIG.colors.bg;
    ctx.fillRect(0, 0, W, H);
    const cam = s.camera(u);
    const toWorld = () => {
      View.screenTransform(ctx, sh.x, sh.y);
      ctx.rotate(sh.rot);
      ctx.scale(bz, bz);
      Camera.apply(ctx, cam);
    };
    toWorld();
    s.draw(ctx, u, { frozen, omitGateObject: frozen, t: Game.t });
    FX.drawWorld(ctx);
    const fp = s.gateObj ? FX.fxPoint(s.gateObj) : null; // 凍結の見た目は操作対象の周りだけ明るく残す
    FX.drawFreeze(ctx, fp ? Camera.toLogical(cam, fp.x, fp.y) : null);
    toWorld();
    // ゲート物体はフルカラーで上に描く
    if (g) {
      g.draw(ctx);
      g.drawHint(ctx);
    }
    FX.drawLive(ctx, g);
  }
  View.screenTransform(ctx);
  FX.drawScreen(ctx);
  UI.draw(ctx);
  Debug.draw(ctx);
}

// ---- ループ ----
let lastNow = 0;
function frame(now) {
  const dt = lastNow ? Math.min((now - lastNow) / 1000, CONFIG.maxDt) : 0;
  lastNow = now;
  try {
    Game.update(dt);
    render();
    Debug.tick(dt);
  } catch (e) {
    Debug.reportError(e);
  }
  requestAnimationFrame(frame);
}

// ===== 12_three.js =====
// 3D の世界（three.js / WebGL）。奥のキャンバスに描き、手前の2Dキャンバス（操作対象・画面効果・UI）と重ねる。
// three.js が読めない・WebGL が使えないときは ok = false のまま（2D版で動く）。
// 3D の座標は y が上向き。ゲート平面の2D座標は y が下向き（今までの2Dと同じ）。
const World3D = (() => {
  const W = {
    ok: false,
    canvas: null,
    renderer: null,
    scene: null,
    camera: null,
    rt: null,
    post: null,
    postScene: null,
    postCam: null,
    plane: null,
    pm: null,
  };
  const PMAX = 2600; // 粒の上限（フィナーレの花火で増やした）
  const colors = {};
  const rgb = hex =>
    colors[hex] ||
    (colors[hex] = (() => {
      const c = new THREE.Color(hex);
      return [c.r, c.g, c.b];
    })());

  W.init = canvas => {
    W.canvas = canvas;
    if (typeof THREE === 'undefined' || /[?&]flat\b/.test(location.search)) return; // ?flat で 2D版を確かめる
    try {
      const r = new THREE.WebGLRenderer({ canvas, antialias: true });
      r.setClearColor(new THREE.Color(CONFIG.colors.bg), 1);
      W.renderer = r;
      W.scene = new THREE.Scene();
      W.scene.fog = new THREE.Fog(CONFIG.colors.bg, 3200, 12000);
      W.camera = new THREE.PerspectiveCamera(50, 1, 10, 20000); // near 10: 深度の精度を上げる
      W.scene.add(new THREE.AmbientLight(0xffffff, 0.55));
      const key = new THREE.DirectionalLight(0xffffff, 0.9);
      key.position.set(0.4, 1, 0.8);
      W.scene.add(key);
      // 凍結の見た目: 3D を一度テクスチャに描き、全画面の四角形で彩度落とし・暗転・周辺減光（心拍で脈打つ）
      W.rt = new THREE.WebGLRenderTarget(4, 4, { stencilBuffer: true }); // ステンシル付きにすると深度が 24bit になる（16bit だと離れた壁とタイルがちらつく）
      W.post = new THREE.ShaderMaterial({
        uniforms: { tex: { value: W.rt.texture }, freeze: { value: 0 }, heart: { value: 0 } },
        vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
        fragmentShader: [
          'uniform sampler2D tex; uniform float freeze; uniform float heart; varying vec2 vUv;',
          'void main() {',
          '  vec4 c = texture2D(tex, vUv);',
          '  float g = dot(c.rgb, vec3(0.299, 0.587, 0.114));',
          '  vec3 col = mix(c.rgb, vec3(g), 0.85 * freeze) * (1.0 - 0.35 * freeze);',
          '  float d = distance(vUv, vec2(0.5));',
          '  col *= 1.0 - freeze * smoothstep(0.22 + 0.03 * heart, 0.8, d) * (0.6 + 0.12 * heart);',
          '  gl_FragColor = vec4(col, 1.0);',
          '}',
        ].join('\n'),
        depthTest: false,
        depthWrite: false,
      });
      W.postScene = new THREE.Scene();
      W.postScene.add(new THREE.Mesh(new THREE.PlaneBufferGeometry(2, 2), W.post));
      W.postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
      initFx();
      initBg();
      initSpectrum();
      // 背景の星（奥行きと視差を出す。全3D区間で共通）
      const R = rng(7);
      const N = 700;
      const sp = new Float32Array(N * 3);
      for (let i = 0; i < N; i++) {
        sp[i * 3] = (R() - 0.5) * 7000;
        sp[i * 3 + 1] = -2500 + R() * 7000;
        sp[i * 3 + 2] = -500 - R() * 5000;
      }
      const sg = new THREE.BufferGeometry();
      sg.setAttribute('position', new THREE.BufferAttribute(sp, 3));
      W.stars = new THREE.Points(
        sg,
        new THREE.PointsMaterial({
          color: 0xa9b8ff,
          size: 9,
          sizeAttenuation: true,
          transparent: true,
          opacity: 0.5,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
          map: new THREE.CanvasTexture(
            smoothRadial(32, [
              [0, 255, 255, 255, 255],
              [1, 255, 255, 255, 0],
            ]),
          ),
        }),
      ); // 足し合わせのみ（光の上で暗い点にならない）
      W.scene.add(W.stars);
      W.ok = true;
      W.resize();
    } catch (e) {
      W.ok = false;
      Debug.reportError(e);
    }
  };

  W.resize = () => {
    if (!W.ok) return;
    W.pr = Math.min(View.dpr, 2); // 3D の描画解像度の上限（スマホの dpr 3 では 2 に抑えて軽く）
    W.renderer.setPixelRatio(W.pr);
    W.renderer.setSize(View.w, View.h, false);
    W.rt.setSize(Math.round(View.w * W.pr), Math.round(View.h * W.pr));
    W.camera.aspect = View.w / View.h;
    W.camera.updateProjectionMatrix();
  };
  W.show = on => {
    if (W.canvas) W.canvas.style.visibility = on ? 'visible' : 'hidden';
  };
  // 画面の短辺に span 単位が収まるカメラ距離（2D の論理 1000 単位と同じ見え方にする）
  W.fitDist = (fov = 50, span = CONFIG.logical) => span / 2 / (Math.tan((fov * Math.PI) / 360) * Math.min(1, View.w / View.h));

  // cam: { pos, look, fov, roll }。sh: 揺れ（論理単位）、zoom: 突きと拍の寄り
  W.render = (cam, sh = { x: 0, y: 0, rot: 0 }, zoom = 1) => {
    const c = W.camera;
    const fov = (cam.fov || 50) / zoom;
    c.fov = fov;
    c.updateProjectionMatrix();
    c.position.set(cam.pos[0], cam.pos[1], cam.pos[2]);
    const up = cam.up || [0, 1, 0]; // 真上を見上げるときは up を (0,0,-1) などにする
    c.up.set(up[0], up[1], up[2]);
    c.lookAt(cam.look[0], cam.look[1], cam.look[2]);
    c.rotateZ((cam.roll || 0) + sh.rot);
    const dist = Math.hypot(cam.pos[0] - cam.look[0], cam.pos[1] - cam.look[1], cam.pos[2] - cam.look[2]);
    const k = dist / 1000;
    c.translateX(sh.x * k);
    c.translateY(-sh.y * k);
    c.updateMatrixWorld();
    if (W.bg) updateBg(c);
    if (W.specGeo) {
      const now = performance.now() / 1000;
      updateSpectrum(Math.min(0.1, now - (W.specT || now)));
      W.specT = now;
    }
    W.fxMat.uniforms.scale.value = (View.h * (W.pr || View.dpr)) / (2 * Math.tan((fov * Math.PI) / 360));
    W.post.uniforms.freeze.value = FX.freezeK * (Game.stage && Game.stage.id === 'T' ? 0.3 : 1); // タイトルはボタンの色を残す（押す場所が分かるように）
    W.post.uniforms.heart.value = Beat.heart;
    if (W.stars) W.stars.material.opacity = 0.35 + 0.35 * Beat.pulse + 0.25 * Beat.heart; // 拍と心拍で星が瞬く
    W.renderer.setRenderTarget(W.rt);
    W.renderer.render(W.scene, c);
    W.renderer.setRenderTarget(null);
    W.renderer.render(W.postScene, W.postCam);
  };

  // 3D の点 → 画面（CSS px）
  W.project = (x, y, z) => {
    const v = new THREE.Vector3(x, y, z).project(W.camera);
    return { x: (v.x * 0.5 + 0.5) * View.w + View.left, y: (-v.y * 0.5 + 0.5) * View.h + View.top, z: v.z };
  };

  // ---- ゲート平面: 平面の2D座標（y下向き）↔ 3D ↔ 画面 ----
  // plane: { o: 原点, r: 右方向の単位ベクトル, d: 下方向の単位ベクトル }（平面の1単位 = 世界の1単位）
  W.setPlane = pl => {
    W.plane = pl;
    const S = 100;
    const o = pl.o;
    const r = pl.r;
    const d = pl.d;
    const p0 = W.project(o[0], o[1], o[2]);
    const pr = W.project(o[0] + r[0] * S, o[1] + r[1] * S, o[2] + r[2] * S);
    const pd = W.project(o[0] + d[0] * S, o[1] + d[1] * S, o[2] + d[2] * S);
    W.pm = { a: (pr.x - p0.x) / S, b: (pr.y - p0.y) / S, c: (pd.x - p0.x) / S, d: (pd.y - p0.y) / S, e: p0.x, f: p0.y };
  };
  W.planeToScreen = (x, y) => {
    const m = W.pm;
    return { x: m.a * x + m.c * y + m.e, y: m.b * x + m.d * y + m.f };
  };
  W.screenToPlane = (sx, sy) => {
    const m = W.pm;
    const det = m.a * m.d - m.b * m.c;
    const X = sx - m.e;
    const Y = sy - m.f;
    return { x: (m.d * X - m.c * Y) / det, y: (-m.b * X + m.a * Y) / det };
  };
  W.applyPlane = ctx => {
    const m = W.pm;
    const k = View.dpr;
    ctx.setTransform(m.a * k, m.b * k, m.c * k, m.d * k, (m.e - View.left) * k, (m.f - View.top) * k);
  };
  W.planePoint = (x, y) => {
    const p = W.plane;
    return [0, 1, 2].map(i => p.o[i] + p.r[i] * x + p.d[i] * y);
  };
  W.planeVec = (x, y) => {
    const p = W.plane;
    return [0, 1, 2].map(i => p.r[i] * x + p.d[i] * y);
  };
  W.planeNormal = () => {
    const r = W.plane.r;
    const d = W.plane.d;
    return [r[1] * d[2] - r[2] * d[1], r[2] * d[0] - r[0] * d[2], r[0] * d[1] - r[1] * d[0]];
  };

  // ---- 3D の粒子と衝撃波（世界座標）。凍結中とヒットストップ中は空中で止まる ----
  W.fx = { parts: [], rings: [] };
  function initFx() {
    const geo = new THREE.BufferGeometry();
    W.fxPos = new Float32Array(PMAX * 3);
    W.fxCol = new Float32Array(PMAX * 3);
    W.fxSize = new Float32Array(PMAX);
    W.fxAlpha = new Float32Array(PMAX);
    W.fxSeed = new Float32Array(PMAX);
    W.fxMix = new Float32Array(PMAX);
    geo.setAttribute('position', new THREE.BufferAttribute(W.fxPos, 3));
    geo.setAttribute('pcolor', new THREE.BufferAttribute(W.fxCol, 3));
    geo.setAttribute('psize', new THREE.BufferAttribute(W.fxSize, 1));
    geo.setAttribute('palpha', new THREE.BufferAttribute(W.fxAlpha, 1));
    geo.setAttribute('pseed', new THREE.BufferAttribute(W.fxSeed, 1));
    geo.setAttribute('pmix', new THREE.BufferAttribute(W.fxMix, 1)); // 虹色の混ぜ具合（ふつうは 0.65、花火は自分の色を強く）
    W.fxMat = new THREE.ShaderMaterial({
      uniforms: { scale: { value: 1 }, time: { value: 0 } }, // 粒: 虹色に移ろい、瞬き、十字に光る
      vertexShader: [
        'attribute vec3 pcolor; attribute float psize; attribute float palpha; attribute float pseed; attribute float pmix; uniform float scale; uniform float time; varying vec3 vC; varying float vA; varying float vS; varying float vM;',
        'void main() { vC = pcolor; vA = palpha; vS = pseed; vM = pmix; vec4 mv = modelViewMatrix * vec4(position, 1.0); gl_PointSize = 1.8 * psize * scale / -mv.z * (1.0 + 0.35 * sin(time * 11.0 + pseed * 60.0)); gl_Position = projectionMatrix * mv; }',
      ].join('\n'),
      fragmentShader: [
        'varying vec3 vC; varying float vA; varying float vS; varying float vM; uniform float time;',
        'vec3 hue(float h) { return clamp(abs(mod(h * 6.0 + vec3(0.0, 4.0, 2.0), 6.0) - 3.0) - 1.0, 0.0, 1.0); }',
        'void main() { vec2 p = gl_PointCoord - 0.5; float d = length(p) * 2.0; float core = smoothstep(0.55, 0.0, d);',
        '  float rays = max(0.0, 1.0 - abs(p.x) * 16.0) * max(0.0, 1.0 - abs(p.y) * 2.0) + max(0.0, 1.0 - abs(p.y) * 16.0) * max(0.0, 1.0 - abs(p.x) * 2.0);',
        '  float tw = 0.5 + 0.5 * sin(time * 17.0 + vS * 50.0); vec3 col = mix(vC, hue(fract(vS + time * 0.4)), vM);',
        '  float a = (core + rays * (0.35 + 0.65 * tw)) * vA; gl_FragColor = vec4(col * a * (0.8 + 0.7 * tw) + vec3(pow(core, 5.0)) * vA, a); }',
      ].join('\n'),
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
    });
    W.fxGeo = geo;
    const pts = new THREE.Points(geo, W.fxMat);
    pts.frustumCulled = false;
    W.scene.add(pts);
    W.ringGeo = new THREE.RingGeometry(0.92, 1, 64);
  }
  W.spawn = q => {
    // q: { p, v, g, life, size, color（または c: [r,g,b]）, drag, live, mix（虹色の混ぜ具合）, trail: { dt, life, size }（尾を引く） }
    if (W.fx.parts.length >= PMAX) W.fx.parts.shift();
    W.fx.parts.push({
      p: q.p.slice(),
      v: q.v.slice(),
      g: q.g || [0, 0, 0],
      life: q.life,
      age: 0,
      size: q.size,
      c: q.c || rgb(q.color),
      drag: q.drag == null ? 3 : q.drag,
      live: !!q.live,
      seed: Math.random(),
      mix: q.mix == null ? 0.65 : q.mix,
      trail: q.trail || null,
      tacc: 0,
    });
  };
  // 決まった道を動く「きらめく粒」の群れ（3Dの粒と同じくっきりした見た目。位置は毎フレーム begin → add … → end で与える）
  W.sparkles = (n, parent) => {
    const g = new THREE.BufferGeometry();
    const A = {
      pos: new Float32Array(n * 3),
      col: new Float32Array(n * 3),
      size: new Float32Array(n),
      alpha: new Float32Array(n),
      seed: new Float32Array(n),
      mix: new Float32Array(n),
    };
    for (let i = 0; i < n; i++) A.seed[i] = Math.random();
    [
      ['position', A.pos, 3],
      ['pcolor', A.col, 3],
      ['psize', A.size, 1],
      ['palpha', A.alpha, 1],
      ['pseed', A.seed, 1],
      ['pmix', A.mix, 1],
    ].forEach(([k, arr, w]) => g.setAttribute(k, new THREE.BufferAttribute(arr, w)));
    const pts = new THREE.Points(g, W.fxMat);
    pts.frustumCulled = false;
    (parent || W.scene).add(pts);
    let cnt = 0;
    return {
      pts,
      begin() {
        cnt = 0;
      },
      add(p, size, color, alpha = 1, mix = 0.65) {
        if (cnt >= n) return;
        A.pos.set(p, cnt * 3);
        A.col.set(rgb(color), cnt * 3);
        A.size[cnt] = size;
        A.alpha[cnt] = alpha;
        A.mix[cnt] = mix;
        cnt++;
      },
      end() {
        g.setDrawRange(0, cnt);
        ['position', 'pcolor', 'psize', 'palpha', 'pmix'].forEach(k => {
          g.attributes[k].needsUpdate = true;
        });
      },
    };
  };
  // 輪のまわりにきらめく粒を散らす（c: 中心、ax/ay: 輪の面の2軸、out: 外へ飛ぶ速さ）
  W.sparkRing = (c, ax, ay, r, n, out = 300, life = 0.8, size = 26) => {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU;
      const ca = Math.cos(a);
      const sa = Math.sin(a);
      const d = [0, 1, 2].map(k => ax[k] * ca + ay[k] * sa);
      W.spawn({
        p: c.map((v, k) => v + d[k] * r),
        v: d.map(v => v * out * (0.5 + Math.random())),
        life: life * (0.6 + 0.8 * Math.random()),
        size: size * (0.6 + 0.8 * Math.random()),
        color: '#ffffff',
        drag: 1.5,
      });
    }
  };
  // 背景: 音に合わせて脈打つ図形と、拍ごとにはじけるきらめき（ゲームとは関係なく、カメラのまわりに浮かぶ）
  function initBg() {
    const R = rng(123);
    const cols = [CONFIG.colors.cyan, CONFIG.colors.magenta, CONFIG.colors.violet, CONFIG.colors.spark, CONFIG.colors.coral];
    W.bg = new THREE.Group();
    W.bgItems = [];
    for (let i = 0; i < 56; i++) {
      const t = i % 4;
      const s = 60 + R() * 140;
      const geo =
        t === 0
          ? new THREE.IcosahedronGeometry(s, 0)
          : t === 1
            ? new THREE.OctahedronGeometry(s, 0)
            : t === 2
              ? new THREE.TorusGeometry(s, s * 0.08, 6, 24)
              : new THREE.TetrahedronGeometry(s, 0);
      const m = new THREE.Mesh(
        geo,
        new THREE.MeshBasicMaterial({
          color: cols[i % cols.length],
          wireframe: t !== 2,
          transparent: true,
          opacity: 0.55,
          depthWrite: false,
        }),
      );
      const th = R() * TAU;
      const ph = Math.acos(2 * R() - 1);
      const rad = 3200 + R() * 4000;
      m.position.set(rad * Math.sin(ph) * Math.cos(th), rad * Math.cos(ph), rad * Math.sin(ph) * Math.sin(th));
      m.userData = { spin: [(R() - 0.5) * 1.2, (R() - 0.5) * 1.2], off: i % 2 === 1, base: 1 };
      W.bg.add(m);
      W.bgItems.push(m);
    }
    W.scene.add(W.bg);
  }
  // スペクトログラム: 音の周波数（x）× 強さ（y）× 時間（z、新しい行が 0、古い行ほど −1 へ流れる）を、虹色に瞬く粒の立体で描く。
  // 形（粒の位置）は1つを共有し、場面ごとに世界の中へ置いた複数の「物」として映す（W.addSpectrum）
  // 粒の数（1つにつき 1728 粒）
  const SB = 48;
  const SR = 36;
  function initSpectrum() {
    const n = SB * SR;
    const geo = new THREE.BufferGeometry();
    W.specPos = new Float32Array(n * 3);
    W.specAmp = new Float32Array(n);
    W.specSeed = new Float32Array(n);
    W.specBin = new Float32Array(n);
    W.specRows = Array.from({ length: SR }, () => new Float32Array(SB));
    W.specHead = 0;
    W.specAcc = 0;
    for (let i = 0; i < n; i++) {
      W.specSeed[i] = Math.random();
      W.specBin[i] = (i % SB) / (SB - 1);
    }
    geo.setAttribute('position', new THREE.BufferAttribute(W.specPos, 3));
    geo.setAttribute('pamp', new THREE.BufferAttribute(W.specAmp, 1));
    geo.setAttribute('pseed', new THREE.BufferAttribute(W.specSeed, 1));
    geo.setAttribute('pbin', new THREE.BufferAttribute(W.specBin, 1));
    W.specMat = new THREE.ShaderMaterial({
      uniforms: { scale: { value: 1 }, time: { value: 0 } },
      vertexShader: [
        'attribute float pamp; attribute float pseed; attribute float pbin; uniform float scale; uniform float time; varying float vA; varying float vS; varying float vB;',
        'void main() { vA = pamp; vS = pseed; vB = pbin; vec4 mv = modelViewMatrix * vec4(position, 1.0);',
        '  gl_PointSize = (32.0 + 64.0 * pamp) * scale / -mv.z * (1.0 + 0.3 * sin(time * 9.0 + pseed * 40.0)); gl_Position = projectionMatrix * mv; }',
      ].join('\n'),
      fragmentShader: [
        'varying float vA; varying float vS; varying float vB; uniform float time;',
        'vec3 hue(float h) { return clamp(abs(mod(h * 6.0 + vec3(0.0, 4.0, 2.0), 6.0) - 3.0) - 1.0, 0.0, 1.0); }',
        'void main() { vec2 p = gl_PointCoord - 0.5; float d = length(p) * 2.0; float core = smoothstep(0.6, 0.0, d);',
        '  float rays = max(0.0, 1.0 - abs(p.x) * 16.0) * max(0.0, 1.0 - abs(p.y) * 2.0) + max(0.0, 1.0 - abs(p.y) * 16.0) * max(0.0, 1.0 - abs(p.x) * 2.0);',
        '  float tw = 0.5 + 0.5 * sin(time * 13.0 + vS * 50.0); vec3 col = hue(fract(0.72 - vB * 0.8 + time * 0.05));',
        '  float a = (core + rays * (0.25 + 0.75 * vA) * (0.3 + 0.7 * tw)) * (0.35 + 0.65 * vA); gl_FragColor = vec4(col * a * (0.8 + 0.6 * tw) + vec3(pow(core, 5.0)) * vA * 0.6, a); }',
      ].join('\n'),
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
    });
    W.specGeo = geo;
    W.specData = null;
  }
  // 世界の中にスペクトログラムを1つ置く。o: { parent, pos, x, y, z（周波数・強さ・時間の向きの世界ベクトル。右手系）, size: [横の半分, 高さ, 奥行き] }
  W.addSpectrum = o => {
    const m = new THREE.Points(W.specGeo, W.specMat);
    m.frustumCulled = false;
    m.matrixAutoUpdate = false;
    const V = a => new THREE.Vector3(...a).normalize();
    const [sx, sy, sz] = o.size;
    const mx = new THREE.Matrix4().makeBasis(V(o.x).multiplyScalar(sx), V(o.y).multiplyScalar(sy), V(o.z).multiplyScalar(sz));
    mx.setPosition(new THREE.Vector3(...o.pos));
    m.matrix.copy(mx);
    (o.parent || W.scene).add(m);
    return m;
  };
  function specRow() {
    // 今の音の周波数の強さ（低音→高音を対数で 64 本に）。音が無いときは拍から作る
    const row = new Float32Array(SB);
    const an = Sound.analyser;
    if (an && Sound.ctx && Sound.ctx.state === 'running') {
      const N = an.frequencyBinCount;
      if (!W.specData || W.specData.length !== N) W.specData = new Uint8Array(N);
      an.getByteFrequencyData(W.specData);
      for (let b = 0; b < SB; b++) {
        const f0 = Math.floor(2 * Math.pow(N / 2, b / SB));
        const f1 = Math.max(f0 + 1, Math.floor(2 * Math.pow(N / 2, (b + 1) / SB)));
        let m = 0;
        for (let f = f0; f < Math.min(N, f1); f++) m = Math.max(m, W.specData[f]);
        row[b] = Math.pow(m / 255, 1.6);
      }
    } else {
      for (let b = 0; b < SB; b++)
        row[b] = clamp(
          (0.25 + 0.75 * Beat.pulse) * Math.exp(-b / 26) * (0.55 + 0.45 * Math.sin(FX.time * 3 + b * 0.7)) +
            0.25 * Beat.off * Math.exp(-Math.abs(b - 40) / 6) +
            0.3 * Beat.heart * Math.exp(-b / 8),
        );
    }
    return row;
  }
  function updateSpectrum(dt) {
    W.specAcc += dt;
    // 1秒に30行
    if (W.specAcc >= 1 / 30) {
      W.specAcc = 0;
      W.specHead = (W.specHead + 1) % SR;
      W.specRows[W.specHead] = specRow();
    }
    const frac = W.specAcc * 30; // 行の間を滑らかに流す
    for (let r = 0; r < SR; r++) {
      const row = W.specRows[(W.specHead - r + SR) % SR];
      const z = -(r + frac) / SR;
      for (let b = 0; b < SB; b++) {
        const i = r * SB + b;
        const a = row[b];
        W.specPos[i * 3] = (b / (SB - 1)) * 2 - 1;
        W.specPos[i * 3 + 1] = a;
        W.specPos[i * 3 + 2] = z;
        W.specAmp[i] = a * (1 - (r / SR) * 0.6);
      }
    }
    W.specGeo.attributes.position.needsUpdate = true;
    W.specGeo.attributes.pamp.needsUpdate = true;
    W.specMat.uniforms.time.value = FX.time;
    W.specMat.uniforms.scale.value = W.fxMat.uniforms.scale.value;
  }
  function updateBg(cam) {
    W.bg.position.copy(cam.position);
    W.bg.rotation.y = FX.time * 0.02;
    for (const m of W.bgItems) {
      const u = m.userData;
      const p = u.off ? Beat.off : Beat.pulse;
      m.rotation.x = FX.time * u.spin[0];
      m.rotation.y = FX.time * u.spin[1];
      m.scale.setScalar(1 + 0.45 * p + 0.3 * Beat.bar + 0.35 * Beat.heart);
      m.material.opacity = 0.25 + 0.55 * p + 0.3 * Beat.heart;
    }
    if (Beat.onset && Game.phase === 'PLAY') {
      // 拍の頭で背景のどこかにきらめきがはじける（小節の頭は輪）
      for (let j = 0; j < (Beat.barOnset ? 3 : 1); j++) {
        const th = Math.random() * TAU;
        const ph = 0.6 + Math.random() * 1.9;
        const rad = 1800 + Math.random() * 1600;
        const c = [
          cam.position.x + rad * Math.sin(ph) * Math.cos(th),
          cam.position.y + rad * Math.cos(ph),
          cam.position.z + rad * Math.sin(ph) * Math.sin(th),
        ];
        W.sparkRing(c, [1, 0, 0], [0, 1, 0], 40 + Math.random() * 60, Beat.barOnset ? 30 : 18, 500, 0.7, 34);
      }
    }
  }
  W.ring = (pos, normal, color, size, life, live) => {
    const m = new THREE.Mesh(W.ringGeo, W.addMat(color, { side: THREE.DoubleSide }));
    m.position.set(pos[0], pos[1], pos[2]);
    m.lookAt(pos[0] + normal[0], pos[1] + normal[1], pos[2] + normal[2]);
    m.scale.setScalar(0.001);
    W.scene.add(m);
    W.fx.rings.push({ m, size, life, age: 0, live: !!live });
  };
  W.updateFx = (dt, wdt) => {
    if (!W.ok) return;
    let j = 0;
    const tails = [];
    for (const p of W.fx.parts) {
      const d = p.live ? dt : wdt;
      if (d > 0) {
        p.age += d;
        const k = Math.exp(-p.drag * d);
        for (let i = 0; i < 3; i++) {
          p.v[i] = p.v[i] * k + p.g[i] * d;
          p.p[i] += p.v[i] * d;
        }
        if (p.trail) for (p.tacc += d; p.tacc >= p.trail.dt; p.tacc -= p.trail.dt) tails.push(p); // 尾: 通った所に小さく短い粒を置いていく
      }
      if (p.age < p.life) W.fx.parts[j++] = p;
    }
    W.fx.parts.length = j;
    for (const p of tails)
      W.spawn({
        p: p.p,
        v: [p.v[0] * 0.05, p.v[1] * 0.05 - 30, p.v[2] * 0.05],
        g: [0, -80, 0],
        life: p.trail.life,
        size: p.size * p.trail.size,
        c: p.c,
        drag: 2,
        live: p.live,
        mix: p.mix,
      });
    j = W.fx.parts.length;
    for (let i = 0; i < j; i++) {
      const p = W.fx.parts[i];
      const k = p.age / p.life;
      W.fxPos.set(p.p, i * 3);
      W.fxCol.set(p.c, i * 3);
      W.fxSize[i] = p.size * (1.6 - k);
      W.fxAlpha[i] = 1 - k;
      W.fxSeed[i] = p.seed;
      W.fxMix[i] = p.mix;
    }
    W.fxGeo.setDrawRange(0, j);
    W.fxMat.uniforms.time.value = FX.time; // 凍結中も瞬きは続く
    for (const a of ['position', 'pcolor', 'psize', 'palpha', 'pseed', 'pmix']) W.fxGeo.attributes[a].needsUpdate = true;
    W.fx.rings = W.fx.rings.filter(r => {
      r.age += r.live ? dt : wdt;
      const k = r.age / r.life;
      if (k >= 1) {
        W.scene.remove(r.m);
        r.m.material.dispose();
        return false;
      }
      r.m.scale.setScalar(Math.max(0.001, Ease.outCubic(k) * r.size));
      r.m.material.opacity = 1 - k;
      return true;
    });
  };
  // 組み上げた直後の姿を覚えておき、やり直すときに戻す（後の区間が前の区間の物を動かしたり隠したりするため）
  W.snapshot = () => {
    W.snap = [];
    W.scene.traverse(o => {
      const m = o.material && !Array.isArray(o.material) ? o.material : null;
      W.snap.push([
        o,
        o.position.clone(),
        o.quaternion.clone(),
        o.scale.clone(),
        o.visible,
        m && { op: m.opacity, ei: m.emissiveIntensity, c: m.color ? m.color.clone() : null, e: m.emissive ? m.emissive.clone() : null },
      ]);
    });
  };
  W.restore = () => {
    if (!W.snap) return;
    for (const [o, p, q, s, v, m] of W.snap) {
      if (o.matrixAutoUpdate !== false) {
        o.position.copy(p);
        o.quaternion.copy(q);
        o.scale.copy(s);
      }
      o.visible = v;
      if (m) {
        const mm = o.material;
        mm.opacity = m.op;
        if (m.ei != null) mm.emissiveIntensity = m.ei;
        if (m.c) mm.color.copy(m.c);
        if (m.e) mm.emissive.copy(m.e);
      }
    }
  };
  // 全ての材質のシェーダーを起動時に用意（場面が初めて映るときの引っかかりを防ぐ）
  W.precompile = () => {
    try {
      W.renderer.compile(W.scene, W.camera);
    } catch (_) {
      /* 古い環境では省く */
    }
  };
  W.clearFx = () => {
    W.fx.parts.length = 0;
    W.fx.rings.forEach(r => {
      W.scene.remove(r.m);
      r.m.material.dispose();
    });
    W.fx.rings.length = 0;
  };

  // 円柱（高さ1、y 方向）を a から b へ渡す（ゴムなど）
  W.stretch = (mesh, a, b) => {
    const va = new THREE.Vector3(a[0], a[1], a[2]);
    const d = new THREE.Vector3(b[0] - a[0], b[1] - a[1], b[2] - a[2]);
    const L = Math.max(0.01, d.length());
    mesh.position.copy(va).addScaledVector(d, 0.5);
    mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
    mesh.scale.set(1, L, 1);
  };

  // 材質: 自分でも光る標準の材質（区間ごとに粗さ・金属感が少し違う）と、足し合わせて光る材質
  W.mat = (color, e, roughness = 0.55, metalness = 0.1, extra) =>
    new THREE.MeshStandardMaterial(Object.assign({ color, emissive: color, emissiveIntensity: e, roughness, metalness }, extra));
  W.addMat = (color, extra) =>
    new THREE.MeshBasicMaterial(Object.assign({ color, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }, extra));

  // 光のスプライト（加算合成）
  let glowTex = null;
  W.glow = (color, size) => {
    if (!glowTex) {
      glowTex = new THREE.CanvasTexture(
        smoothRadial(256, [
          [0, 255, 255, 255, 255],
          [0.3, 255, 255, 255, 140],
          [1, 255, 255, 255, 0],
        ]),
      ); // ディザのない滑らかな光
    }
    const s = new THREE.Sprite(
      new THREE.SpriteMaterial({ map: glowTex, color, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }),
    );
    s.scale.setScalar(size);
    return s;
  };

  return W;
})();

// ===== 20_input.js =====
// 入力: Pointer Events → 論理座標 → ワールド座標（現在のカメラの逆変換）。
// ジェスチャ判定の部品（速度・角度の累積など）は P2 で追加する。
const Input = {
  pointers: new Map(), // pointerId -> { stale, x, y, time }
  init(canvas) {
    const conv = e => {
      const l = View.toLogical(e.clientX, e.clientY);
      const w = Space.toLocal(e.clientX, e.clientY); // 2D はカメラ、3D はゲート平面で変換
      return { id: e.pointerId, x: w.x, y: w.y, lx: l.x, ly: l.y, time: performance.now() / 1000, kind: e.pointerType };
    };
    canvas.addEventListener('pointerdown', e => {
      e.preventDefault();
      Sound.unlock(); // 音声はユーザー操作の中で開始する必要がある
      try {
        canvas.setPointerCapture(e.pointerId);
      } catch (_) {
        /* 無視 */
      }
      const p = conv(e);
      if (UI.pressCorner(p)) return; // 右上の音のボタン（ゲートには渡さない）
      this.pointers.set(e.pointerId, { stale: false, x: p.x, y: p.y, time: p.time });
      Game.onPointer('down', p);
    });
    canvas.addEventListener('pointermove', e => {
      const rec = this.pointers.get(e.pointerId);
      if (!rec || rec.stale) return;
      const p = conv(e);
      p.prev = { x: rec.x, y: rec.y, time: rec.time };
      rec.x = p.x;
      rec.y = p.y;
      rec.time = p.time;
      Game.onPointer('move', p);
    });
    const end = e => {
      const rec = this.pointers.get(e.pointerId);
      if (!rec) return;
      this.pointers.delete(e.pointerId);
      if (!rec.stale) Game.onPointer('up', conv(e));
    };
    canvas.addEventListener('pointerup', end);
    canvas.addEventListener('pointercancel', end);
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    // 連打やダブルタップ、ピンチでブラウザが画面を拡大しないようにする（とくに iPhone の Safari）。操作は Pointer Events で受けているので影響しない
    const stop = e => {
      if (e.cancelable) e.preventDefault();
    };
    document.addEventListener(
      'touchend',
      e => {
        Sound.unlock();
        stop(e);
      },
      { passive: false },
    ); // ダブルタップの拡大を止める（音の開始もここで確実に）
    document.addEventListener(
      'touchstart',
      e => {
        if (e.touches.length > 1) stop(e);
      },
      { passive: false },
    ); // 2本指の拡大
    document.addEventListener('touchmove', stop, { passive: false });
    for (const ev of ['gesturestart', 'gesturechange', 'gestureend', 'dblclick']) document.addEventListener(ev, stop, { passive: false });
    let vp = document.querySelector('meta[name=viewport]'); // 拡大そのものを禁止する指定も加える
    if (!vp) {
      vp = document.createElement('meta');
      vp.name = 'viewport';
      (document.head || document.documentElement).appendChild(vp);
    }
    vp.content = 'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover';
  },
  // 凍結の開始時に呼ぶ。すでに押されている指は、このゲートでは無視する
  markStale() {
    for (const r of this.pointers.values()) r.stale = true;
  },
};

// ===== 30_fx.js =====
// 画面効果: 粒子・衝撃波・揺れ・ズームの突き・フラッシュ・集中線・凍結の見た目。
// 粒子と衝撃波は2層ある。
//   world: 世界の時間で動く。凍結中とヒットストップ中は空中で止まり、再始動で一気に飛び散る
//   live : 実時間で動く。凍結中の操作への反応（連打の火花など）に使う
const FX = (() => {
  const MAX = 600;
  const F = {
    time: 0,
    parts: [],
    cursor: 0,
    rings: [],
    trauma: 0,
    flashA: 0,
    flashTimes: [],
    freezeK: 0,
    punch: 0,
    punchV: 0,
    lines: null,
    shutter: 0,
    sprites: {},
  };
  const calm = () => (Debug.reducedMotion ? 0.3 : 1);
  const in3D = () => !!(Game.stage.three && World3D.ok && World3D.plane); // 今の区間を3Dで描いている（粒と衝撃波はゲート平面から3Dへ）

  F.reset = () => {
    F.parts.length = 0;
    F.cursor = 0;
    F.rings.length = 0;
    F.trauma = 0;
    F.flashA = 0;
    F.freezeK = 0;
    F.punch = 0;
    F.punchV = 0;
    F.lines = null;
    F.shutter = 0;
    if (World3D.ok) World3D.clearFx();
  };

  // 光の粒のスプライト（shadowBlur を使わず、事前に描いた放射グラデーションを重ねる）
  function sprite(color) {
    if (F.sprites[color]) return F.sprites[color];
    // ディザのない滑らかな光（拡大しても粒々にならない）
    const hx = /^#[0-9a-f]{6}/i.test(color) ? color.slice(1, 7) : 'ffffff';
    const k = parseInt(hx, 16);
    const r = (k >> 16) & 255;
    const gg = (k >> 8) & 255;
    const b = k & 255;
    const c = smoothRadial(96, [
      [0, 255, 255, 255, 255],
      [0.25, r, gg, b, 230],
      [0.6, r, gg, b, 64],
      [1, r, gg, b, 0],
    ]);
    return (F.sprites[color] = c);
  }

  // ---- 生成 ----
  F.spawn = p => {
    const q = Object.assign(
      { vx: 0, vy: 0, life: 0.6, age: 0, size: 10, color: '#ffffff', kind: 'dot', rot: 0, vr: 0, drag: 3, grav: 0, live: false },
      p,
    );
    if ((!q.live || Game.phase !== 'GATE') && in3D()) {
      // 3D の区間: ゲート平面の座標から3Dのきらめく粒へ（凍結中の操作の反応だけ2D）
      World3D.spawn({
        p: World3D.planePoint(q.x, q.y),
        v: World3D.planeVec(q.vx, q.vy),
        g: World3D.planeVec(0, q.grav),
        life: q.life,
        size: q.size * 2.4,
        color: q.color,
        drag: q.drag,
        live: q.live,
      });
      return;
    }
    const o = Game.stage.origin; // ステージの座標 → 世界座標（区間をまたいでも位置がずれない）
    q.x += o[0];
    q.y += o[1];
    if (F.parts.length < MAX) F.parts.push(q);
    else {
      F.parts[F.cursor] = q;
      F.cursor = (F.cursor + 1) % MAX;
    }
  };
  // o: { n, speed:[最小,最大], dir（省略で全方向）, spread, colors, kinds, life:[..], size:[..], drag, grav, live, jitter }
  F.burst = (x, y, o = {}) => {
    const R = Math.random;
    const n = Math.round((o.n || 30) * (Debug.reducedMotion ? 0.5 : 1));
    const cols = o.colors || ['#ffffff'];
    const kinds = o.kinds || ['dot'];
    const [s0, s1] = o.speed || [200, 700];
    const [l0, l1] = o.life || [0.35, 0.8];
    const [z0, z1] = o.size || [6, 16];
    const j = o.jitter || 0;
    for (let i = 0; i < n; i++) {
      const a = o.dir == null ? R() * TAU : o.dir + (R() - 0.5) * (o.spread || 0.6);
      const s = lerp(s0, s1, R());
      F.spawn({
        x: x + (R() - 0.5) * j,
        y: y + (R() - 0.5) * j,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s,
        life: lerp(l0, l1, R()),
        size: lerp(z0, z1, R()),
        color: cols[i % cols.length],
        kind: kinds[i % kinds.length],
        rot: R() * TAU,
        vr: (R() - 0.5) * 20,
        drag: o.drag == null ? 3 : o.drag,
        grav: o.grav || 0,
        live: !!o.live,
      });
    }
  };
  // 吸い込み: (x, y) のまわりの輪から粒が中心へ吸い込まれる。o: { r:[内,外], life:[..], size:[..], colors }
  F.absorbed = 0;
  F.absorbPulse = 0;
  F.absorb = (x, y, n, o = {}) => {
    const R = Math.random;
    const [r0, r1] = o.r || [300, 520];
    const [l0, l1] = o.life || [0.4, 0.7];
    const [z0, z1] = o.size || [8, 16];
    const cols = o.colors || ['#ffffff'];
    const org = Game.stage.origin;
    for (let i = 0; i < n; i++) {
      const a = R() * TAU;
      const r = lerp(r0, r1, R());
      const sx = x + Math.cos(a) * r + org[0];
      const sy = y + Math.sin(a) * r + org[1];
      const q = {
        x: sx,
        y: sy,
        sx,
        sy,
        to: [x + org[0], y + org[1]],
        swirl: (R() < 0.5 ? -1 : 1) * (0.8 + R() * 1.4),
        vx: 0,
        vy: 0,
        life: lerp(l0, l1, R()),
        age: 0,
        size: lerp(z0, z1, R()),
        color: cols[i % cols.length],
        kind: 'dot',
        rot: 0,
        vr: 0,
        drag: 0,
        grav: 0,
        live: true,
      };
      if (F.parts.length < MAX) F.parts.push(q);
      else {
        F.parts[F.cursor] = q;
        F.cursor = (F.cursor + 1) % MAX;
      }
    }
  };
  F.shock = (x, y, color = '#ffffff', size = 600, life = 0.35, o = {}) => {
    if (!o.live && in3D()) {
      World3D.ring(World3D.planePoint(x, y), World3D.planeNormal(), color, size, life);
      return;
    }
    const g = Game.stage.origin;
    F.rings.push({ x: x + g[0], y: y + g[1], color, size, life, age: 0, width: o.width || 26, live: !!o.live });
  };
  F.flash = (a = 0.5) => {
    F.flashTimes = F.flashTimes.filter(t => F.time - t < 1);
    if (F.flashTimes.length >= 2) a *= 0.25; // 強い全画面フラッシュを1秒に3回以上出さない
    F.flashTimes.push(F.time);
    F.flashA = Math.max(F.flashA, a * (Debug.reducedMotion ? 0.4 : 1));
  };
  F.addTrauma = v => {
    F.trauma = Math.min(1, F.trauma + v);
  };
  // ズームの突き（バネで戻る）
  F.kick = v => {
    F.punch += v * calm();
  };
  F.hitSpark = (x, y, color, n = 8) =>
    F.burst(x, y, {
      n,
      colors: [color, '#ffffff'],
      kinds: ['streak', 'dot'],
      speed: [250, 750],
      life: [0.15, 0.35],
      size: [4, 10],
      live: true,
    });

  // ---- 凍結と成功の演出 ----
  F.onFreeze = () => {
    F.shutter = 1;
    F.kick(0.03);
  };
  F.fxPoint = g => {
    const k = GateKinds[g.kindName];
    return k && k.fxPoint ? k.fxPoint(g) : { x: g.x, y: g.y };
  };
  F.onGateSuccess = g => {
    const s = g.cfg.scored ? 0.5 + Game.idx * 0.1 : 0.45; // 後半のゲートほど強く
    const { x, y } = F.fxPoint(g);
    const c = g.color || CONFIG.colors.spark;
    const base = { colors: [c, '#ffffff', CONFIG.colors.spark], kinds: ['dot', 'streak', 'dot'] };
    F.shock(x, y, '#ffffff', 300 + 300 * s, 0.28, { width: 14, live: true }); // すぐ広がる白い輪
    F.shock(x, y, c, 560 + 460 * s, 0.5, { width: 40 }); // 時間が動き出してから広がる色の輪
    switch (g.kindName) {
      case 'pull':
        F.burst(x, y, { ...base, n: 60, dir: g.release == null ? -0.4 : g.release, spread: 0.7, speed: [700, 1800], life: [0.3, 0.7] });
        F.burst(x, y, { ...base, n: 20, speed: [200, 600] });
        break;
      case 'slide':
        F.burst(x, y, { ...base, n: 50, speed: [300, 1200] });
        F.burst(x, y, { n: 14, colors: [GREY], kinds: ['shard'], speed: [300, 900], grav: 900, size: [8, 14], life: [0.5, 0.9] });
        break;
      case 'swipe': {
        const na = (g.angle == null ? -0.5 : g.angle) + Math.PI / 2;
        for (const d of [na, na + Math.PI])
          F.burst(x, y, { ...base, n: 30, dir: d, spread: 0.5, speed: [600, 1600], kinds: ['streak', 'dot'] });
        F.burst(x, y, { n: 20, colors: [c], kinds: ['shard'], speed: [200, 700], grav: 700, size: [4, 9], life: [0.5, 1.0] });
        break;
      }
      case 'rotate': {
        const R = g.r || 190;
        for (let i = 0; i < 28; i++) {
          const a = (i / 28) * TAU;
          F.spawn({
            x: x + Math.cos(a) * R,
            y: y + Math.sin(a) * R,
            vx: -Math.sin(a) * 1000 + Math.cos(a) * 250,
            vy: Math.cos(a) * 1000 + Math.sin(a) * 250,
            life: 0.5,
            size: 12,
            color: i % 2 ? c : '#ffffff',
            kind: 'streak',
            drag: 2.5,
          });
        }
        F.burst(x, y, { ...base, n: 30, speed: [200, 700] });
        break;
      }
      case 'mash':
        F.burst(x, y, { ...base, n: 120, speed: [400, 1700], life: [0.4, 1.0], size: [8, 22] });
        F.burst(x, y, { n: 40, colors: [GREY, c], kinds: ['shard'], speed: [400, 1400], grav: 800, size: [10, 20], life: [0.6, 1.2] });
        break;
      default:
        F.burst(x, y, { ...base, n: 50, speed: [300, 1100] });
    }
    F.flash(0.2 + 0.3 * s);
    F.addTrauma(0.25 + 0.55 * s);
    F.kick(0.04 + 0.08 * s);
    F.lines = { age: 0, life: 0.45, strength: 0.5 + 0.5 * s, seed: (Math.random() * 1e9) | 0 };
  };

  // ---- 更新 ----
  F.update = dt => {
    F.time += dt;
    const wdt = Game.phase === 'PLAY' && !Game.hold ? dt * Game.timeScale : 0;
    let j = 0;
    for (let i = 0; i < F.parts.length; i++) {
      const p = F.parts[i];
      const d = p.live ? dt : wdt;
      if (d > 0) {
        p.age += d;
        if (p.to) {
          // 吸い込まれる粒: 近づくほど速く、渦を巻いて中心へ
          const k = Math.min(1, p.age / p.life);
          const e = Math.pow(k, 2.2);
          const a = p.swirl * k;
          const dx = p.sx - p.to[0];
          const dy = p.sy - p.to[1];
          p.x = p.to[0] + (dx * Math.cos(a) - dy * Math.sin(a)) * (1 - e);
          p.y = p.to[1] + (dx * Math.sin(a) + dy * Math.cos(a)) * (1 - e);
          if (p.age >= p.life) {
            F.absorbed++;
            F.absorbPulse = 1;
          }
        } else {
          const k = Math.exp(-p.drag * d);
          p.vx *= k;
          p.vy = p.vy * k + p.grav * d;
          p.x += p.vx * d;
          p.y += p.vy * d;
          p.rot += p.vr * d;
        }
      }
      if (p.age < p.life) F.parts[j++] = p;
    }
    F.parts.length = j;
    World3D.updateFx(dt, wdt);
    for (const r of F.rings) r.age += r.live ? dt : wdt;
    F.rings = F.rings.filter(r => r.age < r.life);
    F.absorbPulse = Math.max(0, (F.absorbPulse || 0) - dt * 8);
    F.trauma = Math.max(0, F.trauma - 1.5 * dt);
    F.flashA = Math.max(0, F.flashA - dt / 0.12);
    F.punchV += (-260 * F.punch - 14 * F.punchV) * dt;
    F.punch += F.punchV * dt;
    if (F.lines && (F.lines.age += dt) >= F.lines.life) F.lines = null;
    F.shutter = Math.max(0, F.shutter - dt / 0.3);
    if (Game.phase === 'GATE' || (Game.phase === 'BURST' && Game.chargeLeft > 0))
      F.freezeK = Math.min(1, F.freezeK + dt / CONFIG.freezeFade); // 溜めている間も世界は止まったまま
    else F.freezeK = Math.max(0, F.freezeK - dt / CONFIG.unfreezeFade);
  };

  F.shakeOffset = () => {
    const s = F.trauma * F.trauma * calm();
    const t = F.time * 60;
    const zoom = 1 + F.punch;
    if (s <= 0) return { x: 0, y: 0, rot: 0, zoom };
    return {
      x: 22 * s * (Math.sin(t * 1.3) + 0.5 * Math.sin(t * 2.7)),
      y: 22 * s * (Math.cos(t * 1.7) + 0.5 * Math.sin(t * 3.1)),
      rot: 0.03 * s * Math.sin(t * 2.1),
      zoom,
    };
  };

  // ---- 描画 ----
  function drawRings(ctx, live) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const r of F.rings) {
      if (r.live !== live) continue;
      const k = r.age / r.life;
      ctx.globalAlpha = 1 - k;
      ctx.strokeStyle = r.color;
      ctx.lineWidth = r.width * (1 - k) + 2;
      ctx.beginPath();
      ctx.arc(r.x, r.y, Ease.outCubic(k) * r.size, 0, TAU);
      ctx.stroke();
    }
    ctx.restore();
  }
  function drawParts(ctx, live) {
    ctx.save();
    for (const p of F.parts) {
      if (p.live !== live) continue;
      const k = p.age / p.life;
      if (p.kind === 'shard') {
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = 1 - k * k;
        ctx.fillStyle = p.color;
        const s = p.size * 1.4;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.beginPath();
        ctx.moveTo(-s, -s * 0.6);
        ctx.lineTo(s, -s * 0.2);
        ctx.lineTo(-s * 0.3, s * 0.8);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      } else if (p.kind === 'streak' && !Game.stage.three) {
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = 1 - k;
        const sp = Math.hypot(p.vx, p.vy);
        const len = Math.min(140, 20 + sp * 0.05);
        const ux = sp ? p.vx / sp : 0;
        const uy = sp ? p.vy / sp : 0;
        ctx.strokeStyle = p.color;
        ctx.lineWidth = p.size * 0.5 * (1 - k * 0.5);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - ux * len, p.y - uy * len);
        ctx.stroke();
      } else {
        // 虹色に移ろい瞬く十字の粒（3Dの粒と同じ見た目）
        ctx.globalCompositeOperation = 'lighter';
        const seed = p.seed || (p.seed = Math.random());
        const tw = 0.5 + 0.5 * Math.sin(F.time * 17 + seed * 50);
        const col = `hsl(${Math.round(((seed + F.time * 0.4) % 1) * 360)}, 100%, 70%)`;
        const s = p.size * (p.to ? 1.4 - 0.9 * k : 1.6 - k) * (1 + 0.35 * Math.sin(F.time * 11 + seed * 60));
        ctx.globalAlpha = (p.to ? 0.35 + 0.65 * k : 1 - k) * (0.6 + 0.4 * tw);
        ctx.drawImage(sprite(p.color), p.x - s * 0.7, p.y - s * 0.7, s * 1.4, s * 1.4);
        ctx.strokeStyle = col;
        ctx.lineWidth = Math.max(1, s * 0.12);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(p.x - s * 1.6, p.y);
        ctx.lineTo(p.x + s * 1.6, p.y);
        ctx.moveTo(p.x, p.y - s * 1.6);
        ctx.lineTo(p.x, p.y + s * 1.6);
        ctx.stroke();
      }
    }
    ctx.restore();
  }
  F.handOff = () => {
    // 区間が変わる前に、2Dに残った粒を3Dのきらめく粒へ移す（平面が変わってずれないように）
    if (!in3D()) return;
    const o = Game.stage.origin;
    F.parts = F.parts.filter(p => {
      if (p.kind === 'shard' || p.age >= p.life) return p.kind === 'shard';
      World3D.spawn({
        p: World3D.planePoint(p.x - o[0], p.y - o[1]),
        v: World3D.planeVec(p.vx, p.vy),
        g: World3D.planeVec(0, p.grav),
        life: Math.max(0.05, p.life - p.age),
        size: p.size * 2.4,
        color: p.color,
        drag: p.drag,
      });
      return false;
    });
    F.cursor = 0;
  };
  const inWorld = (ctx, fn) => {
    const o = Game.stage.origin;
    ctx.save();
    ctx.translate(-o[0], -o[1]);
    fn();
    ctx.restore();
  };
  F.drawWorld = ctx =>
    inWorld(ctx, () => {
      drawRings(ctx, false);
      drawParts(ctx, false);
    });
  // 操作への反応と、成功した瞬間の物体の閃光（ゲート物体より上に描く）
  F.drawLive = (ctx, g) => {
    inWorld(ctx, () => {
      drawRings(ctx, true);
      drawParts(ctx, true);
    });
    if (g && g.done && g.doneAge < 0.15) {
      const { x, y } = F.fxPoint(g);
      const s = 240 * (1 - g.doneAge / 0.15) + 60;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.9;
      ctx.drawImage(sprite('#ffffff'), x - s, y - s, s * 2, s * 2);
      ctx.restore();
    }
  };

  // 凍結の見た目: 彩度を抜いて暗くし、操作対象（focus: 論理座標）の周りだけ明るく残す
  F.drawFreeze = (ctx, focus) => {
    const k = F.freezeK;
    if (k <= 0) return;
    const W = View.canvas.width;
    const H = View.canvas.height;
    const d = View.dpr;
    const fx = focus ? (focus.x * View.scale + View.w / 2) * d : W / 2;
    const fy = focus ? (focus.y * View.scale + View.h / 2) * d : H / 2;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'saturation';
    ctx.globalAlpha = 0.85 * k;
    ctx.fillStyle = '#808080';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 0.35 * k;
    ctx.fillStyle = '#05050a';
    ctx.fillRect(0, 0, W, H);
    const g = ctx.createRadialGradient(fx, fy, Math.min(W, H) * (0.2 + 0.04 * Beat.heart), fx, fy, Math.hypot(W, H) * 0.65); // 心拍で周辺が脈打つ
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, `rgba(0,0,0,${0.6 * k * (1 + 0.2 * Beat.heart)})`);
    ctx.globalAlpha = 1;
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  };

  // 画面効果（論理座標の画面変換で呼ぶ）: 集中線、凍結のシャッター、フラッシュ
  F.drawScreen = ctx => {
    const hw = View.halfW;
    const hh = View.halfH;
    if (F.lines) {
      const L = F.lines;
      const k = L.age / L.life;
      const R = Math.hypot(hw, hh);
      const rnd = rng(L.seed);
      ctx.save();
      ctx.fillStyle = '#ffffff';
      ctx.globalAlpha = (1 - k) * 0.5 * L.strength * (Debug.reducedMotion ? 0.4 : 1);
      ctx.beginPath();
      for (let i = 0; i < 44; i++) {
        const a = rnd() * TAU;
        const w = (4 + rnd() * 10) * L.strength;
        const r0 = R * (0.42 + rnd() * 0.3) + k * R * 0.25;
        const ca = Math.cos(a);
        const sa = Math.sin(a);
        ctx.moveTo(ca * r0, sa * r0);
        ctx.lineTo(ca * R * 1.3 - sa * w, sa * R * 1.3 + ca * w);
        ctx.lineTo(ca * R * 1.3 + sa * w, sa * R * 1.3 - ca * w);
        ctx.closePath();
      }
      ctx.fill();
      ctx.restore();
    }
    if (F.shutter > 0) {
      // 時間が止まった瞬間に、画面の縁に白い枠が走る
      const d = 18 + 40 * Ease.outCubic(1 - F.shutter);
      ctx.save();
      ctx.globalAlpha = F.shutter * 0.9;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 14 * F.shutter + 2;
      ctx.strokeRect(-hw + d, -hh + d, (hw - d) * 2, (hh - d) * 2);
      ctx.restore();
    }
    if (F.flashA > 0) {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalAlpha = F.flashA;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, View.canvas.width, View.canvas.height);
      ctx.globalAlpha = 1;
      View.screenTransform(ctx);
    }
  };

  return F;
})();

// ===== 40_audio.js =====
// 効果音（WebAudio でその場合成）と、区間ごとの効果音のキューシート。
// 音の経路: 効果音バス ─┐
//          BGM → ローパス → ダッキング ─┴→ コンプレッサー → マスター（音量・消音）
const Sound = {
  ctx: null,
  master: null,
  sfxBus: null,
  musicIn: null,
  musicFilter: null,
  duckGain: null,
  noiseBuf: null,
  muted: false,
  volume: 0.8,

  unlock() {
    try {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        const c = (this.ctx = new AC());
        this.master = c.createGain();
        this.master.gain.value = this.muted ? 0 : this.volume;
        this.master.connect(c.destination);
        const comp = c.createDynamicsCompressor();
        comp.threshold.value = -14;
        comp.ratio.value = 4;
        this.analyser = c.createAnalyser();
        this.analyser.fftSize = 512;
        this.analyser.smoothingTimeConstant = 0.5; // 背景のスペクトログラム用（消音より手前で取るので、消音中も動く）
        comp.connect(this.analyser);
        this.analyser.connect(this.master);
        this.sfxBus = c.createGain();
        this.sfxBus.gain.value = 0.9;
        this.sfxBus.connect(comp);
        this.duckGain = c.createGain();
        this.duckGain.connect(comp);
        this.musicFilter = c.createBiquadFilter();
        this.musicFilter.type = 'lowpass';
        this.musicFilter.frequency.value = 18000;
        this.musicFilter.connect(this.duckGain);
        this.musicIn = c.createGain();
        this.musicIn.gain.value = 0.5;
        this.musicIn.connect(this.musicFilter);
        const n = c.sampleRate;
        const b = c.createBuffer(1, n, n);
        const d = b.getChannelData(0);
        for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
        this.noiseBuf = b;
        Music.init();
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch (_) {
      this.ctx = null;
    }
  },

  loadMuted() {
    try {
      this.muted = localStorage.getItem('freeze-break.muted') === '1';
    } catch (_) {
      /* 使えない環境 */
    }
  },
  setMuted(m) {
    this.muted = m;
    if (this.master) this.master.gain.setTargetAtTime(m ? 0 : this.volume, this.ctx.currentTime, 0.02);
    try {
      localStorage.setItem('freeze-break.muted', m ? '1' : '0');
    } catch (_) {
      /* 使えない環境 */
    }
  },
  // 大きな効果音の瞬間に BGM を一瞬下げる
  duck(amount = 0.35, rel = 0.25) {
    const c = this.ctx;
    if (!c) return;
    const g = this.duckGain.gain;
    const t = c.currentTime;
    g.cancelScheduledValues(t);
    g.setValueAtTime(g.value, t);
    g.linearRampToValueAtTime(amount, t + 0.01);
    g.setTargetAtTime(1, t + 0.05, rel);
  },

  // ---- 音源の部品（o.at で絶対時刻、o.delay で今からの遅れ、o.out で接続先） ----
  tone(freq, dur, o = {}) {
    const c = this.ctx;
    if (!c) return;
    const t = o.at != null ? o.at : c.currentTime + (o.delay || 0);
    const osc = c.createOscillator();
    const g = c.createGain();
    const v = o.vol == null ? 0.3 : o.vol;
    const a = o.attack || 0.004;
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(freq, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + (o.glide || dur));
    if (o.detune) osc.detune.value = o.detune;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let node = osc;
    if (o.lp) {
      const f = c.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.value = o.lp;
      f.Q.value = o.q || 0.7;
      osc.connect(f);
      node = f;
    }
    node.connect(g);
    g.connect(o.out || this.sfxBus);
    osc.start(t);
    osc.stop(t + dur + 0.05);
    if (o.onNode) o.onNode(osc, t + dur + 0.05); // BGM が鳴っている音を覚えておく（減速で音程を下げるため）
  },
  noise(dur, o = {}) {
    const c = this.ctx;
    if (!c) return;
    const t = o.at != null ? o.at : c.currentTime + (o.delay || 0);
    const src = c.createBufferSource();
    const f = c.createBiquadFilter();
    const g = c.createGain();
    const v = o.vol == null ? 0.3 : o.vol;
    src.buffer = this.noiseBuf;
    src.loop = true;
    f.type = o.filter || 'bandpass';
    f.frequency.setValueAtTime(o.freq || 1000, t);
    if (o.to) f.frequency.exponentialRampToValueAtTime(o.to, t + dur);
    f.Q.value = o.q || 0.8;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + (o.attack || 0.003));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f);
    f.connect(g);
    g.connect(o.out || this.sfxBus);
    src.start(t, Math.random() * 0.5);
    src.stop(t + dur + 0.05);
    if (o.onNode) o.onNode(src, t + dur + 0.05);
  },

  // 鳴らし続けて、途中で高さと大きさを変えられる音（パチンコのゴムの張り）
  hold() {
    const c = this.ctx;
    if (!c || this.muted) return null;
    const o = c.createOscillator();
    const f = c.createBiquadFilter();
    const g = c.createGain();
    o.type = 'sawtooth';
    o.frequency.value = 80;
    f.type = 'lowpass';
    f.frequency.value = 700;
    f.Q.value = 4;
    g.gain.value = 0;
    o.connect(f);
    f.connect(g);
    g.connect(this.sfxBus);
    o.start();
    return {
      set: (fr, v) => {
        const t = c.currentTime;
        o.frequency.setTargetAtTime(fr, t, 0.03);
        f.frequency.setTargetAtTime(500 + fr * 3, t, 0.03);
        g.gain.setTargetAtTime(v, t, 0.03);
      },
      stop: () => {
        const t = c.currentTime;
        g.gain.cancelScheduledValues(t);
        g.gain.setTargetAtTime(0, t, 0.025);
        o.stop(t + 0.2);
      },
    };
  },
  // ---- 効果音 ----
  sfx(name, o = {}) {
    if (name === 'stamp') Music.finale();
    if (!this.ctx || this.muted) return;
    switch (name) {
      case 'success': {
        // ゲートごとに全音ずつ上がる和音＋種類ごとの音
        const base = 392 * Math.pow(2, ((o.step || 0) * 2) / 12);
        [1, 1.26, 1.5, 2].forEach((m, i) => this.tone(base * m, 0.35, { type: i % 2 ? 'sine' : 'triangle', vol: 0.15, delay: i * 0.012 }));
        this.noise(0.3, { filter: 'highpass', freq: 2000, to: 8000, vol: 0.1 });
        const extra = { pull: 'whoosh', slide: 'clank', swipe: 'slash', rotate: 'whirr', mash: 'explode' }[o.kind];
        if (extra) this.sfx(extra);
        this.duck(0.3, 0.3);
        break;
      }
      case 'miss':
        this.tone(140, 0.14, { type: 'square', vol: 0.07, lp: 600 });
        break;
      case 'tick':
        this.tone(1100 + (o.k || 0) * 900, 0.03, { type: 'square', vol: 0.04 });
        break;
      case 'hit':
        this.tone(320 + (o.k || 0) * 700, 0.12, { type: 'triangle', vol: 0.25, to: 160 + (o.k || 0) * 350 });
        this.noise(0.05, { freq: 3000, vol: 0.1 });
        break;
      case 'snap':
        this.tone(700, 0.06, { type: 'triangle', vol: 0.2, to: 320 });
        this.noise(0.03, { freq: 4000, vol: 0.12 });
        break;
      case 'lock': {
        // 鍵が掛かる「カ・チッ」: 軽い一音目と、少し遅れて鋭い二音目
        const t = this.ctx.currentTime;
        this.tone(1400, 0.035, { at: t, type: 'triangle', vol: 0.2, to: 850 });
        this.noise(0.022, { at: t, freq: 2600, vol: 0.12 });
        this.tone(2700, 0.05, { at: t + 0.1, type: 'square', vol: 0.12, to: 1700, lp: 6500 });
        this.noise(0.035, { at: t + 0.1, filter: 'highpass', freq: 5200, vol: 0.2 });
        break;
      }
      case 'bounce': {
        const f = o.f || 520;
        this.tone(f, 0.14, { vol: 0.2, to: f * 1.5, glide: 0.06 });
        break;
      }
      case 'whoosh':
        this.noise(0.35, { freq: 400, to: 2400, q: 1.2, vol: 0.2 });
        break;
      // 扉のセンサーが玉を検知した「ピピッ」
      case 'detect': {
        const t = this.ctx.currentTime;
        [0, 0.09].forEach(d => this.tone(2093, 0.05, { at: t + d, type: 'square', vol: 0.05, lp: 5200 }));
        break;
      }
      case 'airpass':
        this.noise(0.62, { freq: 280, to: 1500, q: 0.9, vol: 0.13, attack: 0.28 });
        break; // 輪をくぐる風切り（立ち上がりがゆるやか）
      case 'slash':
        this.noise(0.18, { filter: 'highpass', freq: 3000, to: 9000, vol: 0.25 });
        this.tone(2400, 0.12, { vol: 0.06, to: 1200 });
        break;
      case 'clank':
        this.tone(180, 0.25, { type: 'square', vol: 0.12, lp: 900 });
        this.tone(1250, 0.4, { vol: 0.06 });
        this.noise(0.08, { freq: 2500, vol: 0.2 });
        break;
      case 'whirr':
        this.tone(160, 0.8, { type: 'sawtooth', vol: 0.08, to: 900, lp: 1800 });
        break;
      case 'impact':
        this.tone(90, 0.5, { vol: 0.6, to: 32 });
        this.noise(0.45, { filter: 'lowpass', freq: 1400, to: 150, vol: 0.4 });
        this.duck(0.25, 0.35);
        break;
      case 'shatter':
        for (let i = 0; i < 5; i++)
          this.noise(0.12 + Math.random() * 0.1, { filter: 'highpass', freq: 2500 + Math.random() * 3000, vol: 0.12, delay: i * 0.03 });
        break;
      case 'charge':
        this.tone(110, 2.2, { type: 'sawtooth', vol: 0.08, to: 880, glide: 2.2, lp: 2400, attack: 2.0 });
        break;
      case 'explode':
        this.tone(70, 1.0, { vol: 0.7, to: 25 });
        this.noise(1.2, { filter: 'lowpass', freq: 3000, to: 100, vol: 0.5 });
        this.duck(0.2, 0.5);
        break;
      case 'stamp':
        this.tone(110, 0.3, { vol: 0.5, to: 50 });
        this.noise(0.12, { freq: 1200, vol: 0.3 });
        break;
      default:
        break;
    }
  },
};

// 区間ごとの効果音: [区間内の時刻 u, 名前, オプション]
const SoundCues = {
  A: [
    [0.01, 'charge'],
    [0.75 / 3, 'whoosh'],
    [1.0 / 3, 'snap'],
    [1.25 / 3, 'snap'],
    [1.75 / 3, 'snap'],
    [1.5 / 3, 'bounce', { f: 520 }],
    [2.0 / 3, 'bounce', { f: 660 }],
  ], // 溜め → 発射、8分の格子（区間Aの U_* と同じ）
  B: [], // 発射と扉の音は区間Bのイベント（2D/3Dで間合いが違う）
  C: [[0.01, 'whoosh']], // 着地の音は区間Cのイベント
  D: [
    [1 / 14, 'impact'],
    [1 / 14, 'shatter'],
    [6 / 7, 'snap'],
  ],
  E: [
    [1 / 14, 'charge'],
    [5 / 7, 'snap'],
    [6 / 7, 'shatter'],
  ],
  F: [
    [0.001, 'explode'],
    [6 / 7, 'stamp'],
  ],
};

// ===== 41_music.js =====
// BGM（WebAudio でその場合成・120BPM）。ゲートを越えるたびに楽器が1つずつ増える。
// 凍結の手前ではテープが止まるように音程とテンポが落ち、凍結中は心拍だけになる。
// 時間が動き出す瞬間（ヒットストップ明け）をその小節の頭として全開で再開する。
const Music = (() => {
  const STEP = CONFIG.beat / 4; // 16分音符 = 0.125 秒
  const CHORDS = [
    // 4小節の進行 Am – F – C – G
    { bass: 55.0, notes: [220.0, 261.63, 329.63] },
    { bass: 43.65, notes: [174.61, 220.0, 261.63] },
    { bass: 65.41, notes: [261.63, 329.63, 392.0] },
    { bass: 49.0, notes: [196.0, 246.94, 293.66] },
  ];
  const LEAD = { 0: 659.25, 3: 587.33, 6: 523.25, 8: 440.0, 10: 523.25, 12: 587.33, 14: 659.25 };
  const M = {
    mode: 'off',
    level: 0,
    step: 0,
    bar: 0,
    next: 0,
    timer: null,
    voices: [],
    windT0: 0,
    windEnd: 0,
    stretch: 1,
    g0: 0,
    k: 0,
    spinT0: 0,
    spinEnd: 0,
  };
  const track = (node, end) => M.voices.push({ node, end });
  // 減速で下がる音程・凍結明けに駆け上がる音程（オクターブ）
  const OCT = 2;
  const SPIN_OCT = 3;
  const pitch = t =>
    M.mode === 'wind'
      ? Math.pow(2, -OCT * clamp((t - M.windT0) / Math.max(0.01, M.windEnd - M.windT0)))
      : t < M.spinEnd
        ? Math.pow(2, -SPIN_OCT * (1 - Ease.inQuad(clamp((t - M.spinT0) / Math.max(0.01, M.spinEnd - M.spinT0)))))
        : 1; // 減速中は下がり、凍結明けは下から上がる
  const tone = (f, d, o) => {
    const p = pitch(o.at);
    if (M.mode === 'play' && o.at < M.spinEnd && !o.to)
      return Sound.tone(
        f * p,
        d,
        Object.assign({ out: Sound.musicIn, onNode: track }, o, { to: f, glide: Math.max(0.02, M.spinEnd - o.at) }),
      ); // 回り出しの間は元の音程へ滑り上がる
    return Sound.tone(f * p, d, Object.assign({ out: Sound.musicIn, onNode: track }, o, o.to ? { to: o.to * p } : {}));
  };
  const noise = (d, o) => Sound.noise(d, Object.assign({ out: Sound.musicIn, onNode: track }, o));

  const kick = t => tone(150, 0.35, { at: t, vol: 0.8, to: 42, glide: 0.12 });
  const hat = (t, v) => noise(0.05, { at: t, filter: 'highpass', freq: 7500, vol: v });
  const clap = t => {
    noise(0.16, { at: t, freq: 1800, q: 1.2, vol: 0.28 });
    tone(190, 0.08, { at: t, type: 'triangle', vol: 0.12 });
  };
  const crash = t => noise(1.4, { at: t, filter: 'highpass', freq: 4000, vol: 0.22 });
  const tapeStop = (t, end) =>
    // 止まっていくうなり
    Sound.tone(220, end - t + 0.1, {
      at: t,
      type: 'sawtooth',
      vol: 0.05,
      to: 40,
      glide: end - t,
      lp: 900,
      out: Sound.musicIn,
      onNode: track,
    });
  const tapeStart = (t, end) => {
    // 回り出すうなり（大げさに: 2つの唸り＋駆け上がるノイズ）
    const d = end - t;
    Sound.tone(30, d + 0.05, { at: t, type: 'sawtooth', vol: 0.12, to: 440, glide: d, lp: 2400, out: Sound.musicIn, onNode: track });
    Sound.tone(60, d + 0.05, { at: t, type: 'square', vol: 0.05, to: 880, glide: d, lp: 3000, out: Sound.musicIn, onNode: track });
    Sound.noise(d + 0.05, { at: t, freq: 250, to: 7000, q: 2, vol: 0.18, out: Sound.musicIn, onNode: track });
  };
  const heart = t => {
    tone(62, 0.16, { at: t, vol: 0.6 });
    tone(58, 0.14, { at: t + 0.2, vol: 0.4 });
  };

  M.init = () => {
    if (M.timer) return;
    M.timer = setInterval(() => {
      try {
        M.tick();
      } catch (e) {
        Debug.reportError(e);
      }
    }, 25);
  };
  M.tick = () => {
    const c = Sound.ctx;
    if (!c || M.mode === 'off') return;
    const now = c.currentTime;
    if (M.voices.length > 64) M.voices = M.voices.filter(v => v.end > now);
    if (M.mode === 'play') {
      // 演奏中は刻みをゲームの時計に合わせる（再開の加速も含めて映像と同じ拍）
      const ts = Math.max(0.2, Game.timeScale || 1);
      const lat = c.outputLatency || c.baseLatency || 0;
      const live = Game.phase === 'PLAY' && !Game.hold;
      const gNow = Game.t + (live ? clamp(now - (Game.audioAt || now), 0, 0.1) * ts : 0); // 前のコマからの経過ぶん進めた今のゲーム時刻（止まったコマの先読みは 0.1秒まで）
      for (let guard = 0; guard < 32; guard++) {
        const at = now + (M.g0 + M.k * STEP - gNow) / ts - lat; // この刻みが聞こえるべき時刻（出力の遅れぶん早く鳴らす）
        if (at > now + 0.12) break;
        if (at > now - 0.06) M.play(M.step, Math.max(now, at)); // 大きく遅れた刻みは飛ばす
        M.k++;
        M.step = (M.step + 1) % 16;
        if (M.step === 0) M.bar++;
      }
      return;
    }
    if (M.next < now - 0.2) M.next = now + 0.02; // 裏に回って遅れたら詰め直す
    while (M.next < now + 0.12) {
      if (M.mode === 'wind' && M.next > M.windEnd) break; // 止まりきったら次を刻まない
      M.play(M.step, M.next);
      M.next += M.mode === 'wind' ? STEP * (M.stretch *= 1.35) : STEP; // 減速中は1歩ごとに間が伸びる
      M.step = (M.step + 1) % 16;
      if (M.step === 0) M.bar++;
    }
  };

  M.play = (s, t) => {
    const ch = CHORDS[M.bar % 4];
    if (M.mode === 'heart') {
      if (s === 0 || s === 8) heart(t);
      return;
    }
    if (M.mode === 'calm') {
      if (s === 0)
        ch.notes.forEach((f, i) => tone(f, 1.9, { at: t, type: 'triangle', vol: 0.05, attack: 0.3, lp: 1400, detune: (i - 1) * 6 }));
      if (s % 4 === 2) tone(ch.notes[((s / 4) | 0) % 3] * 2, 0.4, { at: t, vol: 0.03 });
      return;
    }
    const L = M.level;
    if (L >= 1) {
      // ドラム
      if (s % 4 === 0) kick(t);
      if (s % 4 === 2) hat(t, 0.09);
      else if (s % 2 === 1) hat(t, 0.03);
      if (s === 4 || s === 12) clap(t);
    }
    if (L >= 2 && s % 2 === 0) tone(ch.bass * (s % 4 === 2 ? 2 : 1), 0.2, { at: t, type: 'sawtooth', vol: 0.22, lp: 700, q: 3 }); // ベース
    if (L >= 3) tone(ch.notes[s % 3] * (s % 8 < 4 ? 2 : 4), 0.12, { at: t, type: 'square', vol: 0.045, lp: 2600 }); // アルペジオ
    if (L >= 4 && s === 0)
      ch.notes.forEach((f, i) => tone(f, 1.9, { at: t, type: 'sawtooth', vol: 0.035, attack: 0.05, lp: 1500, detune: (i - 1) * 8 })); // コード
    if (L >= 5 && LEAD[s]) tone(LEAD[s], s === 14 ? 0.5 : 0.22, { at: t, type: 'square', vol: 0.05, lp: 3200 }); // メロディ
  };

  // 凍結の手前: テープが止まるように、鳴っている音の音程を下げ、刻みの間隔を伸ばし、こもらせる
  M.windDown = dur => {
    const c = Sound.ctx;
    if (!c || M.mode !== 'play') return;
    const now = c.currentTime;
    const end = now + Math.max(0.2, dur);
    M.mode = 'wind';
    M.windT0 = now;
    M.windEnd = end;
    M.stretch = 1;
    for (const v of M.voices) {
      if (v.end < now) continue;
      try {
        const p = v.node.detune || v.node.playbackRate;
        const to = v.node.detune ? -1200 * OCT : Math.pow(2, -OCT);
        p.cancelScheduledValues(now);
        p.setValueAtTime(p.value, now);
