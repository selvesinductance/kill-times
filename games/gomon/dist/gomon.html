    if (type === 'log') {
      // 手づくりの太い丸太の橋：太さも長さも少しずつちがう丸太を横に並べ、太い杭と丸太の手すりを縄でしばる
      const r = rng || Math.random, tone = () => 0.72 + r() * 0.4;
      const deck = [], dc = [];
      for (let z = z0 - 0.36; z > z1 + 0.3; z -= 0.66 + (r() - 0.5) * 0.08) {
        const rad = 0.3 + r() * 0.08, ext = (r() - 0.5) * 0.7;
        deck.push([x + ext * 0.4, 0.05 - rad + r() * 0.025, z, rad, RIVER.BW + 0.35 + ext, rad, (r() - 0.5) * 0.4, 0, Math.PI / 2 + (r() - 0.5) * 0.035]);
        dc.push(tone());
      }
      inst(root, GEO.ucyl, [BMAT.bark, BMAT.logEnd, BMAT.logEnd], deck, dc);
      const big = [], bc = [], ropes = [];
      for (const sd of sides) { big.push([x + sd * (hw - 1.3), -0.72, zc, 0.42, len, 0.42, Math.PI / 2]); bc.push(0.8); } // 床の下の太い桁
      const pz = rail ? along(z0, z1, 2.7, 0.5) : [];
      for (const sd of rail ? sides : []) {
        pz.forEach((z, i) => {
          if (inGap(sd, z) || (i < pz.length - 1 && inGap(sd, pz[i + 1]))) { if (!inGap(sd, z)) { const px = x + sd * (hw - 0.12); big.push([px, 0.62, z, 0.2, 1.4, 0.2]); bc.push(tone()); } return; }
          const px = x + sd * (hw - 0.12), lean = (r() - 0.5) * 0.07;
          big.push([px, 0.62, z, 0.19 + r() * 0.03, 1.4, 0.19 + r() * 0.03, lean, 0, (r() - 0.5) * 0.07]); bc.push(tone());
          ropes.push([px, 1.12, z, 0.22, 0.16, 0.22]); // 縄のしばり目
          if (i < pz.length - 1) { // 手すりの丸太（1本ずつ少し傾く）
            const zn = pz[i + 1], dy = (r() - 0.5) * 0.1;
            big.push([px, 1.16 + dy / 2, (z + zn) / 2, 0.12, z - zn + 0.35, 0.12, Math.PI / 2 + dy / (z - zn), 0, 0]); bc.push(tone());
          }
        });
        for (const [a, b] of pieces(sd, z0 - 0.5, z1 + 0.5)) ropes.push([x + sd * (hw - 0.12), 0.6, (a + b) / 2, 0.05, a - b, 0.05, Math.PI / 2]); // 下の段は縄
      }
      for (const z of along(z0, z1, 5.5, 1.8)) for (const sd of sides) { big.push([x + sd * (hw - 0.9), -1.85, z, 0.27 + r() * 0.06, 2.8, 0.27 + r() * 0.06, (r() - 0.5) * 0.08, 0, (r() - 0.5) * 0.08]); bc.push(tone() * 0.85); }
      for (const z of along(z0, z1, 11, 4)) { // 杭どうしをつなぐ筋交い（×の形）
        const w = 2 * (hw - 0.9), hgt = 1.3, l2 = Math.hypot(w, hgt), th = Math.atan2(w, hgt);
        for (const sg of [-1, 1]) { big.push([x, -1.45, z, 0.13, l2, 0.13, 0, 0, sg * th]); bc.push(tone() * 0.85); }
      }
      for (const z of ends(0.35, 0.35)) for (const sd of sides) { // 親柱：いちばん太い丸太
        big.push([x + sd * (hw - 0.15), 1.0, z, 0.38, 2.1, 0.38]); bc.push(tone());
        ropes.push([x + sd * (hw - 0.15), 1.55, z, 0.42, 0.2, 0.42], [x + sd * (hw - 0.15), 1.25, z, 0.42, 0.14, 0.42]);
      }
      inst(root, GEO.ucyl, [BMAT.bark, BMAT.logEnd, BMAT.logEnd], big, bc);
      inst(root, GEO.ucyl, BMAT.rope, ropes);
    } else if (type === 'stone') {
      add(deckMesh(RIVER.BW, 0.9, len, BMAT.stoneDeck, 2, len / 5), x, -0.42, zc);
      const ag = archGeo(len, RIVER.BW - 0.4);

  }
  // 曲がる橋（立体交差・アンコールの輪）：道の線（高さつき）に沿って、同じ種類の橋をつくる
  // avoid(x, z, kind)：ほかの橋の床の上なら true（そこには欄干（kind = 'rail'）・杭（'pier'）を立てない）
  const MAT2 = {};

  // 曲がる橋とアンコールの張り出しに共通の、欄干と床の下の杭（部品は parts にためて、最後に flushParts でまとめて置く）
  //   post(p, i)：欄干の柱（i 本目。石の橋は6本に1本を太い柱に、現代的な橋は10本に1本に明かりをつける）

  const newParts = () => ({ logs: [], lt: [], big: [], bt: [], ropes: [], box: [], dark: [], steel: [], lamps: [], cols: [] });

        pier: (p) => { const h = p.y - RIVER.BED_Y - 0.4; parts.big.push(mAt(p.x, p.y - 0.4 - h / 2, p.z, 0.29, h, 0.29)); parts.bt.push(tone() * 0.85); },

      return {
        post: (p, i) => { if (i % 6 === 0) { parts.box.push(mAt(p.x, p.y + 0.55, p.z, 0.66, 1.1, 0.66)); parts.dark.push(mAt(p.x, p.y + 1.16, p.z, 0.8, 0.14, 0.8)); } },

      post: (p, i) => {

      },
      seg: (a, b) => { for (const y of [1.14, 0.12]) parts.steel.push(mSeg(raise(a, y), raise(b, y), 0.1, 0.08)); },
      pier: (p) => { const top = p.y - 0.8, h = top - RIVER.BED_Y; parts.cols.push(mAt(p.x, top - h / 2, p.z, 0.36, h, 0.36)); },

  }
  function flushParts(root, type, parts) {

      instM(root, GEO.ubox, BMAT.redSteel, parts.steel);

  function buildCurveBridge(root, type, pts, rng, avoid, river) {
    const P = pathThrough(pts);

    avoid = avoid || (() => false);

    const fr = (s) => { const a = P.at(s); return { c: V(a.x, (a.y || 0) + 0.045, a.z), n: V(-a.hz, 0, a.hx), t: V(a.hx, 0, a.hz) }; }; // まっすぐの橋（0.03）と重なってもちらつかないよう、少しだけ高く
    const off = (f, d, dy) => f.c.clone().addScaledVector(f.n, d).add(V(0, dy || 0, 0));
    const ss = (step, pad) => { const out = [], n = Math.max(1, Math.round((P.len - 2 * pad) / step)); for (let i = 0; i <= n; i++) out.push(pad + ((P.len - 2 * pad) * i) / n); return out; };

      for (const sd of sides) root.add(stripMesh(rows.map((f) => [off(f, sd * hw), off(f, sd * hw, -th)]), sideMat, 1));

        parts.logs.push(mSeg(off(f, ext, 0.02 - rad), off(f, -ext, 0.02 - rad), rad)); parts.lt.push(tone());
      }

      for (const sd of sides) railLine(sd, hw - 0.12, 2.7, 0.5);

  // アンコールの張り出し：橋の床が外へ丸くふくらんだ形（穴はない）。欄干はふちに沿って曲げる

  }

  // ---------- 陸の道の帯と、道すじに沿った矢印 ----------
  function ribbonMesh(pts, width, mat, yOff) {
    const pos = [], idx = [], nrm = [];

      const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];

      const dl = Math.hypot(b.x - a.x, b.z - a.z) || 1, slope = ((b.y || 0) - (a.y || 0)) / dl;

    const xz = (v) => [pos[v * 3], pos[v * 3 + 2]];

    for (let i = 0; i < pts.length - 1; i++) {
      const [ax, az] = xz(2 * i), [bx, bz] = xz(2 * i + 1), [cx, cz] = xz(2 * i + 2);

    for (let i = 0; i < pts.length - 1; i++) {

    }

  // 五門の兵：川：岸の線（入り江・半島・中州）、水面と土手、川の飾り（葦・岩・蓮・魚）、川の音の聞こえ方
  // （src/ui/ のファイルは、build.py が決まった順につなげて1つの関数に入れる。変数はすべてのファイルで共有）

  // ---------- 川（太い1本の川。地面の端から端まで） ----------
  // 手前の岸は橋の正面だけ川へ張り出し、橋と橋の間は自然な形の入り江になる。
  // レーンが決まる線（RIVER.LOCK）は入り江のいちばん奥より少し手前で、どのステージでも同じ位置。
  // 岸の線（x が増える向きに並んだ点）。
  // 橋が出ていく岸は、橋の正面だけ張り出して、間は入り江（レーンが決まる線は入り江の奥の少し手前）。
  // 橋が着く岸は、橋の間が少し張り出す。spec：
  //   nearCols / farCols：橋の両はしの x の組（並び順）、farEdge：向こう岸で橋が着く z、padHalf：向こうの道の半分の幅
  //   farCoast(x, base)：向こう岸の外側の形を変えるとき（アンコールの張り出しの横）

  //   nearBay：{ x0, x1, z }（手前の岸の x0〜x1 を z まで下げる。U字路の中州のまわり）
  //   island：{ z0, z1, IW: [左, 右], xc, colsA, colsB, lock, colsS, flat, sand }
  //     中州：手前の橋（colsA）が z0 に着き、先の橋（colsB）が z1 から出る

  function decorateRiver(root, geo, seed) {

    const shore = (line, sg, kind) => {

        if (Math.abs(a.x - xMid) > 95 && Math.abs(b.x - xMid) > 95) continue;
        for (let u = rng() * 1.8; u < L; u += 1.4 + rng() * 1.6) {
          const t = u / (L || 1), x = a.x + (b.x - a.x) * t, z = a.z + (b.z - a.z) * t;

              dummy.position.set(wx + Math.cos(th) * r + nx * (rng() - 0.3) * 0.6, RIVER.WATER_Y - 0.15, wz + Math.sin(th) * r + nz * (rng() - 0.3) * 0.6);
              dummy.rotation.set((rng() - 0.5) * 0.5, rng() * 6.28, (rng() - 0.5) * 0.5);
              dummy.scale.set(1, h, 1); dummy.updateMatrix(); reeds.push(dummy.matrix.clone());
              const c = new THREE.Color();
              if (dry) c.setHSL(0.1 + rng() * 0.04, 0.38 + rng() * 0.14, 0.46 + rng() * 0.14); else c.setHSL(0.21 + rng() * 0.09, 0.42 + rng() * 0.2, 0.3 + rng() * 0.16);

            const c = new THREE.Color(), v = 0.42 + rng() * 0.2;

    // 蓮の葉：岸から少し離れた水の上に、いくつか集めて浮かべる

            dummy.scale.set(sc, 1, sc); dummy.updateMatrix(); pads.push(dummy.matrix.clone());

    shore(rv.near, 1, 'near');
    shore(rv.far, -1, 'far');

    instM(root, REED_GEO, DECO_MAT.reed, reeds, reedC);

    // 泳ぐ魚：水面に映る影。ときどき1匹が跳ねる
    const fish = [];

      if (water(x, z, 3)) fish.push({ x, z, a: rng() * 6.28, v: 1 + rng() * 1.3, s: 0.9 + rng() * 0.7, ph: rng() * 6.28, turn: 0 });

    const fm = new THREE.InstancedMesh(FISH_GEO, FISH_MAT, Math.max(1, fish.length));

  // 川の音を聞く位置：ふつうはカメラ。真上から見下ろすときは、見ているところ（画面の真ん中の地面）の少し上で聞く
  const earPos = new THREE.Vector3();
  function ear() {

  // 五門の兵：コースを組み立てる・片づける、ボス、入口のハイライト、ボスの HP バー

  function buildBoss(reverse) {

  function buildCourse(stage, seed) {

  const sold = { x: 0, y: 0, z: RIVER.WAIT, tx: 0, hx: 0, hz: -1, lean: 0, moving: false, n: 5n, units: [], bw: 0, bd: 0, suck: 0, holeX: 0, holeY: 0, holeZ: 0 };
  const C_POS = new THREE.Color(0x2f6bd8), C_POS2 = new THREE.Color(0x6aa2f5), C_NEG = new THREE.Color(0xa24ad8), C_NEG2 = new THREE.Color(0xd8a4f7);
  function layoutUnits() {

  // k ≧ 7 の黒い旗：地は rgb(k,k,k)、そこに「10ᵏ」を白い文字・赤い縁取りで書く（k ごとに1枚の旗の絵を作って使い回す）
  const LFLAGS = new Map();
  function labeledFlag(k) {
    let L = LFLAGS.get(k);

      const v = Math.min(255, k);

  // 10ᵏ人隊の旗の色：白 → 緑 → 青 → 紫 → 金 →（虹）→ rgb(k,k,k)（k ≧ 7、だんだん明るく）→ 255 からはずっと白

  // ---------- 橋に入ったあと横へ動かそうとしたとき：欄干にコツンと当たる（音・兵士の小さなゆれ・欄干が一瞬光る） ----------
  const bump = { t: 9, side: 0, cool: 0 };

  function tryBump(wx) {
    if (game.screen !== 'game' || game.phase !== 'run' || !game.run || game.run.plaza || !course || paused) return;
    if (bump.cool > 0 || !wx) return;
    const br = course.onBridge(sold.x, sold.z);

  // 五門の兵：演出：火花・土ぼこり・煙、画面の光、ブラックホール、バグ（警告ウィンドウ）、演出の後かたづけ
  // （src/ui/ のファイルは、build.py が決まった順につなげて1つの関数に入れる。変数はすべてのファイルで共有）

  // ---------- 効果（火花と土ぼこり） ----------
  const FX = [];
  const sparkGeo = new THREE.OctahedronGeometry(0.5, 0), puffGeo = new THREE.SphereGeometry(1, 10, 8), poofGeo = new THREE.BoxGeometry(1, 1, 1);
  function spawnFx(kind, x, y, z) {
    let f = FX.find((q) => q.life <= 0 && q.kind === kind);
    if (!f) {
      if (FX.length >= 110) return;
      const spark = kind === 'spark';
      const m = new THREE.Mesh(spark ? sparkGeo : kind === 'poof' ? poofGeo : puffGeo, new THREE.MeshBasicMaterial({ color: spark ? 0xfff0b0 : 0xe6d8b8, transparent: true, depthWrite: false, blending: spark ? THREE.AdditiveBlending : THREE.NormalBlending }));
      scene.add(m);

    }
    const spark = kind === 'spark';
    if (kind === 'poof') {
      f.life = f.max = 0.7 + Math.random() * 0.5;
      f.m.position.set(x, y, z);
      f.m.material.color.setScalar(0.78 + Math.random() * 0.22); // 白〜明るい灰色
      f.vx = (Math.random() - 0.5) * 2.4; f.vy = 1.5 + Math.random() * 2; f.vz = (Math.random() - 0.5) * 2.4;
      f.s0 = 0.7 + Math.random() * 0.8;

    f.m.position.set(x, y, z);
    f.vx = (Math.random() - 0.5) * (spark ? 7 : 3); f.vy = spark ? 2 + Math.random() * 4 : 0.5 + Math.random(); f.vz = (Math.random() - 0.5) * (spark ? 7 : 3);

  }
  function updateFx(dt) {
    for (const f of FX) {
      if (f.life <= 0) continue;

      const k = 1 - f.life / f.max;
      f.m.position.x += f.vx * dt; f.m.position.y += f.vy * dt; f.m.position.z += f.vz * dt;
      if (f.kind === 'spark') { f.vy -= 14 * dt; f.m.scale.setScalar(f.s0 * (1 - k)); f.m.material.opacity = 1 - k; f.m.rotation.y += dt * 8; }

  // 画面全体にかぶせる光と影（3D の上、上のバナーの下）
  function screenFx(kind) {

  // ---------- ブラックホール：巨大な黒い球へ、たくさんの粒が渦を巻いて吸い込まれていく ----------
  const BH_R = 10, BH_Y = 10.5, BH_N = 3200, BH_OUT = 38;
  // ブラックホールが出ている間は、空も地面も暗い紫に沈める（粒の光が映える）
  const DIM_SKY = new THREE.Color(0x2a1648), DIM_FOG = new THREE.Color(0x1a0d30), BASE_FOG = new THREE.Color(HORIZON);
  let worldDim = 0;
  function applyDim(d) {

  // 粒は4本の腕の根もと（外側の決まった角度）から次々と流れ込むので、流れた跡がそのまま渦の腕になる
  function spawnBH(h, i) {
    const far = i % 7 === 0; // 一部は腕に乗らず、遠くの地面や空から飛んでくる
    h.r[i] = far ? BH_OUT * (1 + Math.random() * 0.5) : BH_OUT * (0.9 + Math.random() * 0.1);
    h.a[i] = (i % 4) * (Math.PI / 2) + (Math.random() - 0.5) * (far ? 6.3 : 0.45);
    h.y[i] = (Math.random() - 0.5) * (far ? 22 : 1.4);

  function stepBH(h, i, dt, cr, speed) {

  function makeHole(g) {
    if (!dotTex) {

      glowTex = radialTex([[0, 'rgba(150,80,255,0.6)'], [0.45, 'rgba(120,60,255,0.35)'], [1, 'rgba(40,10,90,0)']]);
    }

    grp.position.set(g.x, BH_Y, g.z);
    grp.rotation.y = Math.atan2(-sold.hx, -sold.hz);
    const core = new THREE.Mesh(new THREE.SphereGeometry(1, 40, 24), new THREE.MeshBasicMaterial({ color: 0x000000, fog: false }));
    const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false }));
    const disk = new THREE.Group();
    disk.rotation.x = 0.8; // 渦の面を後ろ（カメラ）側へ傾けて、巻き込むようすを見せる
    const pos = new Float32Array(BH_N * 3), cols = new Float32Array(BH_N * 3);

    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(cols, 3));

    pts.frustumCulled = false;
    disk.add(pts);

    const h = { grp, core, glow, disk, geo, pos, cols, t: 0, r: new Float32Array(BH_N), a: new Float32Array(BH_N), y: new Float32Array(BH_N), v: new Float32Array(BH_N) };
    // 最初から腕ができているように、それぞれの粒をばらばらの時間だけ先に流しておく
    for (let i = 0; i < BH_N; i++) { spawnBH(h, i); for (let n = Math.floor(Math.random() * 80); n > 0; n--) stepBH(h, i, 0.05, BH_R * 0.5, 1); }
    // 近くのゲートも吸い込む
    h.gates = course.gates.map((gt) => ({ gt, d: Math.hypot(gt.x - g.x, gt.z - g.z), x0: gt.group.position.x, z0: gt.group.position.z })).filter((q) => q.d < 34);

  }
  function updateHole(dt) {
    const h = hole;
    h.t += dt;

      if (q < 0.18) { const k = q / 0.18; R = 1; Gc = 0.95 - 0.4 * k; B = 0.8 - 0.65 * k; } // 白 → オレンジ

  // 残り時間を長押しすると早送り

  const LEFT_KEYS = ['ArrowLeft', 'a', 'A'], RIGHT_KEYS = ['ArrowRight', 'd', 'D'], DOWN_KEYS = ['ArrowDown', 's', 'S'], UP_KEYS = ['ArrowUp', 'w', 'W'];

  // 指を動かさずに離したら（タップ・クリック）、兵士はクリックしたところと同じ高さ（画面の縦の位置）へ寄っていく
  function groundAt(cx, cy) {
    const r = app.getBoundingClientRect();
    v3.set(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1, 0.5).unproject(camera);
    const dx = v3.x - camera.position.x, dy = v3.y - camera.position.y, dz = v3.z - camera.position.z;

  }

  // ---------- 毎フレーム ----------
  function resize() {

  let glyphs = '';

  function updateEntryHints() {
    const showA = game.screen === 'game' && (game.phase === 'intro' || game.phase === 'choose');

    course.highlight.visible = course.marker.visible = showA || showB;

  }

  const hint = document.createElement('div');
  hint.className = 'swipe-hint';
  hint.innerHTML = '<svg class="arr" aria-hidden="true"><path/></svg><span class="tx">スワイプして<br>行き先変更</span>';
  labelsEl.appendChild(hint);
  let hintLen = 0;
  function updateHint() {
    const show = course && game.screen === 'game' && game.phase === 'choose' && !game.touched && !(game.go && !game.timer) && !paused;
    if (!show) { hint.style.visibility = 'hidden'; return; }
    const fr = course.geo.freeA, zH = lockZ() + 9;
    const a = project(fr.x0 - 1, 0, zH), b = project(fr.x1 + 1, 0, zH);
    if (a.z > 1 || b.z > 1) { hint.style.visibility = 'hidden'; return; }
    const L = Math.max(60, Math.hypot(b.x - a.x, b.y - a.y)), ang = Math.atan2(b.y - a.y, b.x - a.x);
    const svg = hint.firstChild;
    if (Math.abs(L - hintLen) > 2) {
      hintLen = L;
      const H = 34, hl = 26, t = 12, m = H / 2;
      svg.setAttribute('width', L.toFixed(0));
      svg.setAttribute('height', String(H));
      svg.firstChild.setAttribute('d', 'M0 ' + m + 'L' + hl + ' 0V' + (m - t / 2) + 'H' + (L - hl) + 'V0L' + L + ' ' + m + 'L' + (L - hl) + ' ' + H + 'V' + (m + t / 2) + 'H' + hl + 'V' + H + 'Z');
    }
    hint.style.visibility = 'visible';
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    hint.style.transform = 'translate3d(' + mx.toFixed(1) + 'px,' + my.toFixed(1) + 'px,0)';
    svg.style.transform = 'translate(-50%,-50%) rotate(' + ang.toFixed(3) + 'rad)';
    // 札は矢印の下に少し離して置く。下に入らなければ矢印の横（右、だめなら左）、最後は上
    const tx = hint.lastChild, tw = tx.offsetWidth || 110, th = tx.offsetHeight || 40;
    const vertical = Math.abs(Math.cos(ang)) < 0.5;
    const low = a.y > b.y ? a : b, right = a.x > b.x ? a : b, left = a.x > b.x ? b : a;
    const Wd = app.clientWidth, rs = screenReserve();
    const minY = rs.top + 6, maxY = rs.ctlTop - 8, gap = 22;
    const cands = vertical
      ? [[low.x, low.y + gap + th / 2], [mx + 17 + gap + tw / 2, my], [mx - 17 - gap - tw / 2, my]]
      : [[mx, my + 17 + gap + th / 2], [right.x + gap + tw / 2, right.y], [left.x - gap - tw / 2, left.y], [mx, my - 17 - gap - th / 2]];
    const fits = ([x, y]) => x - tw / 2 >= 8 && x + tw / 2 <= Wd - 8 && y - th / 2 >= minY && y + th / 2 <= maxY;
    if (camMode === 'over') {
      // 真上から見ているときは、道の外の芝生（−x の側：横長なら道の下、縦長なら道の左）に置く
      const rd = course.geo.road, e0 = project(rd.x0 - 2, 0, zH), e1 = project(rd.x0 - 6, 0, zH);
      let dx = e1.x - e0.x, dy = e1.y - e0.y; const dl = Math.hypot(dx, dy) || 1; dx /= dl; dy /= dl;
      const half = Math.abs(dx) * tw / 2 + Math.abs(dy) * th / 2;
      // 芝生の幅が足りないときは、矢印に重ならない範囲で画面の内側へ寄せる（スマホなら矢印の左側になる）
      const gx = Math.max(tw / 2 + 8, Math.min(Wd - tw / 2 - 8, e0.x + dx * (12 + half)));
      const gy = Math.max(minY + th / 2, Math.min(maxY - th / 2, e0.y + dy * (12 + half)));
      const mX = vertical ? 21 : 4, mY = vertical ? 4 : 21; // 矢印の太さの方向だけ余白をとる
      const ax0 = Math.min(a.x, b.x) - mX, ax1 = Math.max(a.x, b.x) + mX, ay0 = Math.min(a.y, b.y) - mY, ay1 = Math.max(a.y, b.y) + mY;
      const clear = gx + tw / 2 < ax0 || gx - tw / 2 > ax1 || gy + th / 2 < ay0 || gy - th / 2 > ay1;
      if (clear) cands.unshift([gx, gy]);
    }
    let [lx, ly] = cands.find(fits) || cands[0];
    lx = Math.max(tw / 2 + 8, Math.min(Wd - tw / 2 - 8, lx));
    ly = Math.max(minY + th / 2, Math.min(maxY - th / 2, ly));
    tx.style.transform = 'translate(-50%,-50%) translate(' + (lx - mx).toFixed(1) + 'px,' + (ly - my).toFixed(1) + 'px)';
  }

  // 一度操作したあと10秒なにもしなければ、残り時間の下に「長押しで早送り」を出す
  const ffHint = document.createElement('div');
  ffHint.className = 'ff-hint';
  ffHint.innerHTML = '長押しで<br>早送り';
  ffHint.hidden = true;
  app.appendChild(ffHint);
  function updateFFHint() {
    const show = game.screen === 'game' && game.phase === 'choose' && game.timer && game.touched && !game.ff && !paused && clock - (game.lastOp || 0) >= 10 && !$('timer').hidden;
    if (!show) { if (!ffHint.hidden) ffHint.hidden = true; return; }
    ffHint.hidden = false;
    const ar = app.getBoundingClientRect(), tr = $('timer').getBoundingClientRect(), hr = $('hud').getBoundingClientRect();
    const w = ffHint.offsetWidth, tc = (tr.left + tr.right) / 2 - ar.left;
    const left = Math.max(8, Math.min(ar.width - w - 8, tc - w / 2));
    const top = Math.max(tr.bottom, hr.bottom) - ar.top + 12;
    ffHint.style.transform = 'translate(' + left.toFixed(1) + 'px,' + top.toFixed(1) + 'px)';
    ffHint.style.setProperty('--ax', (tc - left).toFixed(1) + 'px');
  }

  let last = performance.now(), clock = 0;
  function tick(now) {
    const raw = Math.min(0.05, (now - last) / 1000) * (window.__gomonTimeScale || 1);
    last = now;
    const dt = paused ? 0 : raw;
    clock += dt;
    if (game.screen === 'game' && !paused) update(game.ff && game.phase === 'choose' ? dt * 6 : dt);
    TRIM[4].emissiveIntensity = 0.55 + 0.45 * Math.sin(clock * 4);
    RAINBOW.offset.set((clock * 0.15) % 1, (clock * 0.15) % 1);
    WATER_TEX.offset.x = (clock * 0.05) % 1; // 川は横へゆっくり流れる
    if (course) updateFish(course.fish, dt);
    if (game.screen === 'game') { brookNear(riverNearness()); brookDrops(dt); }
    updateBump(dt);
    if (course) {
      for (const g of course.gates) {
        if (g.flash > 0) { g.flash = Math.max(0, g.flash - dt * 1.6); g.flashMat.opacity = g.flash * 0.8; }
        for (const e of g.extras) e.rotation.y += dt * (g.type.cat === 'rand' ? 0.6 : 1.4);
      }
      updateEntryHints();
      const hl = course.highlight, ht = course.hlTarget;
      hl.position.x += (ht.x - hl.position.x) * 0.25;
      hl.position.z = (ht.z0 + ht.z1) / 2;
      hl.position.y = 0.08;
      hl.scale.set(ht.w - 0.8, ht.z0 - ht.z1, 1);
      MAT.highlight.opacity = 0.22 + 0.1 * Math.sin(clock * 4);
    }
    if (hole) updateHole(dt);
    updateFx(dt);
    updateGlyphs();
    updateCamera(raw);
    drawArmy(clock);
    renderer.render(scene, camera);
    updateLabels(dt);
    updateHint();
    updateFFHint();
    updateItemUI();
    requestAnimationFrame(tick);
  }
  function update(dt) {
    game.phaseT += dt;
    const geo = course.geo;
    if (game.phase === 'intro' || game.phase === 'choose') {
      freeMove(dt, geo.freeA);
      sold.hx = 0; sold.hz = -1;
      if (game.go) { sold.z -= RUN_SPEED * dt; sold.moving = true; }
      else { const dz = (waitZ() - sold.z) * Math.min(1, dt * 1.6); sold.z += dz; sold.moving = Math.abs(dz) > RUN_SPEED * dt * 0.15; }
      if (game.phase === 'intro') {
        if (game.phaseT > INTRO_SEC) enterChoose();
        return;
      }
      if (game.timer) {
        const left = Math.max(0, (sold.z - lockZ()) / RUN_SPEED);
        const sec = Math.ceil(left - 1e-6);
        $('timer').textContent = String(sec);
        $('timer').classList.toggle('hurry', left <= 5);
        if (sec < lastTick && sec <= 5 && sec > 0) sfx('tick');
        lastTick = sec;
      }
      if (sold.z <= lockZ()) lockIn();
    } else if (game.phase === 'run') {
      const run = game.run;
      const seg = run.segs[run.seg];
      if (seg.plaza) {
        const pz = geo.plaza;
        if (!run.plaza) enterPlaza();
        sold.hx += (0 - sold.hx) * Math.min(1, dt * 6); sold.hz += (-1 - sold.hz) * Math.min(1, dt * 6);
        sold.y = 0;
        freeMove(dt, pz.free);
        if (game.timer || run.go) { sold.z -= RUN_SPEED * dt; sold.moving = true; }
        else { const dz = (pz.zMid - sold.z) * Math.min(1, dt * 2.5); sold.z += dz; sold.moving = Math.abs(dz) > RUN_SPEED * dt * 0.15; }
        if (sold.z <= pz.zLock) leavePlaza();
        return;
      }
      sold.moving = true;
      sold.lean += (0 - sold.lean) * Math.min(1, dt * 6);
      run.s += RUN_SPEED * dt;
      while (seg.gi < seg.events.length && seg.events[seg.gi].s <= run.s) {
        const ok = applyStep(seg.events[seg.gi++].step);
        if (!ok) return;
      }
      const p = seg.at(run.s);
      sold.x = sold.tx = p.x; sold.z = p.z; sold.y = p.y;
      sold.hx += (p.hx - sold.hx) * Math.min(1, dt * 8); sold.hz += (p.hz - sold.hz) * Math.min(1, dt * 8);
      const hl = Math.hypot(sold.hx, sold.hz) || 1; sold.hx /= hl; sold.hz /= hl;
      // 橋の上では、橋の種類ごとの足音
      const br = course.onBridge(sold.x, sold.z);
      if (br) { run.stepT = (run.stepT || 0) - dt; if (run.stepT <= 0) { run.stepT = 0.25 + Math.random() * 0.03; run.stepAlt = !run.stepAlt; stepSound(br.type, run.stepAlt); } }
      else run.stepT = 0;
      if (keys.l !== keys.r) tryBump(keys.r ? 1 : -1);
      if (run.s >= seg.len) {
        if (run.seg < run.segs.length - 1) { run.seg++; run.s = 0; }
        else enterClash();
      }
    } else if (game.phase === 'clash') {
      updateClash(dt);
    } else if (game.phase === 'mine') {
      if (hole) sold.suck = Math.min(1, game.phaseT / BH_GROW);
      if (game.mine === G.MINE_BUG) {
        updateErrWins(game.phaseT);
        if (Math.random() < dt * 5) shake = Math.max(shake, 0.6); // ときどきガクッとゆれる
      }
      if (game.phaseT > MINE_SEC) finish();
    }
  }

  // テストと撮影のための入口（遊ぶ人には関係しない）
  window.__gomon = { game, sold, bump, riverNearness: () => riverNearness(), camInfo: () => { const rv = course.geo.river, q = camera.position; let h = 0; if (!rv.inRiver(q.x, q.z, 0)) { const nz = rv.nearZ(q.x), fz = rv.farZ(q.x); h = q.z > nz ? q.z - nz : q.z < fz ? fz - q.z : 0; } return { y: Math.round(q.y), d: Math.round(Math.hypot(h, q.y - RIVER.WATER_Y)) }; }, get camMode() { return camMode; }, get course() { return course; }, drawFormula, gateHTML, EXAMPLE, setArmy, peek(v) { peek = v; } };

  // ---------- 起動（更新されても、遊んでいたモードとステージから再開） ----------
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
    try { window.claude.hot.snapshot(() => ({ screen: game.screen, mode: game.mode, diff: game.diff, timer: game.timer, stageNo: game.stageNo, items: game.items })); } catch (e) { /* なくても動く */ }
  }
  function boot(data) {
    data = data || {};
    refreshTitleLines();
    toTitle();
    if (data.screen === 'game' && data.mode) {
      if (typeof data.timer === 'boolean') game.timer = data.timer;
      startGame(data.mode, data.diff, data.stageNo || 1);
      if (data.mode === 'endless' && game.stageNo > 1) game.items = Math.max(0, data.items | 0);
    }
    requestAnimationFrame((t) => { last = t; tick(t); });
  }
  const hot = window.claude && window.claude.hot;
  if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
})();

</script>
